<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16202E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="A turn-based strategy game: explore, grow cities, research and conquer. Runs offline on this device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tribelands</title>
<style>
:root{
  --sea:#0F2A3A;
  --panel:rgba(253,250,243,.98);
  --ink:#1F2328;
  --muted:#5B6470;
  --faint:#8A929E;
  --line:#E6E0D4;
  --btn:#F1ECE1;
  --btn-ink:#1F2328;
  --accent:#E0662F;
  --accent-ink:#fff;
  --sea-btn:#1F8C8A;
  --good:#2E9E5B;
  --bad:#D23F3A;
  --star:#E0A21A;
  --shadow:0 6px 24px rgba(8,20,28,.3);
  --radius:20px;
  --ph:120px;                      /* height of the bottom panel, set by the game */
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:rgba(26,32,38,.98); --ink:#F1EEE8; --muted:#AEB5BF; --faint:#7F8894;
    --line:#35404A; --btn:#2B343D; --btn-ink:#F1EEE8; --accent:#F07C45;
    --shadow:0 6px 24px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --panel:rgba(26,32,38,.98); --ink:#F1EEE8; --muted:#AEB5BF; --faint:#7F8894;
  --line:#35404A; --btn:#2B343D; --btn-ink:#F1EEE8; --accent:#F07C45;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  overscroll-behavior:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:disabled{cursor:default}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.grow{flex:1}

/* every pressable thing gives a little under the thumb */
.chip,.tool,.fab,.act,.big,.tn,.reward,.tribe{transition:transform .08s ease, filter .08s ease}
.chip:active,.tool:active,.fab:not(:disabled):active,.act:not(:disabled):active,.big:not(:disabled):active,.tn:active,.reward:active,.tribe:active{transform:scale(.95);filter:brightness(.94)}

/* ---- HUD ---- */
#hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;pointer-events:none;z-index:3}
#hud > *{pointer-events:auto}
.chip{background:var(--panel);box-shadow:var(--shadow);border-radius:999px;height:50px;
  display:flex;align-items:center;gap:6px;padding:0 13px;font-weight:700;white-space:nowrap;font-size:18px}
.chip b{font-weight:800}
.chip small{font-weight:700;color:var(--good);font-size:15px}
.chip .dot{width:16px;height:16px;border-radius:5px;transform:rotate(45deg);flex:none}
.chip.idol{padding:0 13px;background:#3B2F1E;color:#FFE08A}
.tool{width:52px;height:54px;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tool i{font-style:normal;font-size:22px;line-height:1}
.tool span{font-size:11px;font-weight:700;color:var(--muted)}

/* ---- floating buttons above the panel ---- */
#fabs{position:fixed;left:0;right:0;bottom:calc(var(--ph) + 10px);display:flex;gap:10px;align-items:flex-end;
  padding:0 12px;pointer-events:none;z-index:2;transition:bottom .15s ease}
#fabs > *{pointer-events:auto}
.fab{height:60px;min-width:64px;border-radius:18px;background:var(--panel);box-shadow:var(--shadow);position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 12px;gap:1px}
.fab i{font-style:normal;font-size:22px;line-height:1}
.fab span{font-size:12px;font-weight:750;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fab:disabled{opacity:.45}
.fab.end{background:var(--accent);color:var(--accent-ink);min-width:104px;height:68px}
.fab.end span{font-size:14px}
.fab.end.nudge{animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.07);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 35%,transparent)}}
.fab.next b{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--good);color:#fff;
  font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.fab.next.none b{background:var(--faint)}

/* ---- bottom panel ---- */
#panel{position:fixed;left:0;right:0;bottom:0;background:var(--panel);box-shadow:var(--shadow);
  border-radius:var(--radius) var(--radius) 0 0;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 14px);
  max-height:46vh;overflow-y:auto;overflow-x:hidden;z-index:2;border-top:5px solid var(--selc, transparent)}
@media (min-width:760px){
  #panel{left:50%;transform:translateX(-50%);width:720px;bottom:12px;border-radius:var(--radius)}
  #fabs{max-width:760px;margin:0 auto}
}
#pinfo h3{margin:0;font-size:19px;line-height:1.25;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#pinfo p{margin:4px 0 0;color:var(--muted);font-size:15px}
.selwhat{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.tag{font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:7px;color:#fff}
.hpbar{display:inline-block;width:74px;height:9px;border-radius:5px;background:var(--line);overflow:hidden;vertical-align:middle}
.hpbar i{display:block;height:100%;background:var(--good)}
.pips{display:inline-flex;gap:4px;vertical-align:middle}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted)}
.pips i.on{background:var(--good);border-color:var(--good)}
.stat{font-size:15px;margin-left:10px;white-space:nowrap;color:var(--ink)}
.status{font-weight:750;color:var(--good)!important}
.status.done{color:var(--faint)!important}
.vet{color:var(--star);font-size:14px}

#pacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}
#pacts:empty{display:none}
@media (max-width:360px){ #pacts{grid-template-columns:1fr} }
.pacts1{display:grid;margin-top:8px}
.act{min-height:68px;border-radius:14px;background:var(--btn);color:var(--btn-ink);border:2px solid transparent;
  display:flex;align-items:flex-start;gap:10px;padding:10px 11px;text-align:left;width:100%}
.act > i{font-style:normal;font-size:26px;line-height:30px;flex:none;width:30px;text-align:center}
.act .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.act .hd{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 8px}
.act .hd b{overflow-wrap:anywhere}
.act b{font-size:15.5px;line-height:1.2}
.act small{font-size:13.5px;line-height:1.3;color:var(--muted)}
.act em{font-style:normal;font-size:13.5px;line-height:1.3;color:var(--bad);font-weight:650}
.act .c{flex:none;font-size:14.5px;font-weight:800;background:var(--panel);border-radius:9px;padding:4px 8px;color:var(--ink);white-space:nowrap}
.act:disabled > i{filter:grayscale(1);opacity:.55}
.act:disabled b{color:var(--muted)}
.act:disabled .c{opacity:.5}
.act.go{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--btn))}
.act.wide{grid-column:1 / -1}
.sec{grid-column:1 / -1;font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:6px}
.skills{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:7px}
.skill{font-size:13.5px;background:var(--btn);border-radius:9px;padding:5px 9px;color:var(--muted)}
.skill b{color:var(--ink)}
.hint{grid-column:1 / -1;font-size:14px;line-height:1.45;color:var(--muted);margin-top:2px}
.banner{grid-column:1 / -1;font-size:14.5px;line-height:1.4;background:color-mix(in srgb,var(--star) 18%,var(--btn));border-radius:12px;padding:10px 12px}

/* ---- toast ---- */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translateX(-50%);
  background:rgba(18,24,30,.94);color:#fff;padding:11px 18px;border-radius:16px;font-weight:650;font-size:15.5px;line-height:1.35;
  opacity:0;transition:opacity .25s;pointer-events:none;width:max-content;max-width:calc(100% - 32px);text-align:center;z-index:4}
#toast.show{opacity:1}

/* ---- modal sheets ---- */
.modal{position:fixed;inset:0;background:rgba(6,14,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
@media (min-width:760px){ .modal{align-items:center} }
.sheet{background:var(--panel);width:100%;max-width:580px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;
  padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 20px);box-shadow:var(--shadow)}
@media (min-width:760px){ .sheet{border-radius:24px} }
.sheet h2{margin:0 0 6px;font-size:24px;line-height:1.2}
.sheet h4{margin:18px 0 8px;font-size:13.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sheet p{margin:6px 0;font-size:16px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.big{min-height:56px;border-radius:16px;background:var(--btn);color:var(--btn-ink);font-weight:750;font-size:16.5px;padding:0 18px;flex:1;min-width:130px}
.big.primary{background:var(--accent);color:var(--accent-ink)}
.big.danger{color:var(--bad)}
.big:disabled{opacity:.5}
.seg{display:flex;background:var(--btn);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:48px;border-radius:11px;font-weight:700;color:var(--muted);font-size:16px}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.tribes{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media (max-width:380px){ .tribes{grid-template-columns:1fr} }
.tribe{border-radius:16px;padding:12px 13px;background:var(--btn);text-align:left;border:3px solid transparent;display:block}
.tribe.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--btn))}
.tribe b{display:flex;align-items:center;gap:8px;font-size:17px}
.tribe b i{width:15px;height:15px;border-radius:4px;background:var(--c);transform:rotate(45deg)}
.tribe span{display:block;font-size:13.5px;color:var(--muted);margin-top:5px;line-height:1.35}
.tribe .trait{color:var(--ink)}
.close{float:right;width:48px;height:48px;border-radius:50%;background:var(--btn);font-size:24px;line-height:48px}

/* skill web */
.web{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.web .day{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center}
.web .col{display:flex;flex-direction:column;gap:8px}
.tn{border-radius:14px;padding:9px 8px;background:var(--btn);min-height:64px;text-align:left;border:3px solid transparent;width:100%;position:relative}
.tn i{font-style:normal;font-size:20px;line-height:1;display:block}
.tn b{display:block;font-size:14px;line-height:1.2;margin-top:3px}
.tn span{display:block;font-size:12.5px;color:var(--muted)}
.tn.done{background:var(--c);color:#fff}
.tn.done span{color:rgba(255,255,255,.88)}
.tn.can{border-color:var(--good)}
.tn.locked{opacity:.5}
.tn.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent);opacity:1}
.tn.need{border-color:#3C8CE7;border-style:dashed;opacity:1}
.tn.lead{border-color:#9B6BE0;border-style:dotted;opacity:1}
.legend{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
.legend b{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.tdetail{border-top:1px solid var(--line);padding-top:14px;margin-top:12px;min-height:110px}
.unlocks{margin:0 0 12px;padding-left:0;list-style:none}
.unlocks li{padding:7px 0;border-bottom:1px solid var(--line);font-size:15.5px}

/* rewards and cards */
.reward{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:16px;border-radius:16px;background:var(--btn);text-align:left;flex:1;min-width:150px}
.reward i{font-style:normal;font-size:32px}
.reward b{font-size:18px}
.reward span{font-size:14.5px;color:var(--muted)}
.tcard{border-left:5px solid var(--c);background:var(--btn);border-radius:14px;padding:12px 13px;margin-top:10px;display:flex;flex-direction:column;gap:5px}
.tcard > b{display:flex;align-items:center;gap:8px;font-size:17px}
.tcard > b i{width:13px;height:13px;border-radius:3px;background:var(--c);transform:rotate(45deg)}
.tcard > b small{margin-left:auto;font-weight:650;color:var(--muted);font-size:14px}
.tcard > span{font-size:14.5px;color:var(--muted)}
.tcard .act{background:var(--panel)}
.ledger{display:grid;grid-template-columns:1fr auto;gap:10px 12px;margin:12px 0}
.ledger span{display:flex;flex-direction:column;font-size:16px}
.ledger small{color:var(--muted);font-size:13.5px}
.ledger b{color:var(--good);align-self:center;font-size:17px}
.chron{list-style:none;padding:0;margin:0}
.chron li{font-size:14.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.chron small{color:var(--muted);margin-right:6px}
.help li{margin:9px 0;font-size:15.5px}
.stats{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:12px 0;font-size:16px}
.bigicon{font-size:52px;line-height:1;margin:4px 0 8px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;font-size:16px}
.switch input{width:52px;height:30px;accent-color:var(--accent)}

/* title */
.title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:24px 16px calc(env(safe-area-inset-bottom,0px) + 28px);
  background:linear-gradient(180deg,rgba(10,26,36,0) 30%,rgba(10,26,36,.85) 75%)}
.logo{font-size:50px;font-weight:850;letter-spacing:-.03em;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.5);margin:0}
.tagline{color:rgba(255,255,255,.85);margin:4px 0 22px;text-align:center;font-size:16.5px;max-width:380px}
.tmenu{display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px}
.tmenu .big{flex:none}
.ver{color:rgba(255,255,255,.5);font-size:13px;margin-top:14px}

.idolin{background:#3B2F1E;color:#FFE08A;border-radius:999px;padding:3px 8px;font-size:15px;margin-left:2px}
.tribe .src{font-size:12px;font-style:italic;margin-top:3px}
.tribe .trait{font-size:13px;margin-top:4px}
.story{border-left:6px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--btn));border-radius:14px;padding:12px 14px;margin-top:12px}
.story b{font-size:18px}
.story p{margin:6px 0;font-size:15px}
.story small,.tcard .src,.reflect small{color:var(--muted);font-style:italic}
.q{font-style:italic;color:var(--ink)}
.tcard .q{font-size:14.5px}
.reflect{background:var(--btn);border-radius:14px;padding:12px 14px;margin:6px 0 14px}
.reflect p{font-size:15.5px}
.tn.never{text-decoration:line-through;text-decoration-thickness:1.5px}

.votes{list-style:none;padding:0;margin:4px 0 10px}
.votes li{font-size:16px;padding:7px 0;border-bottom:1px solid var(--line);opacity:0;animation:vote .5s ease forwards}
@keyframes vote{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.tribe.locked{opacity:.62}
.tribe.locked .trait{color:var(--muted)}
.rts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rt{border-left:5px solid var(--c);background:var(--btn);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:3px}
.rt b{display:flex;align-items:center;gap:7px;font-size:15px}
.rt b i{width:11px;height:11px;border-radius:3px;background:var(--c);transform:rotate(45deg)}
.rt small{font-size:12.5px;color:var(--muted);line-height:1.35}
.rt.locked{opacity:.75}
.bar{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;background:var(--accent)}
.achs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ach{display:flex;gap:9px;align-items:flex-start;background:var(--btn);border-radius:12px;padding:9px 10px;opacity:.55}
.ach.got{opacity:1;background:color-mix(in srgb,var(--star) 16%,var(--btn))}
.ach i{font-style:normal;font-size:22px;line-height:1.1}
.ach span{display:flex;flex-direction:column}
.ach b{font-size:14px}
.ach small{font-size:12.5px;color:var(--muted);line-height:1.3}
@media (max-width:360px){ .rts,.achs{grid-template-columns:1fr} }
</style>
</head>
<body>
<canvas id="cv" aria-label="Game map"></canvas>

<div id="hud" hidden>
  <button class="chip" id="btnStars" aria-label="Shells, income and idols"><i class="dot" id="hudDot"></i><span class="cur">🐚 <b id="hudStars">0</b></span><small id="hudInc">+0</small><span id="hudIdolWrap" class="idolin" hidden>🗿<b id="hudIdols">0</b></span></button>
  <div class="grow"></div>
  <button class="tool" id="btnMap"><i>🗺️</i><span>Map</span></button>
  <button class="tool" id="btnTribes"><i>👥</i><span>Tribes</span></button>
  <button class="tool" id="btnTech"><i>🧠</i><span>Skills</span></button>
  <button class="tool" id="btnMenu" aria-label="Menu"><i>☰</i><span>Menu</span></button>
</div>

<div id="fabs" hidden>
  <button class="fab undo" id="btnUndo" title="Undo last action"><i>↩</i><span id="undoLbl">Undo</span></button>
  <div class="grow"></div>
  <button class="fab next" id="btnNext" title="Select the next unit that can still act"><i>▶</i><span>Next</span><b id="nextCount">0</b></button>
  <button class="fab end" id="btnEnd"><i>☀️</i><span>End turn</span></button>
</div>

<div id="panel" hidden>
  <div id="pinfo"></div>
  <div id="pacts"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="title" class="title">
  <h1 class="logo">Tribelands</h1>
  <p class="tagline">Castaways of the Ember Isles. Forage, build, scheme, and be the last tribe standing.</p>
  <div class="tmenu" id="tmenu"></div>
  <div class="ver" id="tver"></div>
</div>

<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<script>
'use strict';
/* Tribelands — castaway tribes on a volcanic island chain.
   Rules, map generation and the computer tribes. Everything the game knows
   lives in S, a plain object that goes straight to JSON: that is the
   autosave, and a copy of it is what Undo steps back to.                    */

const VERSION = 'v23';
const SAVE_KEY = 'tribelands-save-v1';
const PREF_KEY = 'tribelands-prefs-v1';
const SH = '🐚';                                  // shells: the island's currency

const FIELD = 0, FOREST = 1, MOUNTAIN = 2, SHALLOW = 3, OCEAN = 4;
const TERRAIN_NAME = ['Grassland', 'Jungle', 'Cliffs', 'Lagoon', 'Deep sea'];
const TERRAIN_ICON = ['🌱', '🌴', '🪨', '🏝️', '🌊'];
const isWater = t => t === SHALLOW || t === OCEAN;
const LEVEL_NAME = ['Shack', 'Shelter', 'Camp', 'Village', 'Town', 'Haven'];
const levelName = l => LEVEL_NAME[Math.min(l, 5)];

// Island biomes: how a stretch of land looks and what grows there. Tribes wash up in one.
const BIOMES = {
  palms:  { field: '#9DCF62', forest: '#3F9A55', mountain: '#857C77', tree: 'palm' },
  banana: { field: '#8FD08A', forest: '#2E8F6A', mountain: '#7E8288', tree: 'banana' },
  basalt: { field: '#B4C865', forest: '#5A8F3A', mountain: '#5E5A62', tree: 'bamboo' },
  jungle: { field: '#7FBF63', forest: '#23704A', mountain: '#7B7E86', tree: 'jungle' },
};
const LAND = {
  even:   { land: { forest: .24, mountain: .14 }, res: { coconut: .32, taro: .2, boar: .35, obsidian: .35 } },

  const alive = S.players.filter(P => P.alive && citiesOf(P.id).length);
  for (let i = 0; i < S.tiles.length; i++) {
    const t = S.tiles[i];
    if (isWater(t.t) || t.cityHere >= 0 || t.ruin || t.volcano || unitAt(...XY(i))) continue;
    const [x, y] = XY(i);
    const per = alive.map(P => Math.min(...citiesOf(P.id).map(c => cheb(c.x, c.y, x, y))));
    if (!per.length || Math.min(...per) < 2) continue;
    cand.push({ i, spread: Math.max(...per) - Math.min(...per) + Math.random() });
  }
  if (!cand.length) return;
  cand.sort((a, b) => a.spread - b.spread);
  const c = pick(cand.slice(0, 4));
  S.challenge = { i: c.i, kind: Math.random() < .5 ? 'reward' : 'immunity', until: S.turn + 6, turn: S.turn, seen: false };
  S.explored[c.i] = 1;

const RESCUE_DAYS = 10;

  if (S.rescue) return S.rescue.city === c.id ? 'It is burning here' : 'A Great Signal Fire already burns elsewhere';
  if ((S.rescueCool || 0) > S.turn) return `The last fire was put out; the ashes are still warm (${S.rescueCool - S.turn} days)`;
  if (!has(p, 'fire')) return 'Learn Firemaking';

// Every tribe, fallen or not, votes for a winner — but never for itself.
function runCouncil() {
  const cands = S.players.filter(P => P.alive).map(P => P.id);
  const votes = [];
  for (const J of S.players) {
    const opts = cands.filter(c => c !== J.id);
    if (!opts.length) continue;
    let best = opts[0], bv = -1e9;
    for (const c of opts) {
      const v = S.regard[J.id][c] + .4 * citiesOf(c).length + Math.random() * .3;

    }
    votes.push({ juror: J.id, vote: best, fallen: !J.alive });

  for (const v of votes) tally[v.vote] = (tally[v.vote] || 0) + 1;
  const winner = cands.slice().sort((a, b) => (tally[b] || 0) - (tally[a] || 0) || citiesOf(b).length - citiesOf(a).length)[0];

function aiRescue(p) {

  // for everyone else, an underdog's gamble: only worth it when someone else is clearly winning the war
  if (!keen && !S.players.some(Q => Q.alive && Q.id !== p && strength(Q.id) > strength(p) * 1.3)) return;
  const c = citiesOf(p).filter(c => c.level >= 4 && !enemyNear(c.x, c.y, p, 4)).sort((a, b) => b.level - a.level)[0];

// Called once each time the turn counter moves on.
function beginRound() {

// ---------- grudges, focus and broken promises ----------

// How far every tile is from the nearest goal, walking (or wading, or flying).

function techUseful(p, t) {

    case 'forage': return inLand(tt => tt.res === 'coconut' || tt.res === 'taro');

function aiResearch(p, reserve) {

    'weaving', 'obsidian', 'fire', 'alliances', 'trails', 'boars', 'gliding', 'medicine', 'catapult', 'rafting', 'trading'];

      if (Pe.agg >= .35 || e.owner === foe || home.some(c => cheb(c.x, c.y, e.x, e.y) <= 4)) goals.push(I(e.x, e.y));

    if (S.rescue && S.rescue.owner !== p && !atPeace(p, S.rescue.owner)) {
      // a rival's rescue fire trumps everything: every fighter heads for it
      const rc = S.cities[S.rescue.city];
      goals.length = 0; goals.push(I(rc.x, rc.y));
      for (const e of S.units) if (e.owner === S.rescue.owner && cheb(e.x, e.y, rc.x, rc.y) <= 1) goals.push(I(e.x, e.y));
    }
  }
  let { dist, src } = u.boat ? seaField(p, goals) : goalField(p, goals, flies(u));
  if (!u.boat && !flies(u) && dist[here] >= 1e9 && !retreat) {
    // nothing reachable on foot: walk to one of our docks and put to sea
    const docks = S.tiles.map((t, i) => t.imp === 'dock' && ownerOfI(i) === p && !unitAt(...XY(i)) ? i : -1).filter(i => i >= 0);
    if (docks.length) ({ dist, src } = goalField(p, docks, false));
  }
  const { dests, prev } = moveInfo(u);
  let best = here, bd = dist[here];
  for (const d of dests) {
    const t = S.tiles[d];
    if (!canStand(u, d) && !(t.imp === 'dock' && ownerOfI(d) === p)) continue;
    if (u.boat && !isWater(t.t) && dist[d] > 0) continue;               // only land where we meant to
    let v = dist[d];
    if (S.challenge && d === S.challenge.i) v -= 3;
    if (S.rescue && S.rescue.owner !== p) { const rc = S.cities[S.rescue.city]; v -= Math.max(0, 3 - cheb(rc.x, rc.y, ...XY(d)) * .5); }
    if ((t.t === FOREST && has(p, 'slings')) || (t.t === MOUNTAIN && has(p, 'climbing'))) v -= .2;
    // keep the fragile back from the front line
    if (!u.boat && FRAGILE.has(u.type) && enemyNear(...XY(d), p, 1)) v += 2.5;
    if (foe >= 0 && src[d] >= 0) { const g = S.tiles[src[d]]; if (g.cityHere >= 0 && S.cities[g.cityHere].owner === foe) v -= 1.5; }
    if (S.diff === 'easy') v += Math.random() * 1.5;
    if (v < bd) { bd = v; best = d; }
  }
  if (best !== here) {
    if (src[best] >= 0 && dist[best] <= 4 && !retreat) claimed.add(src[best]);
    await doMove(u, best, prev);
    await FX.pause(u);
    const bc = cityAtI(best);
    if (bc && bc.owner !== p) claimed.add(best);
    if (canHeal(u)) { doHeal(u); return; }
    if (!retreat) await aiAttack(u);
  } else if (canRecover(u)) doRecover(u);
}

// ---------- rivals who talk back ----------
// One message at a time reaches the player; it waits in S.offer until answered.
function aiDiplomacy(p) {
  const Pe = persona(p), P = S.players[p];
  if (S.offer || !S.players[0].alive || S.turn < 5) return;
  const r = S.regard[p][0], mine = citiesOf(p), yours = citiesOf(0);
  const near = yours.some(c => S.units.some(e => e.owner === p && cheb(c.x, c.y, e.x, e.y) <= 4))
    || mine.some(c => S.units.some(e => e.owner === 0 && cheb(c.x, c.y, e.x, e.y) <= 4));
  if (atPeace(p, 0)) {
    // the treacherous break their word when it pays
    if (Pe.treach > 0 && strength(p) > strength(0) * 1.1 && near && Math.random() < Pe.treach * .12) {
      breakTruce(p, 0); S.offer = { kind: 'betrayal', from: p }; return;
    }
    if (r >= 5 && Math.random() < Pe.talk * .07) {
      const gift = Math.min(P.stars, 3 + rnd(4));
      if (gift >= 3) { P.stars -= gift; S.players[0].stars += gift; S.offer = { kind: 'gift', from: p, gift }; }
    }
    return;
  }
  if (grudge(p, 0)) {
    if (Math.random() < .08 && Pe.talk > .2) S.offer = { kind: 'threat', from: p };
    return;
  }
  // tribute: pay us, or else
  if ((Pe.tribute || Pe.agg > .7) && near && strength(p) > strength(0) * 1.4 && Math.random() < .25) {
    S.offer = { kind: 'tribute', from: p, amount: clamp(Math.round(S.players[0].stars * .4), 4, 20), turns: 6 }; return;
  }
  // a pact against whoever is winning
  const top = S.players.filter(Q => Q.alive && Q.id !== p && Q.id !== 0).sort((a, b) => strength(b.id) - strength(a.id))[0];
  if (top && strength(top.id) > strength(p) * 1.15 && strength(top.id) > strength(0) * 1.1 && r > -4 && Math.random() < Pe.talk * .12) {
    S.offer = { kind: 'pact', from: p, against: top.id, turns: 10 }; return;
  }
  // losing badly: sue for peace
  if (near && strength(p) < strength(0) * .6 && Math.random() < .15 + Pe.talk * .15) {
    const gift = Math.min(P.stars, 2 + mine.length * 2);
    S.offer = { kind: 'peace', from: p, gift, turns: 6 };
  }
}
// The player's answer, applied by the UI.
function answerOffer(yes) {
  const o = S.offer; if (!o) return '';
  const q = o.from, T = tribeOf(q), me = S.players[0];
  let msg = '';
  if (o.kind === 'peace') {
    if (yes) { me.stars += o.gift; S.players[q].stars -= o.gift; makeTruce(0, q, o.turns); msg = `Truce with ${T.name}: +${o.gift} ${SH}`; }
    else { regard(q, 0, -1); msg = `${T.name} fight on.`; }
  } else if (o.kind === 'tribute') {
    if (yes && me.stars >= o.amount) { me.stars -= o.amount; S.players[q].stars += o.amount; makeTruce(0, q, o.turns); msg = `You paid. ${T.name} leave you be for ${o.turns} days.`; }
    else { setGrudge(q, 0, 12); regard(q, 0, -2); msg = `${T.name} will remember that. They are coming for you.`; }
  } else if (o.kind === 'pact') {
    if (yes) { makeTruce(0, q, o.turns); setFocus(q, o.against, o.turns); regard(q, 0, 1); msg = `A pact: ${T.name} turn on ${tribeOf(o.against).name}.`; }
    else { regard(q, 0, -1); msg = `${T.name} go it alone.`; }
  }
  logIt(`${T.name} ${o.kind === 'tribute' ? 'demanded tribute' : o.kind === 'pact' ? 'proposed a pact' : o.kind === 'peace' ? 'asked for peace' : o.kind}: ${yes ? 'accepted' : 'refused'}`);
  S.offer = null;
  return msg;
}
async function aiTurn(p) {
  const P = S.players[p], Pe = persona(p);
  const mine = citiesOf(p);
  S.stranded[p] = S.turn % 4 === 0 || S.stranded[p] == null ? isStranded(p) : S.stranded[p];
  const threat = mine.some(c => enemyNear(c.x, c.y, p, 3));
  const units = unitsOf(p).length;
  const desired = (mine.reduce((s, c) => s + c.level, 0) + (threat ? 2 : 0) + (S.diff === 'hard' ? 1 : 0)) * (.7 + Pe.agg * .7) * (Pe.swarm ? 1.4 : 1);
  if (units < Math.max(2, desired * (S.diff === 'easy' ? .6 : 1))) aiTrain(p, threat ? 3 : 1);
  aiResearch(p, S.diff === 'easy' ? 2 : 0);
  aiEconomy(p, threat ? 3 : Math.round((1 - Pe.build) * 3));
  aiWonder(p);
  aiRescue(p);
  const claimed = new Set();
  // captures first, then ranged units soften targets for the melee to finish
  const order = u => canCapture(u) ? 0 : st(u).rng > 1 ? 1 : UNITS[u.type].heal ? 3 : 2;
  const list = unitsOf(p).sort((a, b) => order(a) - order(b));
  for (const u of list) {
    await aiUnit(u, claimed);
    if (S.over) return;
  }
  if (P.stars >= 6) aiTrain(p, 2);
  aiDiplomacy(p);
}

// ---------- saving ----------
function saveGame() {
  if (!S || S.demo) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { }
}
// Games saved by earlier versions used different tribes and units, so they cannot be resumed.
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    return s && s.v === 6 && Array.isArray(s.tiles) ? s : null;
  } catch (e) { return null; }
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } }

/* Tribelands — story moments. Each tribe meets four scenes from its own story,
   each a choice with consequences: shells, survivors, units, skills, idols,
   short-lived strength, and how every other tribe regards you (which decides
   the Final Tribal Council). The choices are meant to test the tribe's own
   question; neither option is simply "right".                                  */

// What a choice can do. Everything acts on the player's tribe (player 0).
const X = {
  cap() { return citiesOf(0).find(c => c.capital) || citiesOf(0)[0]; },
  gain(n) { S.players[0].stars = Math.max(0, S.players[0].stars + n); return (n > 0 ? '+' : '−') + Math.abs(n) + ' ' + SH; },
  pop(n) { const c = this.cap(); if (c) addPop(c, n); return `+${n} survivor${n > 1 ? 's' : ''}`; },
  unit(type, n = 1) {
    const c = this.cap(); let k = 0;
    for (let j = 0; j < n && c; j++) {
      const spot = freeLandNear(c.x, c.y, 0) || freeLandNear(...(nbrs(c.x, c.y)[0] || [c.x, c.y]), 0);
      if (!spot) break;
      const u = addUnit(type, 0, spot[0], spot[1], -1); u.hp = maxHp(u); k++;
    }
    vision();
    return k ? `+${k} ${UNITS[type].name}` : 'no room for a new unit';
  },
  learn() {
    const t = Object.keys(TECHS).filter(k => !has(0, k) && techReady(0, k) && !techForbidden(0, k)).sort((a, b) => techCost(0, a) - techCost(0, b))[0];
    if (!t) return this.gain(6);
    S.players[0].techs[t] = true; return 'learned ' + TECHS[t].name;
  },
  idol(n = 1) { S.players[0].idols += n; return `+${n} hidden immunity idol`; },
  hurt(n) { for (const u of unitsOf(0)) u.hp = Math.max(1, u.hp - n); return `your units lose ${n} HP`; },
  heal() { for (const u of unitsOf(0)) u.hp = maxHp(u); return 'every unit healed'; },
  regard(n) { regardAll(0, n); return n > 0 ? 'the other tribes think better of you' : 'the other tribes think worse of you'; },
  mod(kind, v, turns) { addMod(0, kind, v, turns); const w = { atk: 'attack', def: 'defence', income: SH + ' a day' }[kind]; return `${v > 0 ? '+' : '−'}${Math.abs(v)} ${w} for ${turns} days`; },
  reveal(r) { const c = this.cap(); if (c) reveal(c.x, c.y, r); return 'you can see further'; },
  revealFar(r) {
    const dark = [...S.tiles.keys()].filter(i => !seen(i));
    if (dark.length) { const [x, y] = XY(pick(dark)); reveal(x, y, r); }
    return 'a far stretch of the islands revealed';
  },
  walls() { const c = this.cap(); if (c) c.walls = true; return 'a palisade around your first camp'; },
  shack() {
    const c = this.cap(); if (!c) return '';
    for (const i of shuffle([...S.tiles.keys()])) { const [x, y] = XY(i); if (cheb(x, y, c.x, c.y) <= 5 && placeVillage(i)) { reveal(x, y, 1); return 'stranded castaways appear nearby'; } }
    return 'nobody else is out there';
  },
  wreck() {
    const c = this.cap(); if (!c) return '';
    for (const i of shuffle([...S.tiles.keys()])) {
      const t = S.tiles[i], [x, y] = XY(i);
      if (cheb(x, y, c.x, c.y) > 4 || cheb(x, y, c.x, c.y) < 2 || isWater(t.t) || t.cityHere >= 0 || t.ruin || t.volcano || unitAt(x, y)) continue;
      t.ruin = true; t.res = null; reveal(x, y, 1); return 'a shipwreck marked on the map';
    }
    return this.gain(6);
  },
  lose(type) { const u = unitsOf(0).find(v => v.type === type); if (!u) return ''; killUnit(u); S.players[0].lost--; return `your ${UNITS[type].name} is gone`; },
  storm() { for (const u of S.units) if (u.owner !== 0) u.hp = Math.max(1, u.hp - 3); return 'rival units lose 3 HP'; },
  rivalIdol() { const R = shuffle(S.players.filter(P => P.id && P.alive && P.idols))[0]; if (R) { R.idols--; return `${TRIBES[R.tribe].name} lose an idol`; } return this.gain(6); },
  expose(turns) { S.players[0].exposedUntil = S.turn + turns; return `rivals know where you are for ${turns} days`; },
};

// A story moment is due when its day comes and nothing else is waiting.
function queueStory() {
  const list = STORIES[TRIBES[S.players[0].tribe].key] || [];
  if (S.story.pending != null) return;
  const i = list.findIndex((e, k) => !S.story.done.includes(k) && e.day <= S.turn);
  if (i >= 0) S.story.pending = i;
}
function storyNow() {
  if (S.story.pending == null) return null;
  return (STORIES[TRIBES[S.players[0].tribe].key] || [])[S.story.pending] || null;
}
function chooseStory(ci) {
  const e = storyNow(); if (!e) return '';
  S.story.done.push(S.story.pending); S.story.pending = null;
  const msg = e.choices[ci].fx();
  logIt(`${e.title}: ${e.choices[ci].label}`);
  return msg;
}

/* Tribelands — drawing the islands, touch input and the screens around the map. */

const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const TW = 64, TH = 32, LH = 6, WD = 4;          // tile size, land edge depth, water drop
const ZMIN = .5, ZMAX = 3;
let W = 0, H = 0, DPR = 1;
const cam = { x: 0, y: 0, z: 1 };
let mode = 'title';                               // 'title' | 'game'
let busy = false;
let sel = null, selMoves = { dests: new Set(), prev: new Map() }, selTargets = [];
let undoStack = [];
let prefs = { speed: 'normal', haptics: true, motion: 'full', last: { tribe: 0, opponents: 2, size: 'medium', diff: 'normal' } };
try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch (e) { }
if (prefs.last && prefs.last.tribe > 3) prefs.last.tribe = 0;
const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) { } };
// A small buzz under the thumb, on phones that have one.
function buzz(p) { try { if (prefs.haptics && navigator.vibrate) navigator.vibrate(p); } catch (e) { } }

// ---------- colour ----------
const _shade = new Map();
function shade(hex, amt) {
  const key = hex + amt;
  let v = _shade.get(key);
  if (v) return v;
  let r, g, b;
  if (hex[0] === '#') { const n = parseInt(hex.slice(1), 16); r = n >> 16; g = (n >> 8) & 255; b = n & 255; }
  else [r, g, b] = hex.match(/\d+/g).map(Number);         // an rgb() this function made earlier
  const f = c => amt < 0 ? c * (1 + amt) : c + (255 - c) * amt;
  v = `rgb(${f(r) | 0},${f(g) | 0},${f(b) | 0})`;
  _shade.set(key, v);
  return v;
}
const colOf = p => TRIBES[S.players[p].tribe].color;

// ---------- geometry ----------
const iso = (x, y) => [(x - y) * TW / 2, (x + y) * TH / 2];
function screenToTile(sx, sy) {
  const wx = (sx - W / 2) / cam.z + cam.x, wy = (sy - H / 2) / cam.z + cam.y;
  const a = wx / (TW / 2), b = wy / (TH / 2);
  return [Math.round((a + b) / 2), Math.round((b - a) / 2)];
}
const toScreen = (wx, wy) => [(wx - cam.x) * cam.z + W / 2, (wy - cam.y) * cam.z + H / 2];
function clampCam() {
  if (!S) return;
  const n = S.n;
  cam.z = clamp(cam.z, ZMIN, ZMAX);
  cam.x = clamp(cam.x, -n * TW / 2, n * TW / 2);
  cam.y = clamp(cam.y, -TH, n * TH);
}
const panelH = () => mode === 'game' && !$('#panel').hidden ? $('#panel').offsetHeight + 80 : 0;
// Where on screen a focused tile should sit: in the clear space between the HUD and the panel.
function focusY() { return (70 + (H - panelH())) / 2; }
function centerOn(x, y) { const [wx, wy] = iso(x, y); cam.x = wx; cam.y = wy - (focusY() - H / 2) / cam.z; clampCam(); }
// Glide the camera so a tile is not hidden under the HUD or the panel.
function ensureVisible(x, y) {
  const [wx, wy] = iso(x, y), [sx, sy] = toScreen(wx, wy);
  if (sy > 90 && sy < H - panelH() - 20 && sx > 30 && sx < W - 30) return;
  const fx = cam.x, fy = cam.y;
  const tx = wx, ty = wy - (focusY() - H / 2) / cam.z;
  tween(260, t => { const e = 1 - (1 - t) ** 3; cam.x = fx + (tx - fx) * e; cam.y = fy + (ty - fy) * e; clampCam(); });
}

// ---------- drawing primitives ----------
function poly(pts, fill) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let k = 2; k < pts.length; k += 2) ctx.lineTo(pts[k], pts[k + 1]);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function dot(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function line(x1, y1, x2, y2, col, w) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function dpath(cx, cy, w = TW / 2, h = TH / 2) {
  ctx.beginPath(); ctx.moveTo(cx, cy - h); ctx.lineTo(cx + w, cy); ctx.lineTo(cx, cy + h); ctx.lineTo(cx - w, cy); ctx.closePath();
}
// A triangle split down its apex into a lit and a shaded facet — the low-poly look.
function tri2(xl, xr, yb, xa, ya, col) {
  poly([xl, yb, xa, yb + 1, xa, ya], shade(col, .14));
  poly([xa, yb + 1, xr, yb, xa, ya], shade(col, -.12));
}
function tile3(cx, cy, top, side) {
  const w = TW / 2 + .5, h = TH / 2 + .25;
  if (side) {
    poly([cx - w, cy, cx, cy + h, cx, cy + h + side, cx - w, cy + side], shade(top, -.28));
    poly([cx, cy + h, cx + w, cy, cx + w, cy + side, cx, cy + h + side], shade(top, -.42));
  }
  poly([cx, cy - h, cx + w, cy, cx, cy + h, cx - w, cy], top);
  poly([cx, cy - h, cx, cy + h, cx - w, cy], shade(top, .05));
}
// An upright box: two walls and a lighter top — used for huts, basalt columns and totems.
function box(x, y, w, d, h, col) {
  poly([x - w, y - d, x, y, x, y - h, x - w, y - d - h], shade(col, .04));
  poly([x, y, x + w, y - d, x + w, y - d - h, x, y - h], shade(col, -.2));
  poly([x - w, y - d - h, x, y - h, x + w, y - d - h, x, y - 2 * d - h], shade(col, .22));
}

// ---------- terrain ----------
const SAND = '#E8D59A';
function coastal(x, y) { for (const [nx, ny] of nbrs(x, y)) if (isWater(tileAt(nx, ny).t)) return true; return false; }
function drawGround(x, y) {
  const i = I(x, y), t = S.tiles[i];
  const [cx, cy] = iso(x, y);
  if (!seen(i)) { tile3(cx, cy, hash(x, y, 2) < .5 ? '#1D3445' : '#20394B', LH); return; }
  if (isWater(t.t)) {
    const c = t.t === SHALLOW ? '#4CC3C9' : '#1F6F9E';
    tile3(cx, cy + WD, shade(c, (hash(x, y, 3) - .5) * .05), 0);
    // surf where the lagoon meets the land
    if (t.t === SHALLOW && [[0, -1], [1, 0], [0, 1], [-1, 0]].some(([dx, dy]) => inb(x + dx, y + dy) && !isWater(tileAt(x + dx, y + dy).t))) {
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5; dpath(cx, cy + WD, TW / 2 - 4, TH / 2 - 2); ctx.stroke();
    }
    // glints of sun on the water, each twinkling in its own time
    const gl = hash(x, y, 8);
    if (gl < .22) {
      const p = Math.sin(NOW / 700 + gl * 90);
      if (p > .55) {
        const a = (p - .55) / .45, gx = cx + (hash(x, y, 9) - .5) * 30, gy = cy + WD + (hash(x, y, 10) - .5) * 12;
        ctx.fillStyle = `rgba(255,255,240,${.8 * a})`;
        ctx.beginPath(); ctx.moveTo(gx - 4 * a, gy); ctx.lineTo(gx, gy - 1.6); ctx.lineTo(gx + 4 * a, gy); ctx.lineTo(gx, gy + 1.6); ctx.fill();
      }
    }
    if (hash(x, y, 4) < .5) {
      const ph = hash(x, y, 11) * 6.3, sw = Math.sin(NOW / 1300 + ph);
      ctx.strokeStyle = `rgba(255,255,255,${.22 + .12 * sw})`; ctx.lineWidth = 1.3;
      const ox = (hash(x, y, 5) - .5) * 26 + sw * 3, oy = (hash(x, y, 6) - .5) * 10 + WD + Math.cos(NOW / 1300 + ph) * .8;
      ctx.beginPath(); ctx.moveTo(cx + ox - 6, cy + oy); ctx.quadraticCurveTo(cx + ox - 3, cy + oy - 2.5, cx + ox, cy + oy);
      ctx.quadraticCurveTo(cx + ox + 3, cy + oy + 2.5, cx + ox + 6, cy + oy); ctx.stroke();
    }
    return;
  }
  const pal = TRIBES[t.clim].pal;
  let top;
  if (t.cityHere >= 0) top = S.cities[t.cityHere].owner >= 0 ? '#E3CFA0' : SAND;
  else if (t.t === FOREST) top = shade(pal.forest, .25);
  else if (t.t === MOUNTAIN) top = shade(pal.mountain, .1);
  else top = coastal(x, y) ? SAND : pal.field;
  top = shade(top, (hash(x, y, 1) - .5) * .08);
  tile3(cx, cy, top, LH);
  if (t.imp === 'garden') {

   every game you finish. Kept on this device, apart from the saved game, so it
   survives starting over.                                                        */

const PROFILE_KEY = 'tribelands-profile-v1';
const START_TRIBES = ['flight', 'conch', 'choir', 'crusoe', 'lifeboat', 'minnow'];
// Each locked tribe is earned by a feat that suits it.
const UNLOCKS = {
  beach:     { need: 'Win any game', prog: R => [R.wins, 1] },
  lilliput:  { need: 'Finish 5 games, win or lose', prog: R => [R.played, 5] },
  moreau:    { need: 'Defeat 25 rival units, across all your games', prog: R => [R.kills, 25] },
  pirates:   { need: 'Capture 8 rival camps, across all your games', prog: R => [R.captures, 8] },
  blindside: { need: 'Win 3 challenges, across all your games', prog: R => [R.challenges, 3] },
  engineers: { need: 'Learn 15 skills in a single game', prog: R => [R.bestSkills, 15] },
  prospero:  { need: 'Win by Rescue or by the Final Tribal Council', prog: R => [(R.byHow.rescue || 0) + (R.byHow.council || 0), 1] },
};

let REC = loadRecords();
function loadRecords() {
  const blank = { played: 0, wins: 0, losses: 0, kills: 0, captures: 0, challenges: 0, bestSkills: 0, byHow: {}, byTribe: {},
    history: [], achievements: {}, unlocked: {}, unlockAll: false, endings: {} };
  try { return Object.assign(blank, JSON.parse(localStorage.getItem(PROFILE_KEY) || '{}')); } catch (e) { return blank; }
}
function saveRecords() { try { localStorage.setItem(PROFILE_KEY, JSON.stringify(REC)); } catch (e) { } }
const isUnlocked = key => START_TRIBES.includes(key) || REC.unlockAll || !!REC.unlocked[key];

const P0 = () => S.players[0];
const tk = () => TRIBES[S.players[0].tribe].key;
// `live` achievements are checked after every action; `end` ones when a game finishes.
const ACHIEVEMENTS = [
  { id: 'firstwin', icon: '🏆', name: 'Sole survivor', desc: 'Win a game.', end: g => g.win },
  { id: 'domination', icon: '👑', name: 'Last tribe standing', desc: 'Win by conquest.', end: g => g.win && g.how === 'domination' },
  { id: 'rescued', icon: '🚢', name: 'Rescued', desc: 'Win by Rescue.', end: g => g.win && g.how === 'rescue' },
  { id: 'jury', icon: '🗳️', name: 'The jury’s choice', desc: 'Win the Final Tribal Council.', end: g => g.win && g.how === 'council' },
  { id: 'huge', icon: '🗺️', name: 'Archipelago', desc: 'Win on a Huge map.', end: g => g.win && S.size === 'huge' },
  { id: 'hard', icon: '🔥', name: 'Against the odds', desc: 'Win on Hard.', end: g => g.win && S.diff === 'hard' },
  { id: 'eight', icon: '🌊', name: 'Eight tribes enter', desc: 'Win a game against seven rivals.', end: g => g.win && S.players.length === 8 },
  { id: 'peace', icon: '🕊️', name: 'Peacemaker', desc: 'Form 3 alliances in one game.', live: () => (P0().alliances || 0) >= 3 },
  { id: 'traitor', icon: '🗡️', name: 'Blindsided them', desc: 'Break an alliance.', live: () => (P0().betrayals || 0) >= 1 },
  { id: 'landmarks', icon: '🗼', name: 'Wonders of the isles', desc: 'Hold 3 landmarks at once.', live: () => Object.keys(WONDERS).filter(k => hasWonder(0, k)).length >= 3 },
  { id: 'haven', icon: '🏝️', name: 'Haven', desc: 'Grow a camp to level 5.', live: () => citiesOf(0).some(c => c.level >= 5) },
  { id: 'story', icon: '📖', name: 'The whole story', desc: 'Live all four of your tribe’s story scenes in one game.', live: () => S.story.done.length >= 4 },
  { id: 't_flight', tribe: 'flight', icon: '🔢', name: 'Day 42', desc: 'As Flight 815, still be alive on day 42.', live: () => tk() === 'flight' && S.turn >= 42 },
  { id: 't_conch', tribe: 'conch', icon: '🐚', name: 'The fire never went out', desc: 'As the Conch, win by Rescue.', end: g => g.win && g.how === 'rescue' && tk() === 'conch' },
  { id: 't_choir', tribe: 'choir', icon: '🐖', name: 'Kill the pig', desc: 'As the Choir, defeat 20 rival units in one game.', live: () => tk() === 'choir' && P0().kills >= 20 },
  { id: 't_crusoe', tribe: 'crusoe', icon: '📅', name: 'Lord of the manor', desc: 'As the Crusoes, win without ever losing a camp.', end: g => g.win && tk() === 'crusoe' && !P0().campsLost },
  { id: 't_lifeboat', tribe: 'lifeboat', icon: '🐯', name: 'The tiger lived', desc: 'As the Lifeboat, win with the tiger still alive.', end: g => g.win && tk() === 'lifeboat' && unitsOf(0).some(u => u.type === 'tiger') },
  { id: 't_minnow', tribe: 'minnow', icon: '📻', name: 'Never leave', desc: 'As the Minnow, win the Final Tribal Council.', end: g => g.win && g.how === 'council' && tk() === 'minnow' },
  { id: 't_beach', tribe: 'beach', icon: '🤫', name: 'Small paradise', desc: 'As the Beach, win holding 4 camps or fewer.', end: g => g.win && tk() === 'beach' && citiesOf(0).length <= 4 },
  { id: 't_moreau', tribe: 'moreau', icon: '🐺', name: 'Are we not Men?', desc: 'As Moreau’s Beasts, field 5 Beast-folk at once.', live: () => tk() === 'moreau' && unitsOf(0).filter(u => u.type === 'beast').length >= 5 },
  { id: 't_engineers', tribe: 'engineers', icon: '⚙️', name: 'From nothing', desc: 'As the Engineers, learn every skill.', live: () => tk() === 'engineers' && Object.keys(TECHS).every(t => has(0, t)) },
  { id: 't_prospero', tribe: 'prospero', icon: '📚', name: 'Charms o’erthrown', desc: 'As Prospero’s Court, drown the book and still win.', end: g => g.win && tk() === 'prospero' && P0().drowned },
  { id: 't_pirates', tribe: 'pirates', icon: '💰', name: 'A king’s ransom', desc: 'As the Hispaniola, hold 100 shells at once.', live: () => tk() === 'pirates' && P0().stars >= 100 },
  { id: 't_lilliput', tribe: 'lilliput', icon: '🐜', name: 'Many hands', desc: 'As Lilliput, command 20 units at once.', live: () => tk() === 'lilliput' && unitsOf(0).length >= 20 },
  { id: 't_blindside', tribe: 'blindside', icon: '🗿', name: 'Idol hoarder', desc: 'As the Blindsiders, hold 3 idols at once.', live: () => tk() === 'blindside' && P0().idols >= 3 },
];
function earn(a) {
  if (REC.achievements[a.id]) return false;
  REC.achievements[a.id] = new Date().toISOString().slice(0, 10);
  (S.earned = S.earned || []).push(a.id);
  saveRecords();
  return true;
}
// After every action: anything earned just now gets a toast.
function checkLiveAchievements() {
  if (!S || S.demo || S.over) return;
  for (const a of ACHIEVEMENTS) if (a.live && !REC.achievements[a.id] && a.live()) { if (earn(a)) { toast(`🏆 Achievement: ${a.name}`); buzz([20, 60, 20]); } }
}
// Once, when a game ends: fold it into the records, and see what it unlocked.
function recordGame() {
  if (!S || S.demo || S.recorded) return { earned: [], unlocked: [] };
  S.recorded = true;
  const g = { win: S.over === 'win', how: S.overHow || 'domination' };
  const key = tk(), P = P0();
  const before = TRIBES.filter(T => isUnlocked(T.key)).map(T => T.key);
  REC.played++; g.win ? REC.wins++ : REC.losses++;
  REC.kills += P.kills; REC.captures += P.captures || 0; REC.challenges += P.challenges || 0;
  REC.bestSkills = Math.max(REC.bestSkills, Object.keys(P.techs).length);
  if (g.win) REC.byHow[g.how] = (REC.byHow[g.how] || 0) + 1;
  const bt = REC.byTribe[key] = REC.byTribe[key] || { played: 0, wins: 0, fastest: 0 };
  bt.played++;
  if (g.win) { bt.wins++; bt.fastest = bt.fastest ? Math.min(bt.fastest, S.turn) : S.turn; }
  REC.endings[key] = true;
  REC.history.unshift({ tribe: key, win: g.win, how: g.how, days: S.turn, rivals: S.players.length - 1, size: S.size, diff: S.diff,
    winner: S.winner >= 0 ? TRIBES[S.players[S.winner].tribe].key : null, date: new Date().toISOString().slice(0, 10) });
  REC.history = REC.history.slice(0, 40);
  const earned = (S.earned || []).slice();
  for (const a of ACHIEVEMENTS) if (a.end && !REC.achievements[a.id] && a.end(g)) { earn(a); earned.push(a.id); }
  for (const k of Object.keys(UNLOCKS)) { const [v, need] = UNLOCKS[k].prog(REC); if (v >= need) REC.unlocked[k] = REC.unlocked[k] || new Date().toISOString().slice(0, 10); }
  saveRecords();
  const unlocked = TRIBES.filter(T => isUnlocked(T.key) && !before.includes(T.key)).map(T => T.key);
  return { earned: [...new Set(earned)], unlocked };
}

/* Tribelands — the HUD, the bottom panel, the floating buttons and every sheet. */

// ---------- doing things ----------
// `o.undo` names the action ("move", "hunt"…) and makes it undoable.
async function act(fn, o = {}) {
  if (busy || !S || S.over) return;
  busy = true;
  const snap = JSON.stringify(S);
  revealed = 0;
  const hadRewards = S.pendingRewards.length;
  let msg;
  try { msg = await fn(); }
  catch (err) { console.error(err); }
  busy = false;
  disbandArm = null;
  if (o.undo && revealed === 0 && S.pendingRewards.length === hadRewards) {
    undoStack.push({ snap, label: o.undo });
    if (undoStack.length > 40) undoStack.shift();
  } else undoStack = [];
  if (typeof msg === 'string' && msg !== 'idol') toast(msg);
  afterAction();
}
function afterAction() {
  checkElims();
  saveGame();
  checkLiveAchievements();
  refreshSel();
  renderHud();
  renderPanel();
  kick();
  if (!$('#modal').hidden && $('#modal').dataset.closable === '') return;   // a choice is already open
  if (S.pendingRewards.length) showReward();
  else if (S.over && !S.overShown) showGameOver();
  else if (storyNow()) showStory();
  else if (S.offer && S.offer.from != null) showOffer();
  else if (S.rescueNews && !S.rescueNews.seen) showRescueNews();
  else if (S.challenge && !S.challenge.seen) showChallenge();
  else if (S.event && S.event.turn === S.turn && !S.event.seen && !S.over) showEvent();
}
function undo() {
  if (busy || !undoStack.length) return;
  S = JSON.parse(undoStack.pop().snap);
  disbandArm = null; buzz(10);
  refreshSel(); renderHud(); renderPanel(); saveGame(); kick();
}
async function endTurn() {
  if (busy || !S || S.over) return;
  buzz(20);
  busy = true;
  sel = null; undoStack = []; disbandArm = null;
  $('#btnEnd').classList.remove('nudge');
  refreshSel();
  for (let p = 1; p < S.players.length; p++) {
    if (!S.players[p].alive) continue;
    S.cur = p;
    renderHud(); renderPanel();
    startTurn(p);
    try { await aiTurn(p); } catch (err) { console.error(err); }
    checkElims();
    kick();
    if (S.over) break;
  }
  if (!S.over) {
    S.turn++;
    S.cur = 0;
    revealed = 0;
    beginRound();
    startTurn(0);
    vision();
    toast(`Day ${S.turn} · +${income(0)} ${SH}`);
  }
  busy = false;
  afterAction();
}

// ---------- HUD and floating buttons ----------
function renderHud() {
  const on = mode === 'game';
  $('#hud').hidden = !on; $('#fabs').hidden = !on;
  if (!on) return;
  const P = S.players[0];
  $('#hudDot').style.background = TRIBES[P.tribe].color;
  $('#hudStars').textContent = P.stars;
  $('#hudInc').textContent = '+' + income(0);
  $('#hudIdolWrap').hidden = !P.idols;
  $('#hudIdols').textContent = P.idols;
  const u0 = undoStack[undoStack.length - 1];
  $('#btnUndo').disabled = busy || !u0;
  $('#undoLbl').textContent = u0 ? 'Undo ' + u0.label : 'Undo';
  $('#btnEnd').disabled = busy || !!S.over;
  const ready = S.cur === 0 && !busy ? readyUnits().length : 0;
  $('#nextCount').textContent = ready;
  $('#btnNext').classList.toggle('none', !ready);
  $('#btnNext').disabled = busy || !!S.over;
  if (ready) $('#btnEnd').classList.remove('nudge');
}
$('#btnStars').addEventListener('click', () => { if (!busy) openIncome(); });
$('#btnMap').addEventListener('click', () => { if (!busy) openMap(); });
$('#btnTribes').addEventListener('click', () => { if (!busy) openTribes(); });
$('#btnEnd').addEventListener('click', endTurn);
$('#btnUndo').addEventListener('click', undo);
$('#btnNext').addEventListener('click', nextUnit);
// keep the floating buttons just above the panel, whatever its height
new ResizeObserver(() => document.documentElement.style.setProperty('--ph', $('#panel').hidden ? '0px' : $('#panel').offsetHeight + 'px')).observe($('#panel'));

// ---------- the bottom panel ----------
const tag = p => `<span class="tag" style="background:${colOf(p)}">${TRIBES[S.players[p].tribe].name}</span>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// One action button: what it is, what it does, what it costs, and — if it can't be pressed — why.
function actBtn({ a, icon, title, effect, cost, block, go, quiet, wide }) {
  const dis = !!block;
  return `<button class="act${go && !dis ? ' go' : ''}${wide ? ' wide' : ''}" data-a="${a}"${dis ? ' disabled' : ''}>
    <i>${icon}</i><span class="t"><span class="hd"><b>${title}</b>${cost != null ? `<span class="c">${cost === 0 ? 'Free' : cost + ' ' + SH}</span>` : ''}</span>${effect ? `<small>${effect}</small>` : ''}${dis && !quiet ? `<em>${block}</em>` : ''}</span></button>`;
}
const sec = t => `<div class="sec">${t}</div>`;
const hint = t => `<div class="hint">${t}</div>`;
let disbandArm = null;

function renderPanel() {
  const panel = $('#panel');
  panel.hidden = mode !== 'game';
  if (panel.hidden) return;
  renderHud();
  const info = $('#pinfo'), acts = $('#pacts');
  panel.style.setProperty('--selc', 'transparent');
  if (busy && S.cur !== 0) {
    info.innerHTML = `<h3>${tag(S.cur)} is on the move…</h3><p>Day ${S.turn}. Rival tribes are taking their turns.</p>`;
    acts.innerHTML = '';
    return;
  }
  if (S.over) {
    info.innerHTML = `<h3>${S.over === 'win' ? '👑 Sole survivors' : 'Voted off'} · Day ${S.turn}</h3><p>Open the menu ☰ to start a new game.</p>`;
    acts.innerHTML = '';
    return;
  }
  if (!sel) {
    const ready = readyUnits().length;
    info.innerHTML = `<h3>${tag(0)} Day ${S.turn}</h3><p>${ready ? `<b>${ready}</b> ${ready === 1 ? 'unit has' : 'units have'} moves left (green rings). Tap one, or press ▶ Next.` : 'Everyone has acted. Build, learn a skill, or end your turn.'}</p><p>🗳️ Final Tribal Council on day ${councilDay()}${S.rescue ? ` · 🔥 ${S.rescue.owner === 0 ? 'Your' : tribeOf(S.rescue.owner).name + '’s'} signal fire: rescue in ${RESCUE_DAYS - S.rescue.days} days` : ''}</p>`;
    acts.innerHTML = '';
    return;
  }
  if (sel.kind === 'unit') unitPanel(unitById(sel.id), info, acts);
  else tilePanel(sel.i, info, acts);
}

function unitPanel(u, info, acts) {
  const s = st(u), mh = maxHp(u), U = UNITS[u.type];
  $('#panel').style.setProperty('--selc', colOf(u.owner));
  const skills = Object.keys(SKILLS).filter(k => (u.boat ? BOATS[u.boat] : U)[k]);
  const chip = k => `<span class="skill"><b>${SKILLS[k][0]}</b> ${SKILLS[k][1]}</span>`;
  const stats = `<span class="stat">⚔️ ${s.atk}</span><span class="stat">🛡️ ${s.def}</span><span class="stat">👣 ${mvOf(u)}</span>${s.rng > 1 ? `<span class="stat">🎯 ${s.rng}</span>` : ''}`;
  info.innerHTML = `<div class="selwhat">Selected unit${u.owner === 0 ? '' : ' · rival'}</div>
    <h3>${tag(u.owner)} ${(u.boat ? BOATS[u.boat] : U).icon} ${unitName(u)}${u.vet ? ' <span class="vet">★ Veteran</span>' : ''}</h3>
    <p><span class="hpbar"><i style="width:${u.hp / mh * 100}%"></i></span> ${u.hp}/${mh} HP ${stats}</p>
    ${u.owner === 0 ? `<p class="status ${canAct(u) ? '' : 'done'}">${unitStatus(u)}</p>` : ''}`;
  let h = '';
  if (skills.length) h += `<div class="skills">${skills.map(chip).join('')}</div>`;
  if (wades(u) && isWater(tileAt(u.x, u.y).t)) h += hint('🏊 Wading through the lagoon (Moku trait).');
  if (u.owner !== 0) {
    const peace = atPeace(0, u.owner);
    const mine = unitsOf(0).filter(v => targets(v).includes(u));
    h += hint(peace ? `🤝 You have a truce with ${tribeOf(u.owner).name} for ${peaceLeft(0, u.owner)} more turns. Neither side can attack.`
      : mine.length ? `${mine.length === 1 ? 'One of your units' : mine.length + ' of your units'} can attack it: select yours, then tap the red ring.`
        : 'A rival unit. Bring your units within range to attack it.');
    acts.innerHTML = h;
    return;
  }
  const here = cityAtI(I(u.x, u.y));
  if (here && here.owner !== 0 && !u.boat) {
    const peace = atPeace(0, here.owner);
    const idolRisk = here.owner >= 0 && S.players[here.owner].idols > 0;
    h += actBtn({ a: 'capture', icon: '🚩', title: here.owner < 0 ? 'Recruit the castaways' : 'Take ' + here.name,
      effect: here.owner < 0 ? 'The shack becomes your new camp. Uses this unit’s turn.' : 'The camp, its land and any landmark become yours.' + (idolRisk ? ' ⚠️ They hold an idol: it would cancel this and vote your unit off.' : ''),
      block: peace ? 'You have a truce with its owner' : canCapture(u) ? '' : 'Works at the start of your next turn, if this unit is still here', go: true, wide: true });
  }
  if (tileAt(u.x, u.y).ruin) h += actBtn({ a: 'ruin', icon: '⚓', title: 'Salvage the wreck', effect: 'Shells, a survival manual, a map, a survivor… or a hidden idol. Uses this unit’s turn.',
    block: canRuin(u) ? '' : 'This unit has already attacked this turn', go: true, wide: true });
  if (!u.boat && U.heal) {
    const n = S.units.filter(v => v.owner === 0 && v !== u && cheb(u.x, u.y, v.x, v.y) <= 1 && v.hp < maxHp(v)).length;
    h += actBtn({ a: 'heal', icon: '🌿', title: 'Heal allies', effect: `+4 HP to ${n || 'each'} wounded ${n === 1 ? 'unit' : 'units'} next to the Healer`,
      block: u.attacked ? 'Already acted this turn' : n ? '' : 'No wounded units next to it', go: true });
  }
  if (u.hp < mh) h += actBtn({ a: 'recover', icon: '❤️', title: 'Rest',
    effect: `Heals ${ownerOfI(I(u.x, u.y)) === 0 ? 4 : 2} HP (4 in your land, 2 elsewhere). Ends its turn.`,
    block: canRecover(u) ? '' : 'Only before it moves or attacks' });
  if (here && here.owner === 0) h += actBtn({ a: 'city', icon: '🏕️', title: 'Open ' + here.name, effect: 'Train units, grow the camp, raise landmarks' });
  h += actBtn({ a: 'disband', icon: disbandArm === u.id ? '⚠️' : '👋', title: disbandArm === u.id ? 'Tap again to send home' : 'Send home',
    effect: disbandArm === u.id ? 'This removes the unit for good' : 'Removes the unit and frees a slot in its camp' });
  const tips = [];
  if (!exhausted(u)) {
    if (selMoves.dests.size) tips.push('⬜ Tap a white marker to move there.');
    if (selTargets.length) tips.push(U.convert && !u.boat ? '🔴 Tap a red ring to sway that unit to your side.' : '🔴 Tap a red ring to attack. The label shows the damage you deal, and ↩ what you take back.');
    if (!selMoves.dests.size && !selTargets.length && !u.moved) tips.push('Nowhere to move from here.');
  }
  acts.innerHTML = h + (tips.length ? hint(tips.join('<br>')) : '');
}

const RES_TIP = {
  coconut: `Crack them for +1 survivor (needs Foraging).`,
  taro: 'Plant a garden here for +2 survivors (needs Gardening).',
  boar: 'Hunt it for +1 survivor (needs Tracking).',
  fish: 'Spear them for +1 survivor (needs Spearfishing).',
  obsidian: 'Quarry it for +2 survivors (needs Quarrying).',
};
function workEffect(i, key) {
  const t = S.tiles[i], W = WORKS[key], c = t.city >= 0 ? S.cities[t.city] : null;
  if (key === 'burn') return `+1 ${SH} now; the jungle becomes grassland`;
  if (key === 'trail') return 'Moving from trail to trail (or camp) costs half a step';
  if (key === 'signal') return `+1 ${SH} every turn from passing traders, and you see 3 tiles around it`;
  if (key === 'post') return `Earns +${postValue(i)} ${SH} every turn right now: +1 for each garden, quarry, hut or dock beside it (max 4)`;
  const who = c && c.owner === 0 ? ' for ' + c.name : '';
  const lvl = c && c.owner === 0 && c.pop + W.pop >= c.level + 1 ? ' — levels the camp up!' : '';
  return `+${W.pop} survivor${W.pop > 1 ? 's' : ''}${who}${lvl}${key === 'dock' ? '. Units that walk in become rafts' : ''}`;
}
function tilePanel(i, info, acts) {
  const t = S.tiles[i];
  if (!seen(i)) { info.innerHTML = '<div class="selwhat">Selected tile</div><h3>☁️ Unexplored</h3><p>Send a unit this way to see what is here.</p>'; acts.innerHTML = ''; return; }
  const c = cityAtI(i), o = ownerOfI(i);
  if (o >= 0) $('#panel').style.setProperty('--selc', colOf(o));
  let h = '';
  const unit = unitAt(...XY(i));
  if (S.challenge && S.challenge.i === i) {
    const C = CHALLENGES[S.challenge.kind];
    info.innerHTML = `<div class="selwhat">Selected tile</div><h3>${C.icon} ${C.name}</h3><p>${C.desc} ${S.challenge.until - S.turn + 1} turns left.</p>`;
  } else if (c && c.owner < 0) {
    info.innerHTML = `<div class="selwhat">Selected tile</div><h3>🆘 Stranded castaways</h3><p>Move a unit here. At the start of your next turn it can recruit them, and the shack becomes your camp.</p>`;
  } else if (c) cityPanel(c, info, a => h += a);
  else {
    const what = [TERRAIN_NAME[t.t], t.volcano && 'Volcano', t.res && RES_NAME[t.res], t.imp && IMP_NAME[t.imp], t.road && 'Trail', t.ruin && 'Shipwreck'].filter(Boolean).join(' · ');
    const tip = t.volcano ? 'It smoulders. When it erupts, units within 2 tiles are hurt and fresh obsidian cools on the cliffs.'

// The whole island chain at a glance; tap anywhere to fly there.
function openMap() {
  const n = S.n, size = Math.min(W - 32, 540), cell = size / n;
  openSheet(`<h2>🗺️ The Ember Isles</h2><p class="muted">Tap anywhere to fly there. Your view is the white frame.</p>
    <canvas id="mini" width="${Math.round(size * DPR)}" height="${Math.round(size / 2 * DPR + 8 * DPR)}" style="width:${size}px;height:${size / 2 + 8}px;display:block;margin:10px auto;touch-action:none"></canvas>
    <div class="legend" id="miniKey"></div>`);
  const mc = $('#mini'), m = mc.getContext('2d');
  m.setTransform(DPR, 0, 0, DPR, 0, 0);
  const at = (x, y) => [size / 2 + (x - y) * cell / 2, 4 + (x + y) * cell / 4];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const i = I(x, y), t = S.tiles[i], [cx, cy] = at(x, y);
    let col;
    if (!seen(i)) col = '#1D3445';
    else if (isWater(t.t)) col = t.t === SHALLOW ? '#4CC3C9' : '#1F6F9E';
    else { const o = ownerOfI(i); col = o >= 0 ? colOf(o) : t.t === MOUNTAIN ? '#7A7470' : t.t === FOREST ? '#3E8A50' : '#9DCF62'; }
    m.fillStyle = col;
    m.beginPath(); m.moveTo(cx, cy - cell / 4); m.lineTo(cx + cell / 2, cy); m.lineTo(cx, cy + cell / 4); m.lineTo(cx - cell / 2, cy); m.closePath(); m.fill();
  }
  for (const c of S.cities) {
    if (!seen(I(c.x, c.y))) continue;
    const [cx, cy] = at(c.x, c.y);
    m.fillStyle = c.owner >= 0 ? '#fff' : '#E8D59A'; m.beginPath(); m.arc(cx, cy, Math.max(2.5, cell * .28), 0, 7); m.fill();
    if (c.owner >= 0) { m.fillStyle = colOf(c.owner); m.beginPath(); m.arc(cx, cy, Math.max(1.6, cell * .18), 0, 7); m.fill(); }
  }
  if (S.challenge) { const [cx, cy] = at(...XY(S.challenge.i)); m.font = `${Math.max(10, cell)}px system-ui`; m.textAlign = 'center'; m.fillText('🏁', cx, cy); }
  // the part of the map on screen now
  const corners = [[0, 70], [W, 70], [W, H - panelH()], [0, H - panelH()]].map(([sx, sy]) => screenToTile(sx, sy));
  m.strokeStyle = '#fff'; m.lineWidth = 2; m.beginPath();
  corners.forEach(([x, y], k) => { const [cx, cy] = at(x, y); k ? m.lineTo(cx, cy) : m.moveTo(cx, cy); }); m.closePath(); m.stroke();
  $('#miniKey').innerHTML = S.players.filter(P => P.alive).map(P => `<span style="white-space:nowrap;margin-right:10px"><b style="background:${TRIBES[P.tribe].color}"></b>${TRIBES[P.tribe].name}${P.id === 0 ? ' (you)' : ''}</span>`).join(' ');
  mc.addEventListener('click', e => {
    const r = mc.getBoundingClientRect(), px = e.clientX - r.left - size / 2, py = e.clientY - r.top - 4;
    const a = px / (cell / 2), b2 = py / (cell / 4);
    const x = clamp(Math.round((a + b2) / 2), 0, n - 1), y = clamp(Math.round((b2 - a) / 2), 0, n - 1);
    closeSheet(); centerOn(x, y); buzz(10); kick(); afterAction();
  });
}

      <p class="q">Something to carry with you: “${T.question}”</p>
      <ul class="help"><li>Tap your unit (the green ring), then a white marker to move.</li><li>Tap resources in your land to grow your camp.</li><li>Tap 🧠 Skills to learn new ways to survive.</li></ul>
      <div class="row"><button class="big primary" data-x>Let’s survive</button></div>`);
  } else afterAction();
}
const demoCam = { x: 0, y: 0 };
function toTitle() {
  mode = 'title';
  closeSheet();
  S = newGame({ tribe: rnd(TRIBES.length), opponents: 6, size: 'medium', diff: 'normal' });
  S.demo = true;
  S.explored.fill(1);
  for (const c of S.cities) if (c.owner < 0 && Math.random() < .5) { c.owner = rnd(S.players.length); c.level = 1 + rnd(3); claim(c); }
  for (const c of S.cities) if (c.owner >= 0) c.level = Math.max(c.level, 1 + rnd(4));
  cam.z = clamp(Math.min(W, H) / (TW * 5.2), .8, 1.6);
  const [wx, wy] = iso(S.n / 2, S.n / 2);
  demoCam.x = wx; demoCam.y = wy + H * .18 / cam.z;     // sit the islands above the menu
  $('#title').hidden = false;
  renderHud(); renderPanel();
  const saved = loadSave();
  const m = $('#tmenu');
  m.innerHTML = (saved && !saved.over ? `<button class="big primary" id="tContinue">Continue · ${TRIBES[saved.players[0].tribe].name}, day ${saved.turn}</button>` : '') +
    `<button class="big ${saved && !saved.over ? '' : 'primary'}" id="tNew">New game</button><button class="big" id="tRec">🏆 Records</button><button class="big" id="tHelp">How to play</button>`;
  $('#tver').textContent = 'Tribelands ' + VERSION;
  if ($('#tContinue')) $('#tContinue').addEventListener('click', () => startGame(saved));
  $('#tNew').addEventListener('click', openNewGame);
  $('#tHelp').addEventListener('click', openHelp);
  $('#tRec').addEventListener('click', openRecords);
  kick();
}

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  clampCam(); kick();
}
addEventListener('resize', resize);
resize();
toTitle();

// test hook: lets the browser tests drive the game without pixel-hunting
window.Tribelands = {
  get S() { return S; }, set S(v) { S = v; }, VERSION, tapTile, endTurn, act, select, undo, startGame, newGame, nextUnit,
  get busy() { return busy; }, get readyIds() { return readyIds; }, get workMarks() { return workMarks; }, refreshSel, get undoDepth() { return undoStack.length; }, moveInfo, targets, aiTurn,
};

</script>

  if (navigator.serviceWorker && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
