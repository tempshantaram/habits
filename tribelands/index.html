<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16202E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="A turn-based strategy game: explore, grow cities, research and conquer. Runs offline on this device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tribelands</title>
<style>
:root{
  --sea:#16202E;
  --panel:rgba(252,251,248,.97);
  --ink:#1D2330;
  --muted:#5D6778;
  --faint:#8A93A3;
  --line:#E2E5EA;
  --btn:#EEF0F4;
  --btn-ink:#1D2330;
  --accent:#2F6FDE;
  --good:#2E9E5B;
  --bad:#D6453D;
  --star:#E9A816;
  --shadow:0 6px 24px rgba(10,16,28,.28);
  --radius:16px;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:rgba(27,33,45,.97);
    --ink:#EEF1F6;
    --muted:#A3ACBB;
    --faint:#7B8597;
    --line:#333D50;
    --btn:#2A3345;
    --btn-ink:#EEF1F6;
    --accent:#6A9CF5;
    --shadow:0 6px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --panel:rgba(27,33,45,.97); --ink:#EEF1F6; --muted:#A3ACBB; --faint:#7B8597;
  --line:#333D50; --btn:#2A3345; --btn-ink:#EEF1F6; --accent:#6A9CF5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea);
  font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  overscroll-behavior:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}

/* ---- HUD ---- */
#hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none}
#hud > *{pointer-events:auto}
.chip{background:var(--panel);box-shadow:var(--shadow);border-radius:999px;height:40px;
  display:flex;align-items:center;gap:6px;padding:0 14px;font-weight:650;white-space:nowrap}
.chip small{font-weight:600;color:var(--good);font-size:13px}
.chip .dot{width:14px;height:14px;border-radius:4px;transform:rotate(45deg);flex:none}
.chip .star{color:var(--star)}
.grow{flex:1}
.chip.btn{padding:0 14px}
.chip.icon{width:40px;justify-content:center;padding:0;font-size:18px}

/* ---- bottom panel ---- */
#panel{position:fixed;left:0;right:0;bottom:0;background:var(--panel);box-shadow:var(--shadow);
  border-radius:var(--radius) var(--radius) 0 0;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 12px);
  max-height:46vh;overflow:auto}
@media (min-width:760px){
  #panel{left:50%;transform:translateX(-50%);width:720px;bottom:12px;border-radius:var(--radius)}
}
.prow{display:flex;gap:10px;align-items:center}
#pinfo{flex:1;min-width:0}
#pinfo h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#pinfo p{margin:2px 0 0;color:var(--muted);font-size:13px}
.pbtns{display:flex;gap:8px;flex:none}
.pbtns button{height:44px;border-radius:12px;padding:0 14px;background:var(--btn);color:var(--btn-ink);font-weight:650}
.pbtns button.primary{background:var(--accent);color:#fff}
.pbtns button:disabled{opacity:.4}
.tag{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:6px;color:#fff}
.hpbar{display:inline-block;width:64px;height:7px;border-radius:4px;background:var(--line);overflow:hidden;vertical-align:middle}
.hpbar i{display:block;height:100%;background:var(--good)}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.pips i.on{background:var(--good);border-color:var(--good)}
#pacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#pacts:empty{display:none}
.act{min-width:92px;min-height:54px;border-radius:12px;background:var(--btn);color:var(--btn-ink);
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:6px 12px;text-align:left}
.act b{font-size:14px}
.act span{font-size:12px;color:var(--muted)}
.act span .star{color:var(--star)}
.act:disabled{opacity:.45}
.act.go{background:var(--accent);color:#fff}
.act.go span{color:rgba(255,255,255,.85)}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}

/* ---- toast ---- */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 60px);transform:translateX(-50%);
  background:rgba(20,26,38,.92);color:#fff;padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;
  opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1}

/* ---- modal sheets ---- */
.modal{position:fixed;inset:0;background:rgba(8,12,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
@media (min-width:760px){ .modal{align-items:center} }
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);box-shadow:var(--shadow)}
@media (min-width:760px){ .sheet{border-radius:20px} }
.sheet h2{margin:0 0 4px;font-size:21px}
.sheet h4{margin:16px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sheet p{margin:6px 0}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.big{height:50px;border-radius:14px;background:var(--btn);color:var(--btn-ink);font-weight:700;padding:0 18px;flex:1;min-width:120px}
.big.primary{background:var(--accent);color:#fff}
.big.danger{color:var(--bad)}
.seg{display:flex;background:var(--btn);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:40px;border-radius:9px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.tribes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tribe{border-radius:14px;padding:10px 12px;background:var(--btn);text-align:left;border:2px solid transparent;display:block}
.tribe.on{border-color:var(--c)}
.tribe b{display:flex;align-items:center;gap:8px;font-size:15px}
.tribe b i{width:14px;height:14px;border-radius:4px;background:var(--c);transform:rotate(45deg)}
.tribe span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.close{float:right;width:36px;height:36px;border-radius:50%;background:var(--btn);font-size:18px}

/* tech tree */
.branch{display:grid;grid-template-columns:1fr 14px 1fr 14px 1fr;align-items:center;margin-bottom:10px}
.branch .col{display:flex;flex-direction:column;gap:6px}
.branch .arr{color:var(--faint);text-align:center;font-size:12px}
.tn{border-radius:12px;padding:8px 8px;background:var(--btn);min-height:48px;text-align:left;border:2px solid transparent;width:100%}
.tn b{display:block;font-size:13px}
.tn span{display:block;font-size:11.5px;color:var(--muted)}
.tn.done{background:var(--c);color:#fff}
.tn.done span{color:rgba(255,255,255,.85)}
.tn.locked{opacity:.45}
.tn.sel{border-color:var(--accent)}
.tdetail{border-top:1px solid var(--line);padding-top:12px;margin-top:6px;min-height:96px}

/* reward */
.reward{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:14px;background:var(--btn);text-align:left;flex:1;min-width:140px}
.reward b{font-size:16px}
.reward span{font-size:13px;color:var(--muted)}

/* title */
.title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:24px 16px calc(env(safe-area-inset-bottom,0px) + 28px);
  background:linear-gradient(180deg,rgba(14,20,32,0) 30%,rgba(14,20,32,.8) 75%)}
.logo{font-size:44px;font-weight:800;letter-spacing:-.03em;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.5);margin:0}
.tagline{color:rgba(255,255,255,.8);margin:4px 0 22px;text-align:center}
.tmenu{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px}
.tmenu .big{flex:none}
.ver{color:rgba(255,255,255,.45);font-size:12px;margin-top:14px}
.help li{margin:6px 0}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:10px 0}
</style>
</head>
<body>
<canvas id="cv" aria-label="Game map"></canvas>

<div id="hud" hidden>
  <div class="chip"><i class="dot" id="hudDot"></i><span><span class="star">★</span> <span id="hudStars">0</span></span><small id="hudInc">+0</small></div>
  <div class="chip" id="hudTurn">Turn 1</div>
  <div class="grow"></div>
  <button class="chip btn" id="btnTech">Tech</button>
  <button class="chip icon" id="btnMenu" aria-label="Menu">☰</button>
</div>

<div id="panel" hidden>
  <div class="prow">
    <div id="pinfo"></div>
    <div class="pbtns">
      <button id="btnUndo" title="Undo last action">Undo</button>
      <button id="btnEnd" class="primary">End turn</button>
    </div>
  </div>
  <div id="pacts"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="title" class="title">
  <h1 class="logo">Tribelands</h1>
  <p class="tagline">Explore, expand, research, conquer. One tribe will rule the land.</p>
  <div class="tmenu" id="tmenu"></div>
  <div class="ver" id="tver"></div>
</div>

<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<script>
'use strict';
/* Tribelands — rules, map generation and the computer tribes.
   Everything the game knows lives in S, a plain object that goes straight to
   JSON: that is the autosave, and a copy of it is what Undo steps back to.   */

const VERSION = 'v23';
const SAVE_KEY = 'tribelands-save-v1';
const PREF_KEY = 'tribelands-prefs-v1';

const FIELD = 0, FOREST = 1, MOUNTAIN = 2, SHALLOW = 3, OCEAN = 4;
const TERRAIN_NAME = ['Field', 'Forest', 'Mountain', 'Shallow water', 'Ocean'];
const isWater = t => t === SHALLOW || t === OCEAN;

const TRIBES = [
  { name: 'Aurel', color: '#E7B23A', skin: '#F2D0AE', tech: 'organization', start: 'warrior', hat: 'plume',
    blurb: 'Orchard folk of the golden meadows. Start with Organization, so fruit can be gathered from turn one.',
    land: { forest: .24, mountain: .14 }, res: { fruit: .34, crop: .22, animal: .38, ore: .35 },
    pal: { field: '#A9C95B', forest: '#5C9B3F', mountain: '#A4A79F', tree: 'round', snow: true },
    syl: ['au', 'rel', 'lo', 'ria', 'ven', 'ta', 'mer', 'ol', 'ca', 'sa', 'tri', 'no', 'ae', 'lis'] },
  { name: 'Kiro', color: '#D9473A', skin: '#EBC39B', tech: 'climbing', start: 'warrior', hat: 'cone',
    blurb: 'Highland builders among the peaks. Start with Climbing: cross mountains and defend them well.',
    land: { forest: .2, mountain: .36 }, res: { fruit: .28, crop: .18, animal: .32, ore: .6 },
    pal: { field: '#8FC580', forest: '#3F8F6C', mountain: '#BBA99F', tree: 'bamboo', snow: true },
    syl: ['ki', 'ro', 'shi', 'ta', 'ka', 'mo', 'ren', 'yu', 'ha', 'zen', 'to', 'mi', 'sa', 'no'] },
  { name: 'Thane', color: '#3C7ED3', skin: '#F6DCC8', tech: 'hunting', start: 'warrior', hat: 'horns',
    blurb: 'Hunters of the deep pine forests. Start with Hunting, so wild animals are food from turn one.',
    land: { forest: .48, mountain: .15 }, res: { fruit: .22, crop: .15, animal: .52, ore: .35 },
    pal: { field: '#80B06B', forest: '#2F6D4C', mountain: '#8F98A9', tree: 'pine', snow: true },
    syl: ['thor', 'ga', 'hel', 'vik', 'run', 'sten', 'ul', 'fa', 'bjor', 'nar', 'dal', 'ey', 'grim', 'ska'] },
  { name: 'Sandari', color: '#9A5ACF', skin: '#C8915E', tech: 'riding', start: 'rider', hat: 'wrap',
    blurb: 'Riders of the open savanna. Start with Riding, and with a Rider instead of a Warrior.',
    land: { forest: .14, mountain: .13 }, res: { fruit: .3, crop: .3, animal: .38, ore: .3 },
    pal: { field: '#D5BF77', forest: '#8BA54C', mountain: '#BD9E75', tree: 'acacia', snow: false },
    syl: ['sa', 'han', 'ka', 'du', 'ri', 'ma', 'zi', 'ba', 'nu', 'ta', 'ol', 'ke', 'mar', 'ish'] },
];

const TECHS = {
  riding:       { name: 'Riding',       tier: 1, parent: null,           desc: 'Train Riders: they move two tiles and can move again after attacking.' },
  shields:      { name: 'Shields',      tier: 2, parent: 'riding',       desc: 'Train Defenders: 15 HP and defence 3, for holding cities.' },
  chivalry:     { name: 'Chivalry',     tier: 3, parent: 'shields',      desc: 'Train Knights: they move three tiles, and after a kill they may attack again.' },
  organization: { name: 'Organization', tier: 1, parent: null,           desc: 'Gather fruit: +1 population for 2 ★.' },
  farming:      { name: 'Farming',      tier: 2, parent: 'organization', desc: 'Build farms on crops: +2 population for 5 ★.' },
  mathematics:  { name: 'Mathematics',  tier: 3, parent: 'farming',      desc: 'Train Catapults: attack 4 from three tiles away, but fragile.' },
  climbing:     { name: 'Climbing',     tier: 1, parent: null,           desc: 'Move onto mountains. Units on mountains defend 50% better.' },
  mining:       { name: 'Mining',       tier: 2, parent: 'climbing',     desc: 'Build mines on ore: +2 population for 5 ★.' },
  smithery:     { name: 'Smithery',     tier: 3, parent: 'mining',       desc: 'Train Swordsmen: attack 3, defence 3, 15 HP.' },
  hunting:      { name: 'Hunting',      tier: 1, parent: null,           desc: 'Hunt wild animals: +1 population for 2 ★.' },
  archery:      { name: 'Archery',      tier: 2, parent: 'hunting',      desc: 'Train Archers, which shoot two tiles. Units in forests defend 50% better.' },
  forestry:     { name: 'Forestry',     tier: 2, parent: 'hunting',      desc: 'Build lumber huts (+1 population for 3 ★) and clear forest for +1 ★.' },
  fishing:      { name: 'Fishing',      tier: 1, parent: null,           desc: 'Catch fish (+1 population for 2 ★) and build ports. A unit that enters a port becomes a boat.' },
  sailing:      { name: 'Sailing',      tier: 2, parent: 'fishing',      desc: 'Boats can cross the deep ocean.' },
  navigation:   { name: 'Navigation',   tier: 3, parent: 'sailing',      desc: 'Boats become Warships: attack 3, defence 2, move 3.' },
};
const TECH_ROOTS = ['riding', 'organization', 'climbing', 'hunting', 'fishing'];

const UNITS = {
  warrior:   { name: 'Warrior',   cost: 2, hp: 10, atk: 2,   def: 2, mv: 1, rng: 1, tech: null,          dash: 1 },
  rider:     { name: 'Rider',     cost: 3, hp: 10, atk: 2,   def: 1, mv: 2, rng: 1, tech: 'riding',      dash: 1, escape: 1 },
  archer:    { name: 'Archer',    cost: 3, hp: 10, atk: 2,   def: 1, mv: 1, rng: 2, tech: 'archery',     dash: 1 },
  defender:  { name: 'Defender',  cost: 3, hp: 15, atk: 1,   def: 3, mv: 1, rng: 1, tech: 'shields' },
  swordsman: { name: 'Swordsman', cost: 5, hp: 15, atk: 3,   def: 3, mv: 1, rng: 1, tech: 'smithery',    dash: 1 },
  catapult:  { name: 'Catapult',  cost: 8, hp: 10, atk: 4,   def: 0, mv: 1, rng: 3, tech: 'mathematics' },
  knight:    { name: 'Knight',    cost: 8, hp: 10, atk: 3.5, def: 1, mv: 3, rng: 1, tech: 'chivalry',    dash: 1, persist: 1 },
  giant:     { name: 'Giant',     cost: 0, hp: 40, atk: 5,   def: 4, mv: 1, rng: 1, tech: '-',           dash: 1 },
};
const TRAINABLE = ['warrior', 'rider', 'archer', 'defender', 'swordsman', 'catapult', 'knight'];
const BOATS = {
  boat:    { name: 'Boat',    atk: 1, def: 1, mv: 2, rng: 2, dash: 1 },
  warship: { name: 'Warship', atk: 3, def: 2, mv: 3, rng: 2, dash: 1 },
};

// Work you can do on a tile inside your borders. No unit needed, only stars.
const WORKS = {
  fruit:  { name: 'Gather fruit', tech: 'organization', cost: 2, pop: 1, ok: t => t.res === 'fruit' },
  animal: { name: 'Hunt',         tech: 'hunting',      cost: 2, pop: 1, ok: t => t.res === 'animal' },
  fish:   { name: 'Fish',         tech: 'fishing',      cost: 2, pop: 1, ok: t => t.res === 'fish' },
  farm:   { name: 'Farm',         tech: 'farming',      cost: 5, pop: 2, ok: t => t.res === 'crop' },
  mine:   { name: 'Mine',         tech: 'mining',       cost: 5, pop: 2, ok: t => t.res === 'ore' },
  lumber: { name: 'Lumber hut',   tech: 'forestry',     cost: 3, pop: 1, ok: t => t.t === FOREST && !t.res && !t.imp },
  clear:  { name: 'Clear forest', tech: 'forestry',     cost: 0, pop: 0, gain: 1, ok: t => t.t === FOREST && !t.imp },
  port:   { name: 'Port',         tech: 'fishing',      cost: 7, pop: 1, ok: t => t.t === SHALLOW && !t.imp && !t.res },
};
const RES_NAME = { fruit: 'Fruit', crop: 'Crop', animal: 'Wild animal', fish: 'Fish', ore: 'Ore' };
const IMP_NAME = { farm: 'Farm', mine: 'Mine', lumber: 'Lumber hut', port: 'Port' };

const REWARDS = {
  workshop:  { name: 'Workshop',          desc: '+1 ★ every turn.' },
  explorer:  { name: 'Explorer',          desc: 'Scouts out and reveals a long stretch of the map.' },
  walls:     { name: 'City wall',         desc: 'Units in this city defend four times as well.' },
  resources: { name: 'Resources',         desc: '+5 ★ right now.' },
  popgrowth: { name: 'Population growth', desc: '+3 population, which may level the city again.' },
  border:    { name: 'Border growth',     desc: 'Territory grows from 3×3 to 5×5.' },
  giant:     { name: 'Giant',             desc: 'A super unit: 40 HP, attack 5, defence 4.' },
  park:      { name: 'Park',              desc: '+1 ★ every turn, and a lovely place to be.' },
};
function rewardChoices(level) {
  if (level === 2) return ['workshop', 'explorer'];
  if (level === 3) return ['walls', 'resources'];
  if (level === 4) return ['popgrowth', 'border'];
  return ['giant', 'park'];
}

// ---------- small helpers ----------
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hash(x, y, k = 0) {
  let h = Math.imul(x + 1013, 374761393) ^ Math.imul(y + 7, 668265263) ^ Math.imul(k + 3, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

let S = null;                        // the game
const I = (x, y) => y * S.n + x;
const XY = i => [i % S.n, (i / S.n) | 0];
const inb = (x, y) => x >= 0 && y >= 0 && x < S.n && y < S.n;
const tileAt = (x, y) => S.tiles[I(x, y)];
const cheb = (ax, ay, bx, by) => Math.max(Math.abs(ax - bx), Math.abs(ay - by));
function nbrs(x, y) {
  const r = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = x + dx, ny = y + dy;
    if (inb(nx, ny)) r.push([nx, ny]);
  }
  return r;
}
function unitAt(x, y) { for (const u of S.units) if (u.x === x && u.y === y) return u; return null; }
function unitById(id) { for (const u of S.units) if (u.id === id) return u; return null; }
function cityAtI(i) { const c = S.tiles[i].cityHere; return c >= 0 ? S.cities[c] : null; }
function ownerOfI(i) { const c = S.tiles[i].city; return c >= 0 ? S.cities[c].owner : -1; }
const has = (p, t) => !!S.players[p].techs[t];
const tribeOf = p => TRIBES[S.players[p].tribe];
const citiesOf = p => S.cities.filter(c => c.owner === p);
const unitsOf = p => S.units.filter(u => u.owner === p);
const isHuman = p => S.players[p].human;

function st(u) { return u.boat ? BOATS[u.boat] : UNITS[u.type]; }
function maxHp(u) { return UNITS[u.type].hp + (u.vet ? 5 : 0); }
function unitName(u) { return u.boat ? BOATS[u.boat].name + ' (' + UNITS[u.type].name + ')' : UNITS[u.type].name; }

function techCost(p, t) { return TECHS[t].tier * Math.max(1, citiesOf(p).length) + 4; }
function canResearch(p, t) {
  const T = TECHS[t];
  return !has(p, t) && (!T.parent || has(p, T.parent)) && S.players[p].stars >= techCost(p, t);
}
function income(p) {
  let s = 0;
  for (const c of S.cities) if (c.owner === p) s += c.level + (c.workshop ? 1 : 0) + c.parks + (c.capital ? 1 : 0);
  if (!isHuman(p) && S.diff === 'hard') s += 2;
  return s;
}

    if (spot) addUnit('giant', c.owner, spot[0], spot[1], c.id); else P.stars += 5;
  } else if (key === 'explorer') {
    let x = c.x, y = c.y;
    for (let k = 0; k < 22; k++) {
      const opts = nbrs(x, y);
      const fresh = opts.filter(([nx, ny]) => !seen(I(nx, ny)));
      [x, y] = fresh.length && Math.random() < .8 ? pick(fresh) : pick(opts);
      reveal(x, y, 1);
    }
  }
}

function startTurn(p) {
  const P = S.players[p];
  if (S.turn > 1) P.stars += income(p);          // nobody earns on the first turn
  for (const u of S.units) if (u.owner === p) { u.moved = false; u.attacked = false; }
}
function checkElims() {
  for (const P of S.players) {
    if (!P.alive) continue;
    if (!S.cities.some(c => c.owner === P.id)) {
      P.alive = false;
      S.units = S.units.filter(u => u.owner !== P.id);
      FX.say(`The ${TRIBES[P.tribe].name} tribe has fallen.`, P.id);
    }
  }
  if (!S.players[0].alive) S.over = 'lose';
  else if (S.players.every(P => P.human || !P.alive)) S.over = 'win';
}

// ---------- the computer tribes ----------
function aiReward(c) {
  const lv = c.level;
  const key = lv === 2 ? 'workshop' : lv === 3 ? (enemyNear(c.x, c.y, c.owner, 4) ? 'walls' : 'resources')
    : lv === 4 ? 'popgrowth' : 'giant';
  applyReward(c, key);
}

// Every tile a computer unit could want to reach, by breadth-first flood over land.
function goalField(p, goals) {
  const N = S.n * S.n, dist = new Array(N).fill(1e9), src = new Array(N).fill(-1), q = [];
  for (const g of goals) if (dist[g] > 0) { dist[g] = 0; src[g] = g; q.push(g); }
  for (let h = 0; h < q.length; h++) {
    const i = q[h], [x, y] = XY(i);
    for (const [nx, ny] of nbrs(x, y)) {
      const j = I(nx, ny);
      if (dist[j] <= dist[i] + 1) continue;
      const t = S.tiles[j];
      if (isWater(t.t) || (t.t === MOUNTAIN && !has(p, 'climbing'))) continue;
      dist[j] = dist[i] + 1; src[j] = src[i]; q.push(j);
    }
  }
  return { dist, src };
}

function techUseful(p, t) {
  const inLand = f => S.tiles.some((tt, i) => ownerOfI(i) === p && f(tt));
  switch (t) {
    case 'organization': return inLand(tt => tt.res === 'fruit' || tt.res === 'crop');
    case 'farming': return inLand(tt => tt.res === 'crop');
    case 'hunting': return inLand(tt => tt.res === 'animal' || tt.t === FOREST);
    case 'forestry': return inLand(tt => tt.t === FOREST && !tt.res);
    case 'fishing': return inLand(tt => tt.res === 'fish');
    case 'climbing': return inLand(tt => tt.t === MOUNTAIN);
    case 'mining': return inLand(tt => tt.res === 'ore');
    case 'sailing': case 'navigation': return false;
    default: return S.turn > 3;
  }
}
function aiResearch(p, reserve) {
  const P = S.players[p];
  const order = ['organization', 'hunting', 'farming', 'riding', 'climbing', 'mining', 'archery', 'shields',
    'fishing', 'forestry', 'smithery', 'chivalry', 'mathematics'];
  const useful = t => techUseful(p, t) || Object.keys(TECHS).some(k => TECHS[k].parent === t && !has(p, k) && techUseful(p, k));
  for (const t of order) {
    if (has(p, t) || (TECHS[t].parent && !has(p, TECHS[t].parent)) || !useful(t)) continue;
    if (P.stars - techCost(p, t) >= reserve) { doResearch(p, t); return true; }
    return false;                      // save up for the one that matters most
  }
  return false;
}
function aiEconomy(p, reserve) {
  const P = S.players[p];
  for (let guard = 0; guard < 40; guard++) {
    let best = null, bv = -1;
    for (let i = 0; i < S.tiles.length; i++) {
      if (ownerOfI(i) !== p) continue;
      for (const key of ['fruit', 'animal', 'fish', 'farm', 'mine', 'lumber']) {
        if (!canWork(p, i, key)) continue;
        const W = WORKS[key];
        if (P.stars - W.cost < reserve) continue;
        const c = S.cities[S.tiles[i].city];
        let v = W.pop / W.cost + (c.pop + W.pop >= c.level + 1 ? .6 : 0) + Math.random() * .05;
        if (v > bv) { bv = v; best = [i, key]; }
      }
    }
    if (!best) return;
    doWork(p, best[0], best[1]);
  }
}
function aiPickUnit(p, threat) {
  const P = S.players[p];
  const w = { warrior: 3, rider: 4, archer: 3, defender: threat ? 5 : 1, swordsman: 6, catapult: threat ? 3 : 1, knight: 6 };
  const avail = TRAINABLE.filter(k => (!UNITS[k].tech || has(p, UNITS[k].tech)) && UNITS[k].cost <= P.stars);
  if (!avail.length) return null;
  let tot = 0; for (const k of avail) tot += w[k];
  let r = Math.random() * tot;
  for (const k of avail) { r -= w[k]; if (r <= 0) return k; }
  return avail[0];
}
function aiTrain(p, want) {
  let made = 0;
  for (const c of shuffle(citiesOf(p))) {
    if (made >= want) break;
    if (unitAt(c.x, c.y) || homeCount(c) >= capacity(c)) continue;
    const threat = enemyNear(c.x, c.y, p, 4);
    const k = aiPickUnit(p, threat);
    if (!k || !canTrain(p, c, k)) continue;
    doTrain(p, c, k); made++;
  }
  return made;
}
async function aiAttack(u) {
  for (let guard = 0; guard < 4; guard++) {
    if (!S.units.includes(u)) return;
    let best = null, bs = 0;
    for (const e of targets(u)) {
      const r = combat(u, e);
      let s = r.dmg + (r.killed ? 5 + UNITS[e.type].cost : 0) - r.ret * 1.1 - (r.ret >= u.hp ? 40 : 0);
      const c = cityAtI(I(e.x, e.y));
      if (c && c.owner === u.owner) s += 4;             // throw invaders out of our cities
      else if (c && S.diff !== 'easy' && r.ret < u.hp) {
        // a garrison never falls to one attacker: gang up, as a player would
        const friends = S.units.filter(v => v.owner === u.owner && v !== u && cheb(v.x, v.y, e.x, e.y) <= 1).length;
        s += 2 + friends * 2.5;
      }
      if (s > bs) { bs = s; best = e; }
    }
    if (!best) return;
    if (S.diff === 'easy' && Math.random() < .35) return;
    await doAttack(u, best);
    if (u.attacked) return;
  }
}
async function aiUnit(u, claimed) {
  if (!S.units.includes(u) || S.over) return;
  const p = u.owner;
  if (canCapture(u)) { doCapture(u); await FX.pause(u); return; }
  if (canRuin(u)) { doRuin(u); return; }
  if (exhausted(u)) return;
  if (u.hp < maxHp(u) * .45 && canRecover(u) && !enemyNear(u.x, u.y, p)) { doRecover(u); return; }
  await aiAttack(u);
  if (!S.units.includes(u) || u.moved || u.boat) return;
  const here = I(u.x, u.y), hc = cityAtI(here);
  if (hc && hc.owner !== p) return;                          // hold it and capture next turn
  if (hc && hc.owner === p && enemyNear(u.x, u.y, p, 2)) return;   // garrison
  const goals = [];
  for (const c of S.cities) {
    const gi = I(c.x, c.y);
    if (claimed.has(gi)) continue;
    if (c.owner !== p) goals.push(gi);
    else if (!unitAt(c.x, c.y) && enemyNear(c.x, c.y, p, 3)) goals.push(gi);
  }
  for (let i = 0; i < S.tiles.length; i++) if (S.tiles[i].ruin && !claimed.has(i) && !isWater(S.tiles[i].t)) goals.push(i);
  for (const e of S.units) if (e.owner !== p) goals.push(I(e.x, e.y));
  const { dist, src } = goalField(p, goals);
  const { dests, prev } = moveInfo(u);
  let best = here, bd = dist[here];
  for (const d of dests) {
    let v = dist[d];
    const t = S.tiles[d];
    if ((t.t === FOREST && has(p, 'archery')) || (t.t === MOUNTAIN && has(p, 'climbing'))) v -= .2;
    if (S.diff === 'easy') v += Math.random() * 1.5;
    if (v < bd) { bd = v; best = d; }
  }
  if (best !== here) {
    if (src[best] >= 0 && dist[best] <= 4) claimed.add(src[best]);
    await doMove(u, best, prev);
    await FX.pause(u);
    const bc = cityAtI(best);
    if (bc && bc.owner !== p) claimed.add(best);
    await aiAttack(u);
  } else if (canRecover(u)) doRecover(u);
}
async function aiTurn(p) {
  const P = S.players[p];
  const mine = citiesOf(p);
  const threat = mine.some(c => enemyNear(c.x, c.y, p, 3));
  const units = unitsOf(p).length;
  const desired = mine.reduce((s, c) => s + c.level, 0) + (threat ? 2 : 0) + (S.diff === 'hard' ? 1 : 0);
  if (units < Math.max(2, desired * (S.diff === 'easy' ? .6 : 1))) aiTrain(p, threat ? 3 : 1);
  aiResearch(p, S.diff === 'easy' ? 2 : 0);
  aiEconomy(p, threat ? 3 : 0);
  const claimed = new Set();
  const list = unitsOf(p).sort((a, b) => (canCapture(b) ? 1 : 0) - (canCapture(a) ? 1 : 0));
  for (const u of list) {
    await aiUnit(u, claimed);
    if (S.over) return;
  }
  if (P.stars >= 6) aiTrain(p, 2);
}

}

/* Tribelands — drawing, touch input and the screens around the map. */

const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const TW = 64, TH = 32, LH = 6, WD = 4;          // tile size, land edge depth, water drop
const ZMIN = .45, ZMAX = 2.6;
let W = 0, H = 0, DPR = 1;
const cam = { x: 0, y: 0, z: 1 };

// ---------- colour ----------
const _shade = new Map();
function shade(hex, amt) {
  const key = hex + amt;
  let v = _shade.get(key);
  if (v) return v;
  let r, g, b;
  if (hex[0] === '#') { const n = parseInt(hex.slice(1), 16); r = n >> 16; g = (n >> 8) & 255; b = n & 255; }
  else [r, g, b] = hex.match(/\d+/g).map(Number);         // an rgb() this function made earlier
  const f = c => amt < 0 ? c * (1 + amt) : c + (255 - c) * amt;
  v = `rgb(${f(r) | 0},${f(g) | 0},${f(b) | 0})`;
  _shade.set(key, v);
  return v;
}
const colOf = p => TRIBES[S.players[p].tribe].color;

// ---------- geometry ----------
const iso = (x, y) => [(x - y) * TW / 2, (x + y) * TH / 2];
function screenToTile(sx, sy) {
  const wx = (sx - W / 2) / cam.z + cam.x, wy = (sy - H / 2) / cam.z + cam.y;
  const a = wx / (TW / 2), b = wy / (TH / 2);
  return [Math.round((a + b) / 2), Math.round((b - a) / 2)];
}
const toScreen = (wx, wy) => [(wx - cam.x) * cam.z + W / 2, (wy - cam.y) * cam.z + H / 2];
function clampCam() {
  if (!S) return;
  const n = S.n;
  cam.z = clamp(cam.z, ZMIN, ZMAX);
  cam.x = clamp(cam.x, -n * TW / 2, n * TW / 2);
  cam.y = clamp(cam.y, -TH, n * TH);
}
function centerOn(x, y) { const [wx, wy] = iso(x, y); cam.x = wx; cam.y = wy + 30 / cam.z; clampCam(); }

// ---------- drawing primitives ----------
function poly(pts, fill) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let k = 2; k < pts.length; k += 2) ctx.lineTo(pts[k], pts[k + 1]);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function dpath(cx, cy, w = TW / 2, h = TH / 2) {
  ctx.beginPath(); ctx.moveTo(cx, cy - h); ctx.lineTo(cx + w, cy); ctx.lineTo(cx, cy + h); ctx.lineTo(cx - w, cy); ctx.closePath();
}
// A triangle split down its apex into a lit and a shaded facet — the low-poly look.
function tri2(xl, xr, yb, xa, ya, col) {
  poly([xl, yb, xa, yb + 1, xa, ya], shade(col, .14));
  poly([xa, yb + 1, xr, yb, xa, ya], shade(col, -.12));
}
function tile3(cx, cy, top, side) {
  const w = TW / 2 + .5, h = TH / 2 + .25;
  if (side) {
    poly([cx - w, cy, cx, cy + h, cx, cy + h + side, cx - w, cy + side], shade(top, -.28));
    poly([cx, cy + h, cx + w, cy, cx + w, cy + side, cx, cy + h + side], shade(top, -.42));
  }
  poly([cx, cy - h, cx + w, cy, cx, cy + h, cx - w, cy], top);
  poly([cx, cy - h, cx, cy + h, cx - w, cy], shade(top, .05));
}

// ---------- terrain ----------
function drawGround(x, y) {
  const i = I(x, y), t = S.tiles[i];
  const [cx, cy] = iso(x, y);
  if (!seen(i)) { tile3(cx, cy, hash(x, y, 2) < .5 ? '#243045' : '#26334A', LH); return; }
  if (isWater(t.t)) {
    const c = t.t === SHALLOW ? '#5AB4D6' : '#2D6DAE';
    tile3(cx, cy + WD, shade(c, (hash(x, y, 3) - .5) * .05), 0);
    if (hash(x, y, 4) < .55) {
      ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1.2;
      const ox = (hash(x, y, 5) - .5) * 26, oy = (hash(x, y, 6) - .5) * 10 + WD;
      ctx.beginPath(); ctx.moveTo(cx + ox - 6, cy + oy); ctx.quadraticCurveTo(cx + ox - 3, cy + oy - 2.5, cx + ox, cy + oy);
      ctx.quadraticCurveTo(cx + ox + 3, cy + oy + 2.5, cx + ox + 6, cy + oy); ctx.stroke();
    }
    return;
  }
  const pal = TRIBES[t.clim].pal;
  let top = t.t === FOREST ? shade(pal.field, -.1) : t.t === MOUNTAIN ? shade(pal.mountain, -.12) : pal.field;
  if (t.cityHere >= 0) top = S.cities[t.cityHere].owner >= 0 ? '#D9CEBB' : '#C9B387';
  top = shade(top, (hash(x, y, 1) - .5) * .08);
  tile3(cx, cy, top, LH);
  if (t.imp === 'farm') {
    ctx.save(); dpath(cx, cy, TW / 2 - 6, TH / 2 - 3); ctx.clip();
    for (let k = -4; k <= 4; k++) {
      poly([cx + k * 7 - 3, cy - 20 + 0, cx + k * 7 + 3, cy - 20, cx + k * 7 + 3 - 20, cy + 20, cx + k * 7 - 3 - 20, cy + 20],
        k % 2 ? '#E8C95A' : '#C9B04A');
    }
    ctx.restore();
  }
}

function drawBorders() {
  const n = S.n;
  for (let i = 0; i < n * n; i++) {
    if (!seen(i)) continue;
    const o = ownerOfI(i);
    if (o < 0) continue;
    const [x, y] = XY(i), t = S.tiles[i];
    let [cx, cy] = iso(x, y);
    if (isWater(t.t)) cy += WD;
    const col = colOf(o);
    ctx.globalAlpha = .17; dpath(cx, cy); ctx.fillStyle = col; ctx.fill(); ctx.globalAlpha = 1;
    const w = TW / 2, h = TH / 2, f = .88;
    const N = [cx, cy - h * f], E = [cx + w * f, cy], Sv = [cx, cy + h * f], Wv = [cx - w * f, cy];
    const edges = [[x, y - 1, N, E], [x + 1, y, E, Sv], [x, y + 1, Sv, Wv], [x - 1, y, Wv, N]];
    ctx.strokeStyle = col; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    for (const [nx, ny, a, b] of edges) {
      if (inb(nx, ny) && ownerOfI(I(nx, ny)) === o) continue;
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
  }
}

function drawTree(kind, x, y, col, s = 1) {
  if (kind === 'pine') {
    poly([x - 1, y, x + 1, y, x + 1, y - 5, x - 1, y - 5], '#5A3E2B');
    tri2(x - 7 * s, x + 7 * s, y - 4, x, y - 15 * s, col);
    tri2(x - 5 * s, x + 5 * s, y - 10 * s, x, y - 21 * s, shade(col, .06));
  } else if (kind === 'bamboo') {
    for (const d of [-4, 0, 4]) {
      const h = 18 + (d + 4) * .6;
      poly([x + d - 1, y, x + d + 1, y, x + d + 1, y - h, x + d - 1, y - h], shade(col, d < 0 ? .25 : .1));
      poly([x + d + 1, y - h + 4, x + d + 7, y - h + 1, x + d + 2, y - h + 7], shade(col, -.05));

  } else if (kind === 'acacia') {
    ctx.strokeStyle = '#6B4A30'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 1, y - 9); ctx.stroke();
    poly([x - 11 * s, y - 10, x + 11 * s, y - 10, x + 7 * s, y - 15, x - 7 * s, y - 15], shade(col, -.08));
    poly([x - 11 * s, y - 10, x, y - 10, x, y - 15, x - 7 * s, y - 15], shade(col, .12));
  } else {
    poly([x - 1.2, y, x + 1.2, y, x + 1.2, y - 6, x - 1.2, y - 6], '#6B4A30');
    const r = 7.5 * s, cyy = y - 12 * s;
    poly([x, cyy - r, x + r * .87, cyy - r / 2, x + r * .87, cyy + r / 2, x, cyy + r, x - r * .87, cyy + r / 2, x - r * .87, cyy - r / 2], shade(col, -.1));
    poly([x, cyy - r, x, cyy + r, x - r * .87, cyy + r / 2, x - r * .87, cyy - r / 2], shade(col, .12));
  }
}
function drawMountain(cx, cy, pal) {
  const c = pal.mountain;
  poly([cx + 2, cy + 1, cx + 26, cy + 3, cx + 15, cy - 15], shade(c, -.2));

// ---------- frame ----------
const anims = [];
let drawShot = null;                              // a ranged attack in flight, in world coordinates
let floats = [];
let raf = 0;
function kick() { if (!raf) raf = requestAnimationFrame(tick); }
function tick(now) {
  raf = 0;
  for (let k = anims.length - 1; k >= 0; k--) {
    const a = anims[k], t = Math.min(1, (now - a.t0) / a.ms);
    a.fn(t);
    if (t >= 1) { anims.splice(k, 1); a.res(); }
  }
  floats = floats.filter(f => now - f.t0 < f.ms);
  if (mode === 'title' && S) { cam.x = demoCam.x + Math.sin(now / 9000) * 70; cam.y = demoCam.y + Math.cos(now / 11000) * 30; }
  draw(now);

}
function tween(ms, fn) {

const sleep = ms => ms > 0 ? tween(ms, () => { }) : Promise.resolve();

function draw(now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1A2536'); g.addColorStop(1, '#101722');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const z = cam.z;
  ctx.setTransform(DPR * z, 0, 0, DPR * z, DPR * (W / 2 - cam.x * z), DPR * (H / 2 - cam.y * z));
  const n = S.n;
  const vx0 = cam.x - W / 2 / z - TW, vx1 = cam.x + W / 2 / z + TW, vy0 = cam.y - H / 2 / z - 60, vy1 = cam.y + H / 2 / z + TH;
  const visible = (x, y) => { const [wx, wy] = iso(x, y); return wx > vx0 && wx < vx1 && wy > vy0 && wy < vy1; };
  for (let s = 0; s <= 2 * n - 2; s++) for (let x = Math.max(0, s - n + 1); x <= Math.min(n - 1, s); x++) {
    if (visible(x, s - x)) drawGround(x, s - x);
  }
  drawBorders();
  // selection marker sits on the ground, under everything standing on it
  if (sel) {
    const [sx, sy] = sel.kind === 'unit' ? (() => { const u = unitById(sel.id); return u ? [u.x, u.y] : [-9, -9]; })() : XY(sel.i);
    if (inb(sx, sy)) {
      const [cx, cy] = iso(sx, sy);
      const dy = isWater(tileAt(sx, sy).t) ? WD : 0;
      ctx.lineWidth = 3; ctx.strokeStyle = '#FFE27A'; dpath(cx, cy + dy, TW / 2 - 2, TH / 2 - 1); ctx.stroke();
    }
  }
  const unitMap = new Map();
  for (const u of S.units) unitMap.set(I(u.x, u.y), u);
  for (let s = 0; s <= 2 * n - 2; s++) for (let x = Math.max(0, s - n + 1); x <= Math.min(n - 1, s); x++) {
    const y = s - x;
    if (!visible(x, y)) continue;
    const i = I(x, y), t = S.tiles[i];
    const [cx, cy] = iso(x, y);
    if (!seen(i)) { drawCloud(cx, cy, x, y); continue; }
    const pal = TRIBES[t.clim].pal;
    if (t.t === MOUNTAIN) drawMountain(cx, cy, pal);
    if (t.t === FOREST) {
      const k = t.imp === 'lumber' ? 2 : 3;
      const spots = [[-12, -1], [11, -4], [-1, 7]];
      for (let q = 0; q < k; q++) drawTree(pal.tree, cx + spots[q][0] + (hash(x, y, q) - .5) * 5, cy + spots[q][1], pal.forest, .9 + hash(x, y, q + 4) * .25);
    }

    if (t.imp) drawImp(t, cx, cy, ownerOfI(i));
    if (t.ruin) drawRuin(cx, cy);
    if (t.cityHere >= 0) drawCity(S.cities[t.cityHere], cx, cy);
    const u = unitMap.get(i);
    if (u) {
      if (u._wx !== undefined) continue;
      drawUnit(u, cx, cy);
    }
  }
  for (const u of S.units) if (u._wx !== undefined) drawUnit(u, u._wx, u._wy);
  // where the selected unit can go and what it can hit
  if (sel && sel.kind === 'unit' && !busy) {
    for (const d of selMoves.dests) {
      const [x, y] = XY(d), [cx, cy] = iso(x, y);
      const dy = isWater(S.tiles[d].t) ? WD : 0;

      ctx.strokeStyle = 'rgba(20,30,50,.35)'; ctx.lineWidth = 1; ctx.stroke();

      ctx.strokeStyle = '#FF4D40'; ctx.lineWidth = 3;

    }

    if (!seen(I(c.x, c.y))) continue;

    const [sx, sy] = toScreen(wx, wy - 28);
    if (sx < -80 || sx > W + 80 || sy < -30 || sy > H + 30) continue;

    if (c.owner >= 0) {
      const need = c.level + 1, pw = 7;
      const x0 = sx - (need * pw) / 2 + pw / 2;

  }
  if (sel && sel.kind === 'unit' && !busy) {
    const u = unitById(sel.id);
    if (u) for (const e of selTargets) {
      const r = combat(u, e), [wx, wy] = iso(e.x, e.y), [sx, sy] = toScreen(wx, wy - 34);

// ---------- animation hooks for the rules ----------
const SPEEDS = { normal: { step: 120, pause: 140 }, fast: { step: 55, pause: 50 }, instant: { step: 0, pause: 0 } };
const spd = () => SPEEDS[prefs.speed] || SPEEDS.normal;
const onScreen = (x, y) => S && !S.demo && seen(I(x, y));
FX.move = async (u, path) => {
  const human = isHuman(u.owner);
  const ms = human ? 90 : spd().step;
  if (!ms || (!human && !onScreen(u.x, u.y) && !path.some(i => seen(i)))) return;
  let [px, py] = iso(u.x, u.y);
  for (const i of path) {
    const [x, y] = XY(i), [nx, ny] = iso(x, y);
    await tween(ms, t => { u._wx = px + (nx - px) * t; u._wy = py + (ny - py) * t - Math.sin(t * Math.PI) * 5; });
    px = nx; py = ny;
  }
  delete u._wx; delete u._wy;
};
FX.attack = async (a, d) => {
  if (!onScreen(a.x, a.y) && !onScreen(d.x, d.y)) return;
  const ms = isHuman(a.owner) ? 160 : Math.max(spd().step * 1.5, 0);
  if (!ms) return;
  const [ax, ay] = iso(a.x, a.y), [dx, dy] = iso(d.x, d.y);
  if (st(a).rng > 1) {
    await tween(ms * 1.4, t => { drawShot = [ax + (dx - ax) * t, ay + (dy - ay) * t - Math.sin(t * Math.PI) * 30]; });
    drawShot = null;
  } else {
    await tween(ms, t => { const k = Math.sin(t * Math.PI) * .45; a._wx = ax + (dx - ax) * k; a._wy = ay + (dy - ay) * k; });
    delete a._wx; delete a._wy;
  }
};
FX.float = (x, y, text, color) => { if (onScreen(x, y)) { floats.push({ x, y, text, color, t0: performance.now(), ms: 1100 }); kick(); } };
FX.say = (msg, p, c) => { if (!S.demo && (isHuman(p) || !c || onScreen(c.x, c.y))) toast(msg); };
FX.pause = async u => { if (onScreen(u.x, u.y)) await sleep(spd().pause); };

// ---------- input ----------
const ptrs = new Map();
let drag = null, pinch = null;
cv.addEventListener('pointerdown', e => {
  try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false };
  else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: cam.z, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, cx: cam.x, cy: cam.y };
    if (drag) drag.moved = true;
  }
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId) || mode !== 'game') return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const z = clamp(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, ZMIN, ZMAX);
    const wx = (pinch.mx - W / 2) / pinch.z + pinch.cx, wy = (pinch.my - H / 2) / pinch.z + pinch.cy;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    cam.z = z; cam.x = wx - (mx - W / 2) / z; cam.y = wy - (my - H / 2) / z;
    clampCam(); kick();
  } else if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 9) drag.moved = true;

  cam.z = clamp(cam.z * Math.exp(-e.deltaY * .0015), ZMIN, ZMAX);

addEventListener('keydown', e => {

    cam.y += e.key === 'ArrowUp' ? -d : e.key === 'ArrowDown' ? d : 0;

function onTap(sx, sy) {
  if (mode !== 'game' || busy || !$('#modal').hidden) return;
  const [x, y] = screenToTile(sx, sy);
  if (!inb(x, y)) { select(null); return; }
  tapTile(x, y);
}
function tapTile(x, y) {
  const i = I(x, y);
  if (sel && sel.kind === 'unit' && !S.over) {
    const u = unitById(sel.id);
    if (u && u.owner === 0) {
      if (selMoves.dests.has(i)) { const prev = selMoves.prev; return act(() => doMove(u, i, prev), { undo: true }); }
      const tg = selTargets.find(e => e.x === x && e.y === y);
      if (tg) return act(() => doAttack(u, tg));
    }
  }
  const u = seen(i) ? unitAt(x, y) : null;
  if (u && !(sel && sel.kind === 'unit' && sel.id === u.id)) select({ kind: 'unit', id: u.id });

function select(s) {

}

  if (sel.kind === 'unit') {
    const u = unitById(sel.id);
    if (!u) { sel = null; return; }
    if (u.owner === 0 && S.cur === 0) { selMoves = moveInfo(u); selTargets = targets(u); }
  }
}

// ---------- doing things ----------
async function act(fn, o = {}) {
  if (busy || !S || S.over) return;
  busy = true;
  const snap = JSON.stringify(S);
  revealed = 0;
  const hadRewards = S.pendingRewards.length;
  let msg;
  try { msg = await fn(); }
  catch (err) { console.error(err); }
  busy = false;
  if (o.undo && revealed === 0 && S.pendingRewards.length === hadRewards) {
    undoStack.push(snap);
    if (undoStack.length > 40) undoStack.shift();
  } else undoStack = [];
  if (typeof msg === 'string') toast(msg);
  afterAction();
}
function afterAction() {
  checkElims();
  saveGame();
  refreshSel();
  renderHud();
  renderPanel();
  kick();
  if (S.pendingRewards.length) showReward();
  else if (S.over && !S.overShown) showGameOver();
}
function undo() {
  if (busy || !undoStack.length) return;
  S = JSON.parse(undoStack.pop());
  refreshSel(); renderHud(); renderPanel(); saveGame(); kick();
}
async function endTurn() {
  if (busy || !S || S.over) return;
  busy = true;
  sel = null; undoStack = [];
  refreshSel();
  for (let p = 1; p < S.players.length; p++) {
    if (!S.players[p].alive) continue;
    S.cur = p;
    renderHud(); renderPanel();
    startTurn(p);
    try { await aiTurn(p); } catch (err) { console.error(err); }
    checkElims();
    kick();
    if (S.over) break;
  }
  if (!S.over) {
    S.turn++;
    S.cur = 0;
    startTurn(0);
    revealed = 0;
    vision();
    toast('Turn ' + S.turn);
  }
  busy = false;
  afterAction();
}

function unitPanel(u, info, acts) {

    <div class="tribes">${TRIBES.map((T, k) => `<button class="tribe${newOpts.tribe === k ? ' on' : ''}" style="--c:${T.color}" data-tribe="${k}"><b><i></i>${T.name}</b><span>${T.blurb}</span></button>`).join('')}</div>
    <h4>Rivals</h4>${seg('opponents', [[1, '1'], [2, '2'], [3, '3']])}
    <h4>Map size</h4>${seg('size', [['small', 'Small'], ['medium', 'Medium'], ['large', 'Large']])}
    <p class="muted" style="font-size:13px">${{ small: 'Quick: about 15 minutes.', medium: 'About 30 minutes.', large: 'A long campaign: 45 minutes or more.' }[newOpts.size]}</p>
    <h4>Difficulty</h4>${seg('diff', [['easy', 'Easy'], ['normal', 'Normal'], ['hard', 'Hard']])}
    <div class="row" style="margin-top:18px"><button class="big primary" id="startGame">Start</button></div>`);
  $('#sheet').querySelectorAll('[data-tribe]').forEach(b => b.addEventListener('click', () => { newOpts.tribe = +b.dataset.tribe; openNewGame(); }));
  $('#sheet').querySelectorAll('[data-seg] button').forEach(b => b.addEventListener('click', () => {
    const k = b.parentNode.dataset.seg;
    newOpts[k] = k === 'opponents' ? +b.dataset.v : b.dataset.v;
    openNewGame();
  }));
  $('#startGame').addEventListener('click', () => {
    if (S && !S.demo && !S.over && mode === 'game' && !confirm('Start a new game? The current one will be replaced.')) return;
    prefs.last = Object.assign({}, newOpts); savePrefs();
    closeSheet();
    startGame(newGame(newOpts));
  });
}

function startGame(state) {
  S = state;
  mode = 'game';
  busy = false; sel = null; undoStack = [];
  $('#title').hidden = true;
  const cap = S.cities.find(c => c.owner === 0 && c.capital) || S.cities.find(c => c.owner === 0);
  cam.z = clamp(Math.min(W, H) / (TW * 4.8), .9, 1.8);
  if (cap) centerOn(cap.x, cap.y);
  refreshSel(); renderHud(); renderPanel(); saveGame(); kick();
  if (S.turn === 1 && S.cur === 0 && !S.pendingRewards.length && !S.over) toast(`You lead the ${TRIBES[S.players[0].tribe].name}. Explore, expand, conquer.`);
  if (S.pendingRewards.length) showReward();
}
const demoCam = { x: 0, y: 0 };
function toTitle() {
  mode = 'title';
  closeSheet();
  S = newGame({ tribe: rnd(4), opponents: 3, size: 'medium', diff: 'normal' });
  S.demo = true;
  S.explored.fill(1);
  for (const c of S.cities) if (c.owner < 0 && Math.random() < .5) { c.owner = rnd(4); c.level = 1 + rnd(3); claim(c); }
  for (const c of S.cities) if (c.owner >= 0) c.level = Math.max(c.level, 1 + rnd(4));
  cam.z = clamp(Math.min(W, H) / (TW * 5.5), .8, 1.5);
  const [wx, wy] = iso(S.n / 2, S.n / 2);
  demoCam.x = wx; demoCam.y = wy + H * .18 / cam.z;     // sit the land above the menu
  $('#title').hidden = false;
  renderHud(); renderPanel();
  const saved = loadSave();
  const m = $('#tmenu');
  m.innerHTML = (saved && !saved.over ? `<button class="big primary" id="tContinue">Continue · ${TRIBES[saved.players[0].tribe].name}, turn ${saved.turn}</button>` : '') +
    `<button class="big ${saved && !saved.over ? '' : 'primary'}" id="tNew">New game</button><button class="big" id="tHelp">How to play</button>`;
  $('#tver').textContent = 'Tribelands ' + VERSION;
  if ($('#tContinue')) $('#tContinue').addEventListener('click', () => startGame(saved));
  $('#tNew').addEventListener('click', openNewGame);
  $('#tHelp').addEventListener('click', openHelp);
  kick();
}

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  clampCam(); kick();
}
addEventListener('resize', resize);
resize();
toTitle();

// test hook: lets the browser tests drive the game without pixel-hunting
window.Tribelands = {
  get S() { return S; }, set S(v) { S = v; }, VERSION, tapTile, endTurn, act, select, undo, startGame, newGame,
  get busy() { return busy; }, get undoDepth() { return undoStack.length; }, moveInfo, targets, aiTurn,
};

</script>
<script>
  if (navigator.serviceWorker && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
</body>
