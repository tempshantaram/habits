<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16202E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="A turn-based strategy game: explore, grow cities, research and conquer. Runs offline on this device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tribelands</title>
<style>
:root{
  --sea:#16202E;
  --panel:rgba(252,251,248,.97);
  --ink:#1D2330;
  --muted:#5D6778;
  --faint:#8A93A3;
  --line:#E2E5EA;
  --btn:#EEF0F4;
  --btn-ink:#1D2330;
  --accent:#2F6FDE;
  --good:#2E9E5B;
  --bad:#D6453D;
  --star:#E9A816;
  --shadow:0 6px 24px rgba(10,16,28,.28);
  --radius:16px;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:rgba(27,33,45,.97);
    --ink:#EEF1F6;
    --muted:#A3ACBB;
    --faint:#7B8597;
    --line:#333D50;
    --btn:#2A3345;
    --btn-ink:#EEF1F6;
    --accent:#6A9CF5;
    --shadow:0 6px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --panel:rgba(27,33,45,.97); --ink:#EEF1F6; --muted:#A3ACBB; --faint:#7B8597;
  --line:#333D50; --btn:#2A3345; --btn-ink:#EEF1F6; --accent:#6A9CF5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea);
  font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  overscroll-behavior:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}

/* ---- HUD ---- */
#hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none}
#hud > *{pointer-events:auto}
.chip{background:var(--panel);box-shadow:var(--shadow);border-radius:999px;height:40px;
  display:flex;align-items:center;gap:6px;padding:0 14px;font-weight:650;white-space:nowrap}
.chip small{font-weight:600;color:var(--good);font-size:13px}
.chip .dot{width:14px;height:14px;border-radius:4px;transform:rotate(45deg);flex:none}
.chip .star{color:var(--star)}
.grow{flex:1}
.chip.btn{padding:0 12px}
.chip.icon{width:40px;justify-content:center;padding:0;font-size:18px}

/* ---- bottom panel ---- */
#panel{position:fixed;left:0;right:0;bottom:0;background:var(--panel);box-shadow:var(--shadow);
  border-radius:var(--radius) var(--radius) 0 0;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 12px);
  max-height:46vh;overflow:auto}
@media (min-width:760px){
  #panel{left:50%;transform:translateX(-50%);width:720px;bottom:12px;border-radius:var(--radius)}
}
.prow{display:flex;gap:10px;align-items:center}
#pinfo{flex:1;min-width:0}
#pinfo h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#pinfo p{margin:2px 0 0;color:var(--muted);font-size:13px}
.pbtns{display:flex;gap:8px;flex:none}
.pbtns button{height:44px;border-radius:12px;padding:0 14px;background:var(--btn);color:var(--btn-ink);font-weight:650}
.pbtns button.primary{background:var(--accent);color:#fff}
.pbtns button:disabled{opacity:.4}
.tag{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:6px;color:#fff}
.hpbar{display:inline-block;width:64px;height:7px;border-radius:4px;background:var(--line);overflow:hidden;vertical-align:middle}
.hpbar i{display:block;height:100%;background:var(--good)}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.pips i.on{background:var(--good);border-color:var(--good)}
#pacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
#pacts:empty{display:none}
@media (max-width:360px){ #pacts{grid-template-columns:1fr} }
.pacts1{display:grid;margin-top:8px}
.act{min-height:58px;border-radius:12px;background:var(--btn);color:var(--btn-ink);border:1.5px solid transparent;
  display:flex;align-items:flex-start;gap:9px;padding:9px 10px;text-align:left;width:100%}
.act > i{font-style:normal;font-size:20px;line-height:24px;flex:none;width:24px;text-align:center}
.act .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.act b{font-size:14px;line-height:1.2}
.act small{font-size:12px;line-height:1.3;color:var(--muted)}
.act em{font-style:normal;font-size:12px;line-height:1.3;color:var(--bad);font-weight:600}
.act .c{flex:none;font-size:13px;font-weight:750;background:var(--panel);border-radius:8px;padding:3px 7px;color:var(--ink);white-space:nowrap}
.act:disabled{cursor:default}
.act:disabled > i{filter:grayscale(1);opacity:.55}
.act:disabled b{color:var(--muted)}
.act:disabled .c{opacity:.5}
.act.go{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--btn))}
.act:not(:disabled):active{transform:scale(.98)}
.sec{grid-column:1 / -1;font-size:11.5px;font-weight:750;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:4px}
.skills{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px}
.skill{font-size:12px;background:var(--btn);border-radius:8px;padding:4px 8px;color:var(--muted)}
.skill b{color:var(--ink)}
.stat{font-size:12.5px;margin-left:8px;white-space:nowrap;color:var(--ink)}
.status{font-weight:650;color:var(--good)!important}
.status.done{color:var(--faint)!important}
.vet{color:var(--star);font-size:13px}
.hint{grid-column:1 / -1;font-size:12.5px;line-height:1.45;color:var(--muted);margin-top:2px}

/* ---- toast ---- */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 60px);transform:translateX(-50%);
  background:rgba(20,26,38,.92);color:#fff;padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;
  opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1}

/* ---- modal sheets ---- */
.modal{position:fixed;inset:0;background:rgba(8,12,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
@media (min-width:760px){ .modal{align-items:center} }
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);box-shadow:var(--shadow)}
@media (min-width:760px){ .sheet{border-radius:20px} }
.sheet h2{margin:0 0 4px;font-size:21px}
.sheet h4{margin:16px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sheet p{margin:6px 0}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.big{height:50px;border-radius:14px;background:var(--btn);color:var(--btn-ink);font-weight:700;padding:0 18px;flex:1;min-width:120px}
.big.primary{background:var(--accent);color:#fff}
.big.danger{color:var(--bad)}
.seg{display:flex;background:var(--btn);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:40px;border-radius:9px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.tribes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tribe{border-radius:14px;padding:10px 12px;background:var(--btn);text-align:left;border:2px solid transparent;display:block}
.tribe.on{border-color:var(--c)}
.tribe b{display:flex;align-items:center;gap:8px;font-size:15px}
.tribe b i{width:14px;height:14px;border-radius:4px;background:var(--c);transform:rotate(45deg)}
.tribe span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.close{float:right;width:36px;height:36px;border-radius:50%;background:var(--btn);font-size:18px}

/* tech tree */
.branch{display:grid;grid-template-columns:1fr 14px 1fr 14px 1fr;align-items:center;gap:6px 0;margin-bottom:12px}
.branch .root{grid-column:1;align-self:center}
.branch .col{display:flex;flex-direction:column;gap:6px}
.branch .arr{grid-column:2;color:var(--faint);text-align:center;font-size:13px}
.tn{border-radius:12px;padding:8px 8px;background:var(--btn);min-height:48px;text-align:left;border:2px solid transparent;width:100%}
.tn b{display:block;font-size:13px}
.tn span{display:block;font-size:11.5px;color:var(--muted)}
.tn.done{background:var(--c);color:#fff}
.tn.done span{color:rgba(255,255,255,.85)}
.tn.can{border-color:var(--good)}
.tn.locked{opacity:.5}
.tn.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.unlocks{margin:0 0 10px;padding-left:0;list-style:none}
.unlocks li{padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.tdetail{border-top:1px solid var(--line);padding-top:12px;margin-top:6px;min-height:96px}

/* reward */
.reward{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:14px;background:var(--btn);text-align:left;flex:1;min-width:140px}
.reward i{font-style:normal;font-size:26px}
.reward b{font-size:16px}
.reward span{font-size:13px;color:var(--muted)}

/* title */
.title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:24px 16px calc(env(safe-area-inset-bottom,0px) + 28px);
  background:linear-gradient(180deg,rgba(14,20,32,0) 30%,rgba(14,20,32,.8) 75%)}
.logo{font-size:44px;font-weight:800;letter-spacing:-.03em;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.5);margin:0}
.tagline{color:rgba(255,255,255,.8);margin:4px 0 22px;text-align:center}
.tmenu{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px}
.tmenu .big{flex:none}
.ver{color:rgba(255,255,255,.45);font-size:12px;margin-top:14px}
.help li{margin:6px 0}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:10px 0}

.tribe .trait{color:var(--ink);margin-top:6px}
.tcard{border-left:4px solid var(--c);background:var(--btn);border-radius:12px;padding:10px 12px;margin-top:10px;display:flex;flex-direction:column;gap:4px}
.tcard > b{display:flex;align-items:center;gap:8px;font-size:15px}
.tcard > b i{width:12px;height:12px;border-radius:3px;background:var(--c);transform:rotate(45deg)}
.tcard > b small{margin-left:auto;font-weight:600;color:var(--muted);font-size:12.5px}
.tcard > span{font-size:13px;color:var(--muted)}
.tcard .act{background:var(--panel)}
.ledger{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin:12px 0}
.ledger span{display:flex;flex-direction:column}
.ledger small{color:var(--muted);font-size:12px}
.ledger b{color:var(--good);align-self:center}
.chron{list-style:none;padding:0;margin:0}
.chron li{font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.chron small{color:var(--muted);margin-right:6px}
button.chip{cursor:pointer}
.banner{grid-column:1 / -1;font-size:13px;line-height:1.4;background:color-mix(in srgb,var(--star) 16%,var(--btn));border-radius:10px;padding:8px 10px}
.act.wide{grid-column:1 / -1}
</style>
</head>
<body>
<canvas id="cv" aria-label="Game map"></canvas>

<div id="hud" hidden>
  <button class="chip" id="btnStars" aria-label="Stars and income"><i class="dot" id="hudDot"></i><span><span class="star">★</span> <span id="hudStars">0</span></span><small id="hudInc">+0</small></button>
  <div class="grow"></div>
  <button class="chip btn" id="btnTribes">👥 Tribes</button>
  <button class="chip btn" id="btnTech">🔬 Tech</button>
  <button class="chip icon" id="btnMenu" aria-label="Menu">☰</button>
</div>

<div id="panel" hidden>
  <div class="prow">
    <div id="pinfo"></div>
    <div class="pbtns">
      <button id="btnUndo" title="Undo last action">Undo</button>
      <button id="btnEnd" class="primary">End turn</button>
    </div>
  </div>
  <div id="pacts"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="title" class="title">
  <h1 class="logo">Tribelands</h1>
  <p class="tagline">Explore, expand, research, conquer. One tribe will rule the land.</p>
  <div class="tmenu" id="tmenu"></div>
  <div class="ver" id="tver"></div>
</div>

<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<script>
'use strict';
/* Tribelands — rules, map generation and the computer tribes.
   Everything the game knows lives in S, a plain object that goes straight to
   JSON: that is the autosave, and a copy of it is what Undo steps back to.   */

const VERSION = 'v23';
const SAVE_KEY = 'tribelands-save-v1';
const PREF_KEY = 'tribelands-prefs-v1';

const FIELD = 0, FOREST = 1, MOUNTAIN = 2, SHALLOW = 3, OCEAN = 4;
const TERRAIN_NAME = ['Field', 'Forest', 'Mountain', 'Shallow water', 'Ocean'];
const isWater = t => t === SHALLOW || t === OCEAN;

const TRIBES = [
  { name: 'Aurel', color: '#E7B23A', skin: '#F2D0AE', tech: 'organization', start: 'warrior', hat: 'plume',
    blurb: 'Orchard folk of the golden meadows. Start with Organization.',
    trait: { name: 'Orchard keepers', icon: '🍎', desc: 'Gathering fruit costs 1 ★ instead of 2.' },
    land: { forest: .24, mountain: .14 }, res: { fruit: .34, crop: .22, animal: .38, ore: .35 },
    pal: { field: '#A9C95B', forest: '#5C9B3F', mountain: '#A4A79F', tree: 'round', snow: true },
    syl: ['au', 'rel', 'lo', 'ria', 'ven', 'ta', 'mer', 'ol', 'ca', 'sa', 'tri', 'no', 'ae', 'lis'] },
  { name: 'Kiro', color: '#D9473A', skin: '#EBC39B', tech: 'climbing', start: 'warrior', hat: 'cone',
    blurb: 'Highland builders among the peaks. Start with Climbing.',
    trait: { name: 'Mountain born', icon: '⛰️', desc: 'Mountains never stop your units’ movement.' },
    land: { forest: .2, mountain: .36 }, res: { fruit: .28, crop: .18, animal: .32, ore: .6 },
    pal: { field: '#8FC580', forest: '#3F8F6C', mountain: '#BBA99F', tree: 'bamboo', snow: true },
    syl: ['ki', 'ro', 'shi', 'ta', 'ka', 'mo', 'ren', 'yu', 'ha', 'zen', 'to', 'mi', 'sa', 'no'] },
  { name: 'Thane', color: '#3C7ED3', skin: '#F6DCC8', tech: 'hunting', start: 'warrior', hat: 'horns',
    blurb: 'Hunters of the deep pine forests. Start with Hunting.',
    trait: { name: 'Forest stalkers', icon: '🌲', desc: 'Forests never stop your units, and your units always defend +50% in them.' },
    land: { forest: .48, mountain: .15 }, res: { fruit: .22, crop: .15, animal: .52, ore: .35 },
    pal: { field: '#80B06B', forest: '#2F6D4C', mountain: '#8F98A9', tree: 'pine', snow: true },
    syl: ['thor', 'ga', 'hel', 'vik', 'run', 'sten', 'ul', 'fa', 'bjor', 'nar', 'dal', 'ey', 'grim', 'ska'] },
  { name: 'Sandari', color: '#9A5ACF', skin: '#C8915E', tech: 'riding', start: 'rider', hat: 'wrap',
    blurb: 'Riders of the open savanna. Start with Riding and a Rider.',
    trait: { name: 'Horse lords', icon: '🐎', desc: 'Riders and Knights move one tile further.' },
    land: { forest: .14, mountain: .13 }, res: { fruit: .3, crop: .3, animal: .38, ore: .3 },
    pal: { field: '#D5BF77', forest: '#8BA54C', mountain: '#BD9E75', tree: 'acacia', snow: false },
    syl: ['sa', 'han', 'ka', 'du', 'ri', 'ma', 'zi', 'ba', 'nu', 'ta', 'ol', 'ke', 'mar', 'ish'] },
];

// `unlocks` is what the tech screen lists, one line each, icon first.
const TECHS = {
  riding:       { name: 'Riding',       tier: 1, parent: null,           unlocks: ['🐎 Rider unit: moves 2, can move again after attacking'] },
  shields:      { name: 'Shields',      tier: 2, parent: 'riding',       unlocks: ['🛡️ Defender unit: 15 HP, defence 3', '🏯 Great Wall wonder'] },
  chivalry:     { name: 'Chivalry',     tier: 3, parent: 'shields',      unlocks: ['🏇 Knight unit: moves 3, attacks again after each kill'] },
  roads:        { name: 'Roads',        tier: 2, parent: 'riding',       unlocks: ['🛤️ Build roads in your land: moving road to road costs half', 'Cities count as road ends'] },
  organization: { name: 'Organization', tier: 1, parent: null,           unlocks: ['🍎 Gather fruit: +1 population'] },
  farming:      { name: 'Farming',      tier: 2, parent: 'organization', unlocks: ['🌾 Farms on crops: +2 population'] },
  mathematics:  { name: 'Mathematics',  tier: 3, parent: 'farming',      unlocks: ['🎯 Catapult unit: attack 4 from 3 tiles, but fragile'] },
  trade:        { name: 'Trade',        tier: 3, parent: 'farming',      unlocks: ['🏪 Markets: +1 ★ every turn for each farm, mine, lumber hut or port beside them', '🕌 Grand Bazaar wonder'] },
  diplomacy:    { name: 'Diplomacy',    tier: 2, parent: 'organization', unlocks: ['🕊️ Offer truces to rival tribes', '📜 Envoy unit: converts an enemy unit to your side'] },
  climbing:     { name: 'Climbing',     tier: 1, parent: null,           unlocks: ['⛰️ Move onto mountains', 'Units on mountains defend +50%'] },
  mining:       { name: 'Mining',       tier: 2, parent: 'climbing',     unlocks: ['⛏️ Mines on ore: +2 population'] },
  smithery:     { name: 'Smithery',     tier: 3, parent: 'mining',       unlocks: ['⚔️ Swordsman unit: attack 3, defence 3, 15 HP', '🏛️ Hall of Heroes wonder'] },
  hunting:      { name: 'Hunting',      tier: 1, parent: null,           unlocks: ['🦌 Hunt wild animals: +1 population'] },
  archery:      { name: 'Archery',      tier: 2, parent: 'hunting',      unlocks: ['🏹 Archer unit: shoots 2 tiles', 'Units in forests defend +50%'] },
  falconry:     { name: 'Falconry',     tier: 3, parent: 'archery',      unlocks: ['🦅 Eagle Rider: flies over water, mountains and enemy lines'] },
  forestry:     { name: 'Forestry',     tier: 2, parent: 'hunting',      unlocks: ['🪵 Lumber huts: +1 population', '🪓 Clear forest for +1 ★'] },
  herbalism:    { name: 'Herbalism',    tier: 3, parent: 'forestry',     unlocks: ['🌿 Shaman unit: heals every friendly unit around it', '🌳 Tree of Life wonder'] },
  fishing:      { name: 'Fishing',      tier: 1, parent: null,           unlocks: ['🐟 Catch fish: +1 population', '⚓ Ports: units that walk in become boats'] },
  sailing:      { name: 'Sailing',      tier: 2, parent: 'fishing',      unlocks: ['⛵ Boats can cross deep ocean', '🔭 Sky Observatory wonder'] },
  navigation:   { name: 'Navigation',   tier: 3, parent: 'sailing',      unlocks: ['🚢 Boats become Warships: attack 3, move 3'] },
};
const TECH_ROOTS = ['riding', 'organization', 'climbing', 'hunting', 'fishing'];

const UNITS = {
  warrior:   { name: 'Warrior',     icon: '🗡️', cost: 2, hp: 10, atk: 2,   def: 2, mv: 1, rng: 1, tech: null,          dash: 1 },
  rider:     { name: 'Rider',       icon: '🐎', cost: 3, hp: 10, atk: 2,   def: 1, mv: 2, rng: 1, tech: 'riding',      dash: 1, escape: 1 },
  archer:    { name: 'Archer',      icon: '🏹', cost: 3, hp: 10, atk: 2,   def: 1, mv: 1, rng: 2, tech: 'archery',     dash: 1 },
  defender:  { name: 'Defender',    icon: '🛡️', cost: 3, hp: 15, atk: 1,   def: 3, mv: 1, rng: 1, tech: 'shields' },
  shaman:    { name: 'Shaman',      icon: '🌿', cost: 4, hp: 10, atk: 1,   def: 1, mv: 1, rng: 1, tech: 'herbalism',   heal: 1 },
  envoy:     { name: 'Envoy',       icon: '📜', cost: 5, hp: 10, atk: 0,   def: 1, mv: 1, rng: 1, tech: 'diplomacy',   convert: 1 },
  swordsman: { name: 'Swordsman',   icon: '⚔️', cost: 5, hp: 15, atk: 3,   def: 3, mv: 1, rng: 1, tech: 'smithery',    dash: 1 },
  eagle:     { name: 'Eagle Rider', icon: '🦅', cost: 7, hp: 10, atk: 2,   def: 1, mv: 3, rng: 1, tech: 'falconry',    dash: 1, fly: 1 },
  catapult:  { name: 'Catapult',    icon: '🎯', cost: 8, hp: 10, atk: 4,   def: 0, mv: 1, rng: 3, tech: 'mathematics' },
  knight:    { name: 'Knight',      icon: '🏇', cost: 8, hp: 10, atk: 3.5, def: 1, mv: 3, rng: 1, tech: 'chivalry',    dash: 1, persist: 1 },

// ---------- small helpers ----------

// ---------- peace ----------
const peaceKey = (a, b) => Math.min(a, b) + '-' + Math.max(a, b);

// ---------- economy ----------

// Every source of stars, so the HUD can explain the total.

    const why = ['level ' + c.level, c.capital && 'capital +1', c.workshop && 'workshop +1', c.parks && 'park +' + c.parks].filter(Boolean).join(', ');

// ---------- vision (only the human player has fog) ----------
let revealed = 0;                    // tiles newly revealed since the last reset — an undo barrier
function reveal(x, y, r) {

    const nx = x + dx, ny = y + dy;

    const i = I(nx, ny);

const seen = i => S.explored[i] === 1;

// ---------- map generation ----------
function cityName(tribe) {
  const syl = TRIBES[tribe].syl;
  for (let k = 0; k < 40; k++) {
    let s = pick(syl) + pick(syl);
    if (Math.random() < .3) s += pick(syl);
    s = s[0].toUpperCase() + s.slice(1);
    if (s.length <= 10 && !S.cities.some(c => c.name === s)) return s;
  }
  return 'Town ' + (S.cities.length + 1);
}

function newGame(opts) {
  const n = { small: 11, medium: 14, large: 18 }[opts.size] || 14;
  const tribes = [opts.tribe, ...shuffle([0, 1, 2, 3].filter(t => t !== opts.tribe)).slice(0, opts.opponents)];
  S = {
    v: 2, n, turn: 1, cur: 0, diff: opts.diff, size: opts.size, over: null, nextId: 1,
    players: tribes.map((t, i) => ({ id: i, tribe: t, human: i === 0, stars: 5 + (i && opts.diff === 'hard' ? 3 : 0),
      techs: { [TRIBES[t].tech]: true }, alive: true, kills: 0, lost: 0, converts: 0, asked: {} })),
    tiles: [], cities: [], units: [], explored: new Array(n * n).fill(0), pendingRewards: [],
    wonders: {}, truce: {}, nextEvent: 5 + rnd(3), event: null, offer: null, log: [],

  genMap(tribes);

// Saves from before roads, wonders and truces existed still open.
function migrate(s) {
  if (s.v === 1) {
    for (const t of s.tiles) t.road = t.road || false;
    for (const P of s.players) { P.converts = 0; P.asked = {}; }
    Object.assign(s, { v: 2, wonders: {}, truce: {}, nextEvent: s.turn + 3, event: null, offer: null, log: [] });
  }
  return s;
}

function placeCapitals(n, k) {
  const m = n <= 11 ? 2 : 3;
  const spots = shuffle([[m, m], [n - 1 - m, n - 1 - m], [n - 1 - m, m], [m, n - 1 - m]]);
  if (k === 2) {                                 // two players sit on opposite corners
    const a = spots[0];
    const b = spots.find(s => s[0] !== a[0] && s[1] !== a[1]);
    spots.splice(0, 4, a, b);
  }
  return spots.slice(0, k).map(([x, y]) => [clamp(x + rnd(3) - 1, 1, n - 2), clamp(y + rnd(3) - 1, 1, n - 2)]);

function genMap(tribes) {
  const n = S.n, N = n * n;
  const caps = placeCapitals(n, tribes.length);
  const G = 3, gw = Math.ceil(n / G) + 2, g = Array.from({ length: gw * gw }, () => Math.random());
  const sm = t => t * t * (3 - 2 * t);

    const fx = x / G, fy = y / G, x0 = Math.floor(fx), y0 = Math.floor(fy), u = sm(fx - x0), v = sm(fy - y0);
    const a = g[y0 * gw + x0], b = g[y0 * gw + x0 + 1], c = g[(y0 + 1) * gw + x0], d = g[(y0 + 1) * gw + x0 + 1];

    const x = cx + dx, y = cy + dy;

}
function placeVillage(i) {

function aiWonder(p) {

function aiPickUnit(p, threat) {

    swordsman: 6, eagle: 4, catapult: threat ? 3 : 1, knight: 6 };

async function aiAttack(u) {
  for (let guard = 0; guard < 4; guard++) {
    if (!S.units.includes(u)) return;
    let best = null, bs = 0;
    const conv = !u.boat && UNITS[u.type].convert;
    for (const e of targets(u)) {
      let s;
      if (conv) s = UNITS[e.type].cost + e.hp / 3;
      else {
        const r = combat(u, e);
        s = r.dmg + (r.killed ? 5 + UNITS[e.type].cost : 0) - r.ret * 1.1 - (r.ret >= u.hp ? 40 : 0);
        const c = cityAtI(I(e.x, e.y));

        else if (c && r.ret < u.hp) {

          const friends = S.units.filter(v => v.owner === u.owner && v !== u && cheb(v.x, v.y, e.x, e.y) <= 1).length;
          s += S.diff === 'easy' ? 1 + friends * 1.5 : 2 + friends * 2.5;
        }
      }
      if (s > bs) { bs = s; best = e; }
    }

}
async function aiUnit(u, claimed) {
  if (!S.units.includes(u) || S.over) return;
  const p = u.owner;
  if (canCapture(u)) { doCapture(u); await FX.pause(u); return; }
  if (canRuin(u)) { doRuin(u); return; }
  if (exhausted(u)) return;
  if (canHeal(u)) { doHeal(u); return; }
  if (u.hp < maxHp(u) * .45 && canRecover(u) && !enemyNear(u.x, u.y, p)) { doRecover(u); return; }
  await aiAttack(u);
  if (!S.units.includes(u) || u.moved || u.boat) return;
  const here = I(u.x, u.y), hc = cityAtI(here);
  if (hc && hc.owner !== p && !atPeace(p, hc.owner)) return;       // hold it and capture next turn
  if (hc && hc.owner === p && enemyNear(u.x, u.y, p, 2)) return;   // garrison
  const goals = [];
  const healer = UNITS[u.type].heal;
  if (healer) {
    for (const v of S.units) if (v.owner === p && v !== u && v.hp < maxHp(v)) goals.push(I(v.x, v.y));
  } else {
    for (const c of S.cities) {
      const gi = I(c.x, c.y);
      if (claimed.has(gi) || atPeace(p, c.owner)) continue;
      if (c.owner !== p) goals.push(gi);
      else if (!unitAt(c.x, c.y) && enemyNear(c.x, c.y, p, 3)) goals.push(gi);
    }
    for (let i = 0; i < S.tiles.length; i++) if (S.tiles[i].ruin && !claimed.has(i) && !isWater(S.tiles[i].t)) goals.push(i);
    for (const e of S.units) if (hostile(p, e.owner)) goals.push(I(e.x, e.y));
  }
  const { dist, src } = goalField(p, goals, flies(u));
  const { dests, prev } = moveInfo(u);
  let best = here, bd = dist[here];
  for (const d of dests) {
    let v = dist[d];
    const t = S.tiles[d];
    if (!flies(u) && isWater(t.t)) continue;
    if ((t.t === FOREST && defBonus({ ...u, x: XY(d)[0], y: XY(d)[1] }) > 1) || (t.t === MOUNTAIN && has(p, 'climbing'))) v -= .2;
    if (S.diff === 'easy') v += Math.random() * 1.5;
    if (v < bd) { bd = v; best = d; }
  }
  if (best !== here) {
    if (src[best] >= 0 && dist[best] <= 4) claimed.add(src[best]);
    await doMove(u, best, prev);
    await FX.pause(u);
    const bc = cityAtI(best);
    if (bc && bc.owner !== p) claimed.add(best);
    if (canHeal(u)) { doHeal(u); return; }
    await aiAttack(u);
  } else if (canRecover(u)) doRecover(u);
}
function aiDiplomacy(p) {
  // a tribe that is losing badly may ask the player for peace
  if (S.offer || !S.players[0].alive || atPeace(p, 0) || S.turn < 6) return;
  const theirs = citiesOf(p), near = theirs.some(c => S.units.some(e => e.owner === 0 && cheb(c.x, c.y, e.x, e.y) <= 3));
  if (near && strength(p) < strength(0) * .6 && Math.random() < .25) {
    const gift = Math.min(S.players[p].stars, 2 + theirs.length * 2);
    S.offer = { from: p, gift, turns: 6 };
  }
}
async function aiTurn(p) {
  const P = S.players[p];
  const mine = citiesOf(p);
  const threat = mine.some(c => enemyNear(c.x, c.y, p, 3));
  const units = unitsOf(p).length;
  const desired = mine.reduce((s, c) => s + c.level, 0) + (threat ? 2 : 0) + (S.diff === 'hard' ? 1 : 0);
  if (units < Math.max(2, desired * (S.diff === 'easy' ? .6 : 1))) aiTrain(p, threat ? 3 : 1);
  aiResearch(p, S.diff === 'easy' ? 2 : 0);
  aiEconomy(p, threat ? 3 : 0);
  aiWonder(p);
  const claimed = new Set();
  const list = unitsOf(p).sort((a, b) => (canCapture(b) ? 1 : 0) - (canCapture(a) ? 1 : 0));
  for (const u of list) {
    await aiUnit(u, claimed);
    if (S.over) return;
  }
  if (P.stars >= 6) aiTrain(p, 2);
  aiDiplomacy(p);
}

// ---------- colour ----------
const _shade = new Map();
function shade(hex, amt) {

  else [r, g, b] = hex.match(/\d+/g).map(Number);         // an rgb() this function made earlier
  const f = c => amt < 0 ? c * (1 + amt) : c + (255 - c) * amt;
  v = `rgb(${f(r) | 0},${f(g) | 0},${f(b) | 0})`;
  _shade.set(key, v);
  return v;
}
const colOf = p => TRIBES[S.players[p].tribe].color;

// ---------- geometry ----------
const iso = (x, y) => [(x - y) * TW / 2, (x + y) * TH / 2];
function screenToTile(sx, sy) {

}
const toScreen = (wx, wy) => [(wx - cam.x) * cam.z + W / 2, (wy - cam.y) * cam.z + H / 2];
function clampCam() {

}
function centerOn(x, y) { const [wx, wy] = iso(x, y); cam.x = wx; cam.y = wy + 30 / cam.z; clampCam(); }

// ---------- drawing primitives ----------
function poly(pts, fill) {

  for (let k = 2; k < pts.length; k += 2) ctx.lineTo(pts[k], pts[k + 1]);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function dpath(cx, cy, w = TW / 2, h = TH / 2) {

function tri2(xl, xr, yb, xa, ya, col) {

}
function tile3(cx, cy, top, side) {

// ---------- terrain ----------
function drawGround(x, y) {
  const i = I(x, y), t = S.tiles[i];

  if (isWater(t.t)) {
    const c = t.t === SHALLOW ? '#5AB4D6' : '#2D6DAE';
    tile3(cx, cy + WD, shade(c, (hash(x, y, 3) - .5) * .05), 0);
    if (hash(x, y, 4) < .55) {
      ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1.2;
      const ox = (hash(x, y, 5) - .5) * 26, oy = (hash(x, y, 6) - .5) * 10 + WD;
      ctx.beginPath(); ctx.moveTo(cx + ox - 6, cy + oy); ctx.quadraticCurveTo(cx + ox - 3, cy + oy - 2.5, cx + ox, cy + oy);
      ctx.quadraticCurveTo(cx + ox + 3, cy + oy + 2.5, cx + ox + 6, cy + oy); ctx.stroke();
    }

  }
  const pal = TRIBES[t.clim].pal;
  let top = t.t === FOREST ? shade(pal.field, -.1) : t.t === MOUNTAIN ? shade(pal.mountain, -.12) : pal.field;
  if (t.cityHere >= 0) top = S.cities[t.cityHere].owner >= 0 ? '#D9CEBB' : '#C9B387';
  top = shade(top, (hash(x, y, 1) - .5) * .08);
  tile3(cx, cy, top, LH);
  if (t.imp === 'farm') {
    ctx.save(); dpath(cx, cy, TW / 2 - 6, TH / 2 - 3); ctx.clip();
    for (let k = -4; k <= 4; k++) {
      poly([cx + k * 7 - 3, cy - 20 + 0, cx + k * 7 + 3, cy - 20, cx + k * 7 + 3 - 20, cy + 20, cx + k * 7 - 3 - 20, cy + 20],
        k % 2 ? '#E8C95A' : '#C9B04A');

function drawRoads() {
  const n = S.n;
  ctx.lineCap = 'round';
  for (let pass = 0; pass < 2; pass++) {
    ctx.strokeStyle = pass ? '#D8B77E' : '#8C6B42';
    ctx.lineWidth = pass ? 3 : 5.5;
    for (let i = 0; i < n * n; i++) {
      const t = S.tiles[i];
      if (!t.road || !seen(i)) continue;
      const [x, y] = XY(i), [cx, cy] = iso(x, y);
      let any = false;
      ctx.beginPath();
      for (const [nx, ny] of nbrs(x, y)) {
        const j = I(nx, ny);
        if (!roadish(j) || !seen(j)) continue;
        const [ox, oy] = iso(nx, ny);
        ctx.moveTo(cx, cy); ctx.lineTo((cx + ox) / 2, (cy + oy) / 2); any = true;
      }

}
function drawBorders() {
  const n = S.n;
  for (let i = 0; i < n * n; i++) {
    if (!seen(i)) continue;
    const o = ownerOfI(i);
    if (o < 0) continue;
    const [x, y] = XY(i), t = S.tiles[i];
    let [cx, cy] = iso(x, y);
    if (isWater(t.t)) cy += WD;
    const col = colOf(o);
    ctx.globalAlpha = .17; dpath(cx, cy); ctx.fillStyle = col; ctx.fill(); ctx.globalAlpha = 1;
    const w = TW / 2, h = TH / 2, f = .88;
    const N = [cx, cy - h * f], E = [cx + w * f, cy], Sv = [cx, cy + h * f], Wv = [cx - w * f, cy];
    const edges = [[x, y - 1, N, E], [x + 1, y, E, Sv], [x, y + 1, Sv, Wv], [x - 1, y, Wv, N]];
    ctx.strokeStyle = col; ctx.lineWidth = 2.6; ctx.lineCap = 'round';

function drawTree(kind, x, y, col, s = 1) {

// ---------- animation hooks for the rules ----------
const SPEEDS = { normal: { step: 120, pause: 140 }, fast: { step: 55, pause: 50 }, instant: { step: 0, pause: 0 } };
const spd = () => SPEEDS[prefs.speed] || SPEEDS.normal;
const onScreen = (x, y) => S && !S.demo && seen(I(x, y));
FX.move = async (u, path) => {
  const human = isHuman(u.owner);
  const ms = human ? 90 : spd().step;
  if (!ms || (!human && !onScreen(u.x, u.y) && !path.some(i => seen(i)))) return;
  let [px, py] = iso(u.x, u.y);
  for (const i of path) {
    const [x, y] = XY(i), [nx, ny] = iso(x, y);
    await tween(ms, t => { u._wx = px + (nx - px) * t; u._wy = py + (ny - py) * t - Math.sin(t * Math.PI) * 5; });
    px = nx; py = ny;
  }
  delete u._wx; delete u._wy;
};
FX.attack = async (a, d) => {
  if (!onScreen(a.x, a.y) && !onScreen(d.x, d.y)) return;
  const ms = isHuman(a.owner) ? 160 : Math.max(spd().step * 1.5, 0);
  if (!ms) return;
  const [ax, ay] = iso(a.x, a.y), [dx, dy] = iso(d.x, d.y);
  if (st(a).rng > 1) {
    await tween(ms * 1.4, t => { drawShot = [ax + (dx - ax) * t, ay + (dy - ay) * t - Math.sin(t * Math.PI) * 30]; });
    drawShot = null;
  } else {
    await tween(ms, t => { const k = Math.sin(t * Math.PI) * .45; a._wx = ax + (dx - ax) * k; a._wy = ay + (dy - ay) * k; });
    delete a._wx; delete a._wy;
  }
};
FX.float = (x, y, text, color) => { if (onScreen(x, y)) { floats.push({ x, y, text, color, t0: performance.now(), ms: 1100 }); kick(); } };
FX.say = (msg, p, c) => { if (!S.demo && (isHuman(p) || !c || onScreen(c.x, c.y))) toast(msg); };
FX.pause = async u => { if (onScreen(u.x, u.y)) await sleep(spd().pause); };

// ---------- input ----------
const ptrs = new Map();
let drag = null, pinch = null;
cv.addEventListener('pointerdown', e => {
  try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false };
  else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: cam.z, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, cx: cam.x, cy: cam.y };
    if (drag) drag.moved = true;
  }
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId) || mode !== 'game') return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const z = clamp(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, ZMIN, ZMAX);
    const wx = (pinch.mx - W / 2) / pinch.z + pinch.cx, wy = (pinch.my - H / 2) / pinch.z + pinch.cy;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    cam.z = z; cam.x = wx - (mx - W / 2) / z; cam.y = wy - (my - H / 2) / z;
    clampCam(); kick();
  } else if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 9) drag.moved = true;
    if (drag.moved) { cam.x = drag.cx - dx / cam.z; cam.y = drag.cy - dy / cam.z; clampCam(); kick(); }
  }
});
function endPointer(e) {
  const tap = e.type === 'pointerup' && drag && !drag.moved && ptrs.size === 1;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 1) { const [r] = [...ptrs.values()]; drag = { x: r.x, y: r.y, cx: cam.x, cy: cam.y, moved: true }; }
  else if (!ptrs.size) drag = null;
  if (tap) onTap(e.clientX, e.clientY);
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('wheel', e => {
  if (mode !== 'game') return;
  e.preventDefault();
  const wx = (e.clientX - W / 2) / cam.z + cam.x, wy = (e.clientY - H / 2) / cam.z + cam.y;
  cam.z = clamp(cam.z * Math.exp(-e.deltaY * .0015), ZMIN, ZMAX);

}, { passive: false });
addEventListener('keydown', e => {

function onTap(sx, sy) {

}
function tapTile(x, y) {

// ---------- doing things ----------
// `o.undo` names the action ("move", "hunt"…) and makes it undoable.
async function act(fn, o = {}) {
  if (busy || !S || S.over) return;
  busy = true;
  const snap = JSON.stringify(S);
  revealed = 0;
  const hadRewards = S.pendingRewards.length;
  let msg;
  try { msg = await fn(); }
  catch (err) { console.error(err); }
  busy = false;
  disbandArm = null;
  if (o.undo && revealed === 0 && S.pendingRewards.length === hadRewards) {
    undoStack.push({ snap, label: o.undo });
    if (undoStack.length > 40) undoStack.shift();
  } else undoStack = [];
  if (typeof msg === 'string') toast(msg);
  afterAction();
}
function afterAction() {
  checkElims();
  saveGame();
  refreshSel();
  renderHud();
  renderPanel();
  kick();
  if (!$('#modal').hidden && $('#modal').dataset.closable === '') return;   // a choice is already open
  if (S.pendingRewards.length) showReward();
  else if (S.offer && S.offer.from != null && !S.over) showOffer();
  else if (S.event && S.event.turn === S.turn && !S.event.seen && !S.over) showEvent();
  else if (S.over && !S.overShown) showGameOver();
}
function undo() {
  if (busy || !undoStack.length) return;
  S = JSON.parse(undoStack.pop().snap);
  disbandArm = null;
  refreshSel(); renderHud(); renderPanel(); saveGame(); kick();
}
async function endTurn() {
  if (busy || !S || S.over) return;
  busy = true;
  sel = null; undoStack = []; disbandArm = null;
  refreshSel();
  for (let p = 1; p < S.players.length; p++) {
    if (!S.players[p].alive) continue;
    S.cur = p;
    renderHud(); renderPanel();
    startTurn(p);
    try { await aiTurn(p); } catch (err) { console.error(err); }
    checkElims();
    kick();
    if (S.over) break;
  }
  if (!S.over) {
    S.turn++;
    S.cur = 0;
    revealed = 0;
    beginRound();
    startTurn(0);
    vision();
    toast('Turn ' + S.turn);
  }
  busy = false;
  afterAction();
}

    add(actBtn({ a: 'train:' + k, icon: U.icon, title: U.name, effect: `⚔️${U.atk} 🛡️${U.def} 👣${U.mv}${U.rng > 1 ? ' 🎯' + U.rng : ''} · ${U.hp} HP${sk ? ' · ' + sk : ''}`,
      cost: U.cost, block: trainBlock(0, c, k), quiet: !!common }));
  }
  const locked = TRAINABLE.filter(k => UNITS[k].tech && !has(0, UNITS[k].tech)).length;
  if (locked) add(hint(`🔬 ${locked} more unit types unlock through Tech.`));
  const wk = Object.keys(WONDERS).filter(k => has(0, WONDERS[k].tech) || S.wonders[k] != null);
  if (wk.length) {
    add(sec('Wonders — one of each in the whole world'));
    const holds = Object.keys(S.wonders).find(k => S.wonders[k] === c.id);
    if (holds) add(`<div class="banner">${WONDERS[holds].icon} <b>${WONDERS[holds].name}</b> stands here: ${WONDERS[holds].desc} A city holds one wonder, so raise the others elsewhere.</div>`);
    for (const k of wk) {
      if (k === holds) continue;
      const Wd = WONDERS[k], elsewhere = S.wonders[k] != null;
      const who = elsewhere ? `${TRIBES[S.players[wonderOwner(k)].tribe].name} hold it in ${S.cities[S.wonders[k]].name}` : '';
      add(actBtn({ a: 'wonder:' + k, icon: Wd.icon, title: Wd.name, effect: Wd.desc + (elsewhere ? ` <b>${who}.</b>` : ''), cost: elsewhere ? null : Wd.cost,
        block: elsewhere ? 'Taken' : wonderBlock(0, c, k), quiet: elsewhere || !!holds, go: true, wide: true }));

}
function defNote(t) {
  if (t.t === FOREST) return has(0, 'archery') || tribeIs(0, 2) ? ' · Your units defend +50% here' : ' · Archery gives +50% defence here';
  if (t.t === MOUNTAIN) return has(0, 'climbing') ? ' · Your units defend +50% here' : ' · Needs Climbing to enter';

}
$('#pacts').addEventListener('click', e => {
  const b = e.target.closest('button[data-a]');
  if (!b || b.disabled || busy) return;
  const [a, k] = b.dataset.a.split(':');
  const u = sel && sel.kind === 'unit' ? unitById(sel.id) : null;
  const i = sel && sel.kind === 'tile' ? sel.i : u ? I(u.x, u.y) : -1;
  if (a !== 'disband') disbandArm = null;
  if (a === 'capture') act(() => doCapture(u));
  else if (a === 'ruin') act(() => doRuin(u));
  else if (a === 'heal') act(() => { const n = doHeal(u); return `The Shaman healed ${n} ${n === 1 ? 'unit' : 'units'}.`; }, { undo: 'heal' });
  else if (a === 'recover') act(() => doRecover(u), { undo: 'recover' });
  else if (a === 'disband') {
    if (disbandArm !== u.id) { disbandArm = u.id; renderPanel(); return; }
    act(() => { killUnit(u); S.players[0].lost--; }, { undo: 'disband' });
  }
  else if (a === 'city') select({ kind: 'tile', i });
  else if (a === 'unit') { const v = unitAt(...XY(i)); if (v) select({ kind: 'unit', id: v.id }); }
  else if (a === 'train') act(() => { doTrain(0, cityAtI(i), k); }, { undo: 'train' });
  else if (a === 'work') act(() => doWork(0, i, k), { undo: WORKS[k].name.toLowerCase().replace(/^build /, '') });
  else if (a === 'wonder') act(() => { doWonder(0, cityAtI(i), k); return WONDERS[k].name + ' built!'; });
});

$('#btnUndo').addEventListener('click', undo);

let toastT = 0;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg; el.classList.add('show');

}

}

$('#modal').addEventListener('click', e => {

let techSel = null;
function openTech() {
  if (busy) return;
  const P = S.players[0], col = TRIBES[P.tribe].color;
  const node = t => {
    const T = TECHS[t], done = has(0, t), avail = !T.parent || has(0, T.parent);
    const cls = done ? 'done' : avail ? (canResearch(0, t) ? 'can' : '') : 'locked';
    const sub = done ? '✓ Known' : avail ? techCost(0, t) + ' ★' : '🔒 ' + techCost(0, t) + ' ★';
    return `<button class="tn ${cls}${techSel === t ? ' sel' : ''}" style="--c:${col}" data-t="${t}"><b>${T.name}</b><span>${sub}</span></button>`;
  };
  let h = `<h2>Technology</h2><p class="muted">You have ${P.stars} ★. Tap a technology to see what it unlocks. Each city you own makes research dearer.</p>`;
  for (const r of TECH_ROOTS) {
    const t2 = Object.keys(TECHS).filter(k => TECHS[k].parent === r);
    h += `<div class="branch" style="grid-template-rows:repeat(${t2.length},auto)"><div class="root" style="grid-row:1 / span ${t2.length}">${node(r)}</div>`;
    t2.forEach((k, row) => {
      const t3 = Object.keys(TECHS).filter(j => TECHS[j].parent === k);
      h += `<div class="arr" style="grid-row:${row + 1}">›</div><div style="grid-row:${row + 1};grid-column:3">${node(k)}</div>
        <div class="arr" style="grid-row:${row + 1};grid-column:4">${t3.length ? '›' : ''}</div><div class="col" style="grid-row:${row + 1};grid-column:5">${t3.map(node).join('')}</div>`;
    });
    h += '</div>';
  }
  h += '<div class="tdetail" id="tdetail"></div>';
  openSheet(h);
  techDetail();
  $('#sheet').querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => { techSel = b.dataset.t; openTech(); $('#tdetail').scrollIntoView({ block: 'nearest' }); }));
}
function techDetail() {
  const el = $('#tdetail');
  if (!techSel) { el.innerHTML = '<p class="muted">Green-edged techs are ones you can afford now.</p>'; return; }
  const T = TECHS[techSel], done = has(0, techSel), cost = techCost(0, techSel);
  let h = `<h3 style="margin:0 0 6px">${T.name}</h3><ul class="unlocks">${T.unlocks.map(x => `<li>${x}</li>`).join('')}</ul>`;
  if (done) h += '<p><b>✓ Already known.</b></p>';
  else if (T.parent && !has(0, T.parent)) h += `<p class="muted">🔒 Research ${TECHS[T.parent].name} first.</p>`;
  else {
    const short = cost - S.players[0].stars;
    h += `<div class="row"><button class="big primary" id="doTech" ${short > 0 ? 'disabled' : ''}>${short > 0 ? `Need ${short} more ★ (costs ${cost})` : `Research for ${cost} ★`}</button></div>`;
  }
  el.innerHTML = h;
  const b = $('#doTech');
  if (b) b.addEventListener('click', () => {

}

function openTribes() {
  const me = S.players[0], T0 = TRIBES[me.tribe];
  let h = `<h2>Tribes</h2>
    <div class="tcard" style="--c:${T0.color}"><b><i></i>You: ${T0.name}</b><span>${T0.trait.icon} <b>${T0.trait.name}</b>: ${T0.trait.desc}</span></div>`;
  for (const P of S.players.slice(1)) {
    const T = TRIBES[P.tribe], q = P.id;
    const cities = citiesOf(q).length, units = unitsOf(q).length;
    const rel = !P.alive ? 'Fallen' : atPeace(0, q) ? `🕊️ Truce, ${peaceLeft(0, q)} more turns` : '⚔️ At war';
    const ratio = strength(q) / Math.max(1, strength(0));
    const power = ratio > 1.3 ? 'Stronger than you' : ratio < .75 ? 'Weaker than you' : 'About as strong as you';
    let btn = '';
    if (P.alive && !atPeace(0, q)) {
      const cost = truceCost(0, q), asked = me.asked[q] != null && S.turn - me.asked[q] < 3;
      const block = !has(0, 'diplomacy') ? 'Research Diplomacy to offer truces' : asked ? 'They refused recently; try again in a few turns'
        : me.stars < cost ? `Need ${cost - me.stars} more ★` : '';
      btn = actBtn({ a: 'truce:' + q, icon: '🕊️', title: 'Offer a truce', effect: 'Pay them for 8 turns of peace. Weaker tribes are more willing.', cost, block, go: true });

function showOffer() {

function startGame(state) {
  S = state;
  mode = 'game';
  busy = false; sel = null; undoStack = [];

  cam.z = clamp(Math.min(W, H) / (TW * 4.8), .9, 1.8);
  if (cap) centerOn(cap.x, cap.y);
  refreshSel(); renderHud(); renderPanel(); saveGame(); kick();
  if (S.turn === 1 && S.cur === 0 && !S.pendingRewards.length && !S.over) toast(`You lead the ${TRIBES[S.players[0].tribe].name}. Explore, expand, conquer.`);
  if (S.pendingRewards.length) showReward();
}
const demoCam = { x: 0, y: 0 };
function toTitle() {
  mode = 'title';
  closeSheet();
  S = newGame({ tribe: rnd(4), opponents: 3, size: 'medium', diff: 'normal' });
  S.demo = true;
  S.explored.fill(1);
  for (const c of S.cities) if (c.owner < 0 && Math.random() < .5) { c.owner = rnd(4); c.level = 1 + rnd(3); claim(c); }
  for (const c of S.cities) if (c.owner >= 0) c.level = Math.max(c.level, 1 + rnd(4));
  cam.z = clamp(Math.min(W, H) / (TW * 5.5), .8, 1.5);
  const [wx, wy] = iso(S.n / 2, S.n / 2);
  demoCam.x = wx; demoCam.y = wy + H * .18 / cam.z;     // sit the land above the menu
  $('#title').hidden = false;
  renderHud(); renderPanel();
  const saved = loadSave();
  const m = $('#tmenu');
  m.innerHTML = (saved && !saved.over ? `<button class="big primary" id="tContinue">Continue · ${TRIBES[saved.players[0].tribe].name}, turn ${saved.turn}</button>` : '') +
    `<button class="big ${saved && !saved.over ? '' : 'primary'}" id="tNew">New game</button><button class="big" id="tHelp">How to play</button>`;
  $('#tver').textContent = 'Tribelands ' + VERSION;
  if ($('#tContinue')) $('#tContinue').addEventListener('click', () => startGame(saved));
  $('#tNew').addEventListener('click', openNewGame);
  $('#tHelp').addEventListener('click', openHelp);
  kick();
}

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  clampCam(); kick();
}
addEventListener('resize', resize);
resize();
toTitle();

// test hook: lets the browser tests drive the game without pixel-hunting
window.Tribelands = {
  get S() { return S; }, set S(v) { S = v; }, VERSION, tapTile, endTurn, act, select, undo, startGame, newGame,
  get busy() { return busy; }, get undoDepth() { return undoStack.length; }, moveInfo, targets, aiTurn,
};
