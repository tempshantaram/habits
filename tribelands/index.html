<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16202E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="A turn-based strategy game: explore, grow cities, research and conquer. Runs offline on this device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tribelands</title>
<style>
:root{
  --sea:#0F2A3A;
  --panel:rgba(253,250,243,.98);
  --ink:#1F2328;
  --muted:#5B6470;
  --faint:#8A929E;
  --line:#E6E0D4;
  --btn:#F1ECE1;
  --btn-ink:#1F2328;
  --accent:#E0662F;
  --accent-ink:#fff;
  --sea-btn:#1F8C8A;
  --good:#2E9E5B;
  --bad:#D23F3A;
  --star:#E0A21A;
  --shadow:0 6px 24px rgba(8,20,28,.3);
  --radius:20px;
  --ph:120px;                      /* height of the bottom panel, set by the game */
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:rgba(26,32,38,.98); --ink:#F1EEE8; --muted:#AEB5BF; --faint:#7F8894;
    --line:#35404A; --btn:#2B343D; --btn-ink:#F1EEE8; --accent:#F07C45;
    --shadow:0 6px 24px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --panel:rgba(26,32,38,.98); --ink:#F1EEE8; --muted:#AEB5BF; --faint:#7F8894;
  --line:#35404A; --btn:#2B343D; --btn-ink:#F1EEE8; --accent:#F07C45;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  overscroll-behavior:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:disabled{cursor:default}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.grow{flex:1}

/* every pressable thing gives a little under the thumb */
.chip,.tool,.fab,.act,.big,.tn,.reward,.tribe{transition:transform .08s ease, filter .08s ease}
.chip:active,.tool:active,.fab:not(:disabled):active,.act:not(:disabled):active,.big:not(:disabled):active,.tn:active,.reward:active,.tribe:active{transform:scale(.95);filter:brightness(.94)}

/* ---- HUD ---- */
#hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;pointer-events:none;z-index:3}
#hud > *{pointer-events:auto}
.chip{background:var(--panel);box-shadow:var(--shadow);border-radius:999px;height:50px;
  display:flex;align-items:center;gap:7px;padding:0 16px;font-weight:700;white-space:nowrap;font-size:18px}
.chip b{font-weight:800}
.chip small{font-weight:700;color:var(--good);font-size:15px}
.chip .dot{width:16px;height:16px;border-radius:5px;transform:rotate(45deg);flex:none}
.chip.idol{padding:0 13px;background:#3B2F1E;color:#FFE08A}
.tool{width:56px;height:56px;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tool i{font-style:normal;font-size:22px;line-height:1}
.tool span{font-size:11px;font-weight:700;color:var(--muted)}

/* ---- floating buttons above the panel ---- */
#fabs{position:fixed;left:0;right:0;bottom:calc(var(--ph) + 10px);display:flex;gap:10px;align-items:flex-end;
  padding:0 12px;pointer-events:none;z-index:2;transition:bottom .15s ease}
#fabs > *{pointer-events:auto}
.fab{height:60px;min-width:64px;border-radius:18px;background:var(--panel);box-shadow:var(--shadow);position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 12px;gap:1px}
.fab i{font-style:normal;font-size:22px;line-height:1}
.fab span{font-size:12px;font-weight:750;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fab:disabled{opacity:.45}
.fab.end{background:var(--accent);color:var(--accent-ink);min-width:104px;height:68px}
.fab.end span{font-size:14px}
.fab.end.nudge{animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.07);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 35%,transparent)}}
.fab.next b{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--good);color:#fff;
  font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.fab.next.none b{background:var(--faint)}

/* ---- bottom panel ---- */
#panel{position:fixed;left:0;right:0;bottom:0;background:var(--panel);box-shadow:var(--shadow);
  border-radius:var(--radius) var(--radius) 0 0;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 14px);
  max-height:46vh;overflow-y:auto;overflow-x:hidden;z-index:2;border-top:5px solid var(--selc, transparent)}
@media (min-width:760px){
  #panel{left:50%;transform:translateX(-50%);width:720px;bottom:12px;border-radius:var(--radius)}
  #fabs{max-width:760px;margin:0 auto}
}
#pinfo h3{margin:0;font-size:19px;line-height:1.25;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#pinfo p{margin:4px 0 0;color:var(--muted);font-size:15px}
.selwhat{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.tag{font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:7px;color:#fff}
.hpbar{display:inline-block;width:74px;height:9px;border-radius:5px;background:var(--line);overflow:hidden;vertical-align:middle}
.hpbar i{display:block;height:100%;background:var(--good)}
.pips{display:inline-flex;gap:4px;vertical-align:middle}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted)}
.pips i.on{background:var(--good);border-color:var(--good)}
.stat{font-size:15px;margin-left:10px;white-space:nowrap;color:var(--ink)}
.status{font-weight:750;color:var(--good)!important}
.status.done{color:var(--faint)!important}
.vet{color:var(--star);font-size:14px}

#pacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}
#pacts:empty{display:none}
@media (max-width:360px){ #pacts{grid-template-columns:1fr} }
.pacts1{display:grid;margin-top:8px}
.act{min-height:68px;border-radius:14px;background:var(--btn);color:var(--btn-ink);border:2px solid transparent;
  display:flex;align-items:flex-start;gap:10px;padding:10px 11px;text-align:left;width:100%}
.act > i{font-style:normal;font-size:26px;line-height:30px;flex:none;width:30px;text-align:center}
.act .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.act .hd{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 8px}
.act .hd b{overflow-wrap:anywhere}
.act b{font-size:15.5px;line-height:1.2}
.act small{font-size:13.5px;line-height:1.3;color:var(--muted)}
.act em{font-style:normal;font-size:13.5px;line-height:1.3;color:var(--bad);font-weight:650}
.act .c{flex:none;font-size:14.5px;font-weight:800;background:var(--panel);border-radius:9px;padding:4px 8px;color:var(--ink);white-space:nowrap}
.act:disabled > i{filter:grayscale(1);opacity:.55}
.act:disabled b{color:var(--muted)}
.act:disabled .c{opacity:.5}
.act.go{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--btn))}
.act.wide{grid-column:1 / -1}
.sec{grid-column:1 / -1;font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:6px}
.skills{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:7px}
.skill{font-size:13.5px;background:var(--btn);border-radius:9px;padding:5px 9px;color:var(--muted)}
.skill b{color:var(--ink)}
.hint{grid-column:1 / -1;font-size:14px;line-height:1.45;color:var(--muted);margin-top:2px}
.banner{grid-column:1 / -1;font-size:14.5px;line-height:1.4;background:color-mix(in srgb,var(--star) 18%,var(--btn));border-radius:12px;padding:10px 12px}

/* ---- toast ---- */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translateX(-50%);
  background:rgba(18,24,30,.94);color:#fff;padding:11px 18px;border-radius:16px;font-weight:650;font-size:15.5px;line-height:1.35;
  opacity:0;transition:opacity .25s;pointer-events:none;width:max-content;max-width:calc(100% - 32px);text-align:center;z-index:4}
#toast.show{opacity:1}

/* ---- modal sheets ---- */
.modal{position:fixed;inset:0;background:rgba(6,14,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
@media (min-width:760px){ .modal{align-items:center} }
.sheet{background:var(--panel);width:100%;max-width:580px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;
  padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 20px);box-shadow:var(--shadow)}
@media (min-width:760px){ .sheet{border-radius:24px} }
.sheet h2{margin:0 0 6px;font-size:24px;line-height:1.2}
.sheet h4{margin:18px 0 8px;font-size:13.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sheet p{margin:6px 0;font-size:16px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.big{min-height:56px;border-radius:16px;background:var(--btn);color:var(--btn-ink);font-weight:750;font-size:16.5px;padding:0 18px;flex:1;min-width:130px}
.big.primary{background:var(--accent);color:var(--accent-ink)}
.big.danger{color:var(--bad)}
.big:disabled{opacity:.5}
.seg{display:flex;background:var(--btn);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:48px;border-radius:11px;font-weight:700;color:var(--muted);font-size:16px}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.tribes{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media (max-width:380px){ .tribes{grid-template-columns:1fr} }
.tribe{border-radius:16px;padding:12px 13px;background:var(--btn);text-align:left;border:3px solid transparent;display:block}
.tribe.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--btn))}
.tribe b{display:flex;align-items:center;gap:8px;font-size:17px}
.tribe b i{width:15px;height:15px;border-radius:4px;background:var(--c);transform:rotate(45deg)}
.tribe span{display:block;font-size:13.5px;color:var(--muted);margin-top:5px;line-height:1.35}
.tribe .trait{color:var(--ink)}
.close{float:right;width:48px;height:48px;border-radius:50%;background:var(--btn);font-size:24px;line-height:48px}

/* skill web */
.web{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.web .day{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center}
.web .col{display:flex;flex-direction:column;gap:8px}
.tn{border-radius:14px;padding:9px 8px;background:var(--btn);min-height:64px;text-align:left;border:3px solid transparent;width:100%;position:relative}
.tn i{font-style:normal;font-size:20px;line-height:1;display:block}
.tn b{display:block;font-size:14px;line-height:1.2;margin-top:3px}
.tn span{display:block;font-size:12.5px;color:var(--muted)}
.tn.done{background:var(--c);color:#fff}
.tn.done span{color:rgba(255,255,255,.88)}
.tn.can{border-color:var(--good)}
.tn.locked{opacity:.5}
.tn.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent);opacity:1}
.tn.need{border-color:#3C8CE7;border-style:dashed;opacity:1}
.tn.lead{border-color:#9B6BE0;border-style:dotted;opacity:1}
.legend{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
.legend b{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.tdetail{border-top:1px solid var(--line);padding-top:14px;margin-top:12px;min-height:110px}
.unlocks{margin:0 0 12px;padding-left:0;list-style:none}
.unlocks li{padding:7px 0;border-bottom:1px solid var(--line);font-size:15.5px}

/* rewards and cards */
.reward{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:16px;border-radius:16px;background:var(--btn);text-align:left;flex:1;min-width:150px}
.reward i{font-style:normal;font-size:32px}
.reward b{font-size:18px}
.reward span{font-size:14.5px;color:var(--muted)}
.tcard{border-left:5px solid var(--c);background:var(--btn);border-radius:14px;padding:12px 13px;margin-top:10px;display:flex;flex-direction:column;gap:5px}
.tcard > b{display:flex;align-items:center;gap:8px;font-size:17px}
.tcard > b i{width:13px;height:13px;border-radius:3px;background:var(--c);transform:rotate(45deg)}
.tcard > b small{margin-left:auto;font-weight:650;color:var(--muted);font-size:14px}
.tcard > span{font-size:14.5px;color:var(--muted)}
.tcard .act{background:var(--panel)}
.ledger{display:grid;grid-template-columns:1fr auto;gap:10px 12px;margin:12px 0}
.ledger span{display:flex;flex-direction:column;font-size:16px}
.ledger small{color:var(--muted);font-size:13.5px}
.ledger b{color:var(--good);align-self:center;font-size:17px}
.chron{list-style:none;padding:0;margin:0}
.chron li{font-size:14.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.chron small{color:var(--muted);margin-right:6px}
.help li{margin:9px 0;font-size:15.5px}
.stats{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:12px 0;font-size:16px}
.bigicon{font-size:52px;line-height:1;margin:4px 0 8px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;font-size:16px}
.switch input{width:52px;height:30px;accent-color:var(--accent)}

/* title */
.title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:24px 16px calc(env(safe-area-inset-bottom,0px) + 28px);
  background:linear-gradient(180deg,rgba(10,26,36,0) 30%,rgba(10,26,36,.85) 75%)}
.logo{font-size:50px;font-weight:850;letter-spacing:-.03em;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.5);margin:0}
.tagline{color:rgba(255,255,255,.85);margin:4px 0 22px;text-align:center;font-size:16.5px;max-width:380px}
.tmenu{display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px}
.tmenu .big{flex:none}
.ver{color:rgba(255,255,255,.5);font-size:13px;margin-top:14px}
</style>
</head>
<body>
<canvas id="cv" aria-label="Game map"></canvas>

<div id="hud" hidden>
  <button class="chip" id="btnStars" aria-label="Shells and income"><i class="dot" id="hudDot"></i><span class="cur">🐚 <b id="hudStars">0</b></span><small id="hudInc">+0</small></button>
  <button class="chip idol" id="btnIdols" hidden aria-label="Hidden immunity idols">🗿 <b id="hudIdols">0</b></button>
  <div class="grow"></div>
  <button class="tool" id="btnTribes"><i>👥</i><span>Tribes</span></button>
  <button class="tool" id="btnTech"><i>🧠</i><span>Skills</span></button>
  <button class="tool" id="btnMenu" aria-label="Menu"><i>☰</i><span>Menu</span></button>
</div>

<div id="fabs" hidden>
  <button class="fab undo" id="btnUndo" title="Undo last action"><i>↩</i><span id="undoLbl">Undo</span></button>
  <div class="grow"></div>
  <button class="fab next" id="btnNext" title="Select the next unit that can still act"><i>▶</i><span>Next</span><b id="nextCount">0</b></button>
  <button class="fab end" id="btnEnd"><i>☀️</i><span>End turn</span></button>
</div>

<div id="panel" hidden>
  <div id="pinfo"></div>
  <div id="pacts"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="title" class="title">
  <h1 class="logo">Tribelands</h1>
  <p class="tagline">Castaways of the Ember Isles. Forage, build, scheme, and be the last tribe standing.</p>
  <div class="tmenu" id="tmenu"></div>
  <div class="ver" id="tver"></div>
</div>

<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<script>
'use strict';
/* Tribelands — castaway tribes on a volcanic island chain.
   Rules, map generation and the computer tribes. Everything the game knows
   lives in S, a plain object that goes straight to JSON: that is the
   autosave, and a copy of it is what Undo steps back to.                    */

const VERSION = 'v23';
const SAVE_KEY = 'tribelands-save-v1';
const PREF_KEY = 'tribelands-prefs-v1';
const SH = '🐚';                                  // shells: the island's currency

const FIELD = 0, FOREST = 1, MOUNTAIN = 2, SHALLOW = 3, OCEAN = 4;
const TERRAIN_NAME = ['Grassland', 'Jungle', 'Cliffs', 'Lagoon', 'Deep sea'];
const TERRAIN_ICON = ['🌱', '🌴', '🪨', '🏝️', '🌊'];
const isWater = t => t === SHALLOW || t === OCEAN;
const LEVEL_NAME = ['Shack', 'Shelter', 'Camp', 'Village', 'Town', 'Haven'];
const levelName = l => LEVEL_NAME[Math.min(l, 5)];

const TRIBES = [
  { name: 'Tala', color: '#EE7440', skin: '#E9B48A', tech: 'forage', start: 'scrapper', hat: 'flower',
    blurb: 'Coconut coast. They wash up knowing how to forage.',
    trait: { name: 'Coconut crackers', icon: '🥥', desc: `Cracking coconuts costs 1 ${SH} instead of 2.` },
    land: { forest: .22, mountain: .12 }, res: { coconut: .36, taro: .22, boar: .35, obsidian: .35 },
    pal: { field: '#9DCF62', forest: '#3F9A55', mountain: '#857C77', tree: 'palm' },
    syl: ['ta', 'la', 'ko', 'mai', 'ri', 'nu', 'hi', 'po', 'ea', 'lo', 'ki', 'wa', 'ma', 'le'] },
  { name: 'Moku', color: '#16A39D', skin: '#D9A578', tech: 'fishing', start: 'scrapper', hat: 'bandana',
    blurb: 'Lagoon folk. They wash up spear in hand.',
    trait: { name: 'Lagoon born', icon: '🏊', desc: 'Your units wade through lagoons (shallow water) as if it were land.' },
    land: { forest: .2, mountain: .12 }, res: { coconut: .3, taro: .2, boar: .3, obsidian: .3 },
    pal: { field: '#8FD08A', forest: '#2E8F6A', mountain: '#7E8288', tree: 'banana' },
    syl: ['mo', 'ku', 'ai', 'na', 'pe', 'wai', 'ho', 'li', 'ke', 'ua', 'mi', 'lu', 'ha', 'o'] },
  { name: 'Vaka', color: '#D23F3A', skin: '#C98E60', tech: 'climbing', start: 'scrapper', hat: 'feather',
    blurb: 'Cliff dwellers of the black basalt. They wash up climbing.',
    trait: { name: 'Cliff runners', icon: '🧗', desc: 'Cliffs never stop your units’ movement.' },
    land: { forest: .18, mountain: .34 }, res: { coconut: .28, taro: .18, boar: .3, obsidian: .6 },
    pal: { field: '#B4C865', forest: '#5A8F3A', mountain: '#5E5A62', tree: 'bamboo' },
    syl: ['va', 'ka', 'tu', 'ro', 'fe', 'ga', 'si', 'mo', 'te', 'ra', 'pu', 'ne', 'ti', 'ho'] },
  { name: 'Nalu', color: '#8E58D0', skin: '#F0C9A6', tech: 'tracking', start: 'scrapper', hat: 'leaf',
    blurb: 'Jungle trackers. They wash up hunting.',
    trait: { name: 'Jungle ghosts', icon: '🌿', desc: 'Jungle never stops your units, and they always defend +50% in it.' },
    land: { forest: .46, mountain: .13 }, res: { coconut: .22, taro: .15, boar: .52, obsidian: .35 },
    pal: { field: '#7FBF63', forest: '#23704A', mountain: '#7B7E86', tree: 'jungle' },
    syl: ['na', 'lu', 'ki', 'ra', 'ze', 'mu', 'ta', 'vi', 'ol', 'sa', 'ni', 'ko', 'ya', 'ri'] },
];

// The skill web. Skills unlock by survival day, and later ones need two earlier ones.
const TECHS = {
  forage:    { name: 'Foraging',         icon: '🥥', tier: 1, needs: [], unlocks: ['🥥 Crack coconuts: +1 survivor'] },
  fishing:   { name: 'Spearfishing',     icon: '🐟', tier: 1, needs: [], unlocks: ['🐟 Spear fish: +1 survivor', '⚓ Raft docks: units that walk in become rafts'] },
  tracking:  { name: 'Tracking',         icon: '🐾', tier: 1, needs: [], unlocks: ['🐗 Hunt wild boar: +1 survivor'] },
  climbing:  { name: 'Climbing',         icon: '🧗', tier: 1, needs: [], unlocks: ['🪨 Walk onto cliffs', 'Units on cliffs defend +50%'] },
  fire:      { name: 'Firemaking',       icon: '🔥', tier: 1, needs: [], unlocks: [`🔥 Signal fires on cliffs: see far, +1 ${SH} a turn from passing traders`, `🔥 Slash and burn jungle for +1 ${SH}`] },

// ---------- small helpers ----------
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hash(x, y, k = 0) {
  let h = Math.imul(x + 1013, 374761393) ^ Math.imul(y + 7, 668265263) ^ Math.imul(k + 3, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

let S = null;                        // the game

}

function cityAtI(i) { const c = S.tiles[i].cityHere; return c >= 0 ? S.cities[c] : null; }
function ownerOfI(i) { const c = S.tiles[i].city; return c >= 0 ? S.cities[c].owner : -1; }
const has = (p, t) => !!S.players[p].techs[t];
const tribeOf = p => TRIBES[S.players[p].tribe];
const tribeIs = (p, k) => S.players[p].tribe === k;

const unitsOf = p => S.units.filter(u => u.owner === p);

const peaceKey = (a, b) => Math.min(a, b) + '-' + Math.max(a, b);
function atPeace(a, b) { return a !== b && a >= 0 && b >= 0 && (S.truce[peaceKey(a, b)] || 0) >= S.turn; }
function peaceLeft(a, b) { return Math.max(0, (S.truce[peaceKey(a, b)] || 0) - S.turn + 1); }
const hostile = (a, b) => a !== b && !atPeace(a, b);

  let s = 0;
  for (const u of S.units) if (u.owner === p) s += (st(u).atk + st(u).def) * u.hp / 10;
  return s + citiesOf(p).length * 3;
}

function truceAccepted(p, q) { return strength(q) < strength(p) * 1.25 || Math.random() < .25; }
function makeTruce(a, b, turns) { S.truce[peaceKey(a, b)] = S.turn + turns; }

// ---------- economy ----------
function techCost(p, t) { return TECHS[t].tier * Math.max(1, citiesOf(p).length) + 4; }
function canResearch(p, t) { return !has(p, t) && techReady(p, t) && S.players[p].stars >= techCost(p, t); }
function wonderOwner(key) { const c = S.wonders[key]; return c == null ? -1 : S.cities[c].owner; }
const hasWonder = (p, key) => wonderOwner(key) === p;
function postValue(i) {
  const [x, y] = XY(i);
  let k = 0;
  for (const [nx, ny] of nbrs(x, y)) if (POST_FEEDERS.includes(tileAt(nx, ny).imp)) k++;
  return Math.min(4, k);
}

// Every source of shells, so the HUD can explain the total.
function incomeParts(p) {
  const parts = [];
  for (const c of S.cities) {
    if (c.owner !== p) continue;
    const why = ['level ' + c.level, c.capital && 'first camp +1', c.workshop && 'toolmaker +1', c.parks && 'hammocks +' + c.parks].filter(Boolean).join(', ');
    parts.push({ label: c.name, why, v: cityIncome(c) });
  }
  let m = 0, mk = 0, sig = 0;
  for (let i = 0; i < S.tiles.length; i++) {
    if (ownerOfI(i) !== p) continue;
    if (S.tiles[i].imp === 'post') { m += postValue(i); mk++; }
    if (S.tiles[i].imp === 'signal') sig++;
  }
  if (mk) parts.push({ label: 'Trading posts', why: mk + (mk === 1 ? ' post' : ' posts'), v: m });
  if (sig) parts.push({ label: 'Signal fires', why: 'passing traders', v: sig });

}
function income(p) { return incomeParts(p).reduce((s, x) => s + x.v, 0); }
function homeCount(c) { let k = 0; for (const u of S.units) if (u.home === c.id) k++; return k; }
function capacity(c) { return c.level + 1; }

// ---------- vision (only the human player has fog) ----------
let revealed = 0;                    // tiles newly revealed since the last reset — an undo barrier
function reveal(x, y, r) {
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    const nx = x + dx, ny = y + dy;
    if (!inb(nx, ny)) continue;
    const i = I(nx, ny);
    if (!S.explored[i]) { S.explored[i] = 1; revealed++; }
  }
}
function vision() {
  for (const u of S.units) if (isHuman(u.owner)) reveal(u.x, u.y, tileAt(u.x, u.y).t === MOUNTAIN || flies(u) ? 2 : 1);
  for (const c of S.cities) if (c.owner >= 0 && isHuman(c.owner)) reveal(c.x, c.y, c.radius + 1);
  for (let i = 0; i < S.tiles.length; i++) if (S.tiles[i].imp === 'signal' && ownerOfI(i) >= 0 && isHuman(ownerOfI(i))) reveal(...XY(i), 3);
}

// ---------- map generation ----------
function cityName(tribe) {
  const syl = TRIBES[tribe].syl;
  for (let k = 0; k < 40; k++) {
    let s = pick(syl) + pick(syl);
    if (Math.random() < .3) s += pick(syl);
    s = s[0].toUpperCase() + s.slice(1);
    if (s.length <= 10 && !S.cities.some(c => c.name === s)) return s;
  }
  return 'Camp ' + (S.cities.length + 1);

function newGame(opts) {
  const n = { small: 11, medium: 14, large: 18 }[opts.size] || 14;
  const tribes = [opts.tribe, ...shuffle([0, 1, 2, 3].filter(t => t !== opts.tribe)).slice(0, opts.opponents)];
  S = {
    v: 3, n, turn: 1, cur: 0, diff: opts.diff, size: opts.size, over: null, nextId: 1,
    players: tribes.map((t, i) => ({ id: i, tribe: t, human: i === 0, stars: 5 + (i && opts.diff === 'hard' ? 3 : 0),
      techs: { [TRIBES[t].tech]: true }, alive: true, kills: 0, lost: 0, converts: 0, idols: 0, challenges: 0, asked: {} })),
    tiles: [], cities: [], units: [], explored: new Array(n * n).fill(0), pendingRewards: [],
    wonders: {}, truce: {}, nextEvent: 5 + rnd(3), event: null, offer: null, log: [],
    challenge: null, nextChallenge: 3 + rnd(3), volcano: -1,
  };
  genMap(tribes);
  revealed = 0;
  vision();
  return S;
}

function placeCapitals(n, k) {
  const m = n <= 11 ? 2 : 3;
  const spots = shuffle([[m, m], [n - 1 - m, n - 1 - m], [n - 1 - m, m], [m, n - 1 - m]]);
  if (k === 2) {                                 // two tribes wash up on opposite corners
    const a = spots[0];
    const b = spots.find(s => s[0] !== a[0] && s[1] !== a[1]);
    spots.splice(0, 4, a, b);
  }
  return spots.slice(0, k).map(([x, y]) => [clamp(x + rnd(3) - 1, 1, n - 2), clamp(y + rnd(3) - 1, 1, n - 2)]);
}

function genMap(tribes) {
  const n = S.n, N = n * n;
  const caps = placeCapitals(n, tribes.length);
  const G = 3, gw = Math.ceil(n / G) + 2, g = Array.from({ length: gw * gw }, () => Math.random());
  const sm = t => t * t * (3 - 2 * t);
  const vn = (x, y) => {
    const fx = x / G, fy = y / G, x0 = Math.floor(fx), y0 = Math.floor(fy), u = sm(fx - x0), v = sm(fy - y0);
    const a = g[y0 * gw + x0], b = g[y0 * gw + x0 + 1], c = g[(y0 + 1) * gw + x0], d = g[(y0 + 1) * gw + x0 + 1];
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  const land = new Array(N).fill(false), clim = new Array(N).fill(0);
  const cx0 = (n - 1) / 2, cy0 = (n - 1) / 2;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    let best = 0, bd = 1e9;
    caps.forEach(([cx, cy], k) => { const d = (cx - x) ** 2 + (cy - y) ** 2 + Math.random() * 3; if (d < bd) { bd = d; best = k; } });
    clim[I(x, y)] = tribes[best];
    const edge = Math.min(x, y, n - 1 - x, n - 1 - y);
    const centre = Math.hypot(x - cx0, y - cy0) < 1.6 ? .3 : 0;               // the volcano's island
    const h = vn(x, y) * .75 + Math.random() * .25 + (edge < 1 ? -.34 : edge < 2 ? -.12 : 0) + (bd < 9 ? .12 : 0) + centre;
    land[I(x, y)] = h > .5;                                                    // an archipelago: more sea
  }
  for (const [cx, cy] of caps) for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
    const x = cx + dx, y = cy + dy;
    if (inb(x, y) && (Math.max(Math.abs(dx), Math.abs(dy)) <= 1 || Math.random() < .5)) land[I(x, y)] = true;
  }
  // sandbars: every camp must be reachable on foot from every other
  const comp = () => {
    const c = new Array(N).fill(-1); let id = 0;
    for (let s = 0; s < N; s++) {
      if (!land[s] || c[s] >= 0) continue;
      const q = [s]; c[s] = id;
      for (let h = 0; h < q.length; h++) {
        const [x, y] = XY(q[h]);
        for (const [nx, ny] of nbrs(x, y)) { const j = I(nx, ny); if (land[j] && c[j] < 0) { c[j] = id; q.push(j); } }
      }
      id++;
    }
    return c;

  else if (key === 'burn') { t.t = FIELD; t.res = null; P.stars += W.gain; }
  const [x, y] = XY(i);
  if (W.pop) { FX.float(x, y, '+' + W.pop + ' survivor' + (W.pop > 1 ? 's' : ''), '#bff38a'); addPop(S.cities[t.city], W.pop); }
  if (W.gain) FX.float(x, y, '+' + W.gain + ' ' + SH, '#ffd24a');

}
function addPop(c, k) {

    c.level++;

}
function applyReward(c, key) {
  const P = S.players[c.owner];

  else if (key === 'walls') c.walls = true;
  else if (key === 'resources') P.stars += 5;
  else if (key === 'popgrowth') addPop(c, 3);
  else if (key === 'border') { c.radius = 2; claim(c); if (isHuman(c.owner)) vision(); }
  else if (key === 'park') c.parks++;

    if (spot) addUnit('titan', c.owner, spot[0], spot[1], c.id); else P.stars += 5;

    let x = c.x, y = c.y;
    for (let k = 0; k < 24; k++) {
      const opts = nbrs(x, y);
      const fresh = opts.filter(([nx, ny]) => !seen(I(nx, ny)));
      [x, y] = fresh.length && Math.random() < .8 ? pick(fresh) : pick(opts);

}

  if (!has(p, Wd.tech)) return 'Learn ' + TECHS[Wd.tech].name;
  if (Object.values(S.wonders).includes(c.id)) return 'This camp already has a landmark';

}
function doWonder(p, c, key) {

  if (key === 'lighthouse' && isHuman(p)) S.explored.fill(1);
  FX.say(`The ${tribeOf(p).name} raised the ${WONDERS[key].name} in ${c.name}`, p);
  logIt(`The ${tribeOf(p).name} raised the ${WONDERS[key].name} in ${c.name}`);

// ---------- the island ----------
function worldEvent() {
  const key = pick(Object.keys(EVENTS));
  if (key === 'rain') for (const c of S.cities) if (c.owner >= 0) addPop(c, 1);
  else if (key === 'drop') for (const P of S.players) if (P.alive) P.stars += 3;
  else if (key === 'storm') for (const u of S.units) u.hp = Math.max(1, u.hp - (atSea(u) ? 3 : 1));
  else if (key === 'washed') {
    let k = 0;
    for (const i of shuffle([...S.tiles.keys()])) { if (k >= 2) break; if (placeVillage(i)) k++; }
  } else if (key === 'stampede') {
    for (const t of S.tiles) if (t.t === FOREST && !t.res && !t.imp && t.cityHere < 0 && Math.random() < .35) t.res = 'boar';
  } else if (key === 'eruption') {
    const [vx, vy] = XY(S.volcano);
    for (const u of S.units) if (cheb(u.x, u.y, vx, vy) <= 2) u.hp = Math.max(1, u.hp - 4);
    for (const [nx, ny] of nbrs(vx, vy)) { const t = tileAt(nx, ny); if (t.t === MOUNTAIN && !t.imp && !t.res) t.res = 'obsidian'; }
    if (!seen(S.volcano)) reveal(vx, vy, 1);
  } else if (key === 'moon') {
    const dark = [...S.tiles.keys()].filter(i => !seen(i));
    if (dark.length) { const [x, y] = XY(pick(dark)); reveal(x, y, 3); }
  }
  S.event = { key, turn: S.turn };
  logIt(EVENTS[key].name + ': ' + EVENTS[key].desc);
}
// A flag goes up somewhere fair: about as far from every tribe's camps.
function spawnChallenge() {
  const cand = [];
  const alive = S.players.filter(P => P.alive && citiesOf(P.id).length);
  for (let i = 0; i < S.tiles.length; i++) {
    const t = S.tiles[i];
    if (isWater(t.t) || t.cityHere >= 0 || t.ruin || t.volcano || unitAt(...XY(i))) continue;
    const [x, y] = XY(i);
    const per = alive.map(P => Math.min(...citiesOf(P.id).map(c => cheb(c.x, c.y, x, y))));
    if (!per.length || Math.min(...per) < 2) continue;
    cand.push({ i, spread: Math.max(...per) - Math.min(...per) + Math.random() });
  }
  if (!cand.length) return;
  cand.sort((a, b) => a.spread - b.spread);
  const c = pick(cand.slice(0, 4));
  S.challenge = { i: c.i, kind: Math.random() < .5 ? 'reward' : 'immunity', until: S.turn + 6, turn: S.turn, seen: false };
  S.explored[c.i] = 1;
  logIt(`${CHALLENGES[S.challenge.kind].name} announced`);
}
// Called once each time the turn counter moves on.
function beginRound() {
  if (S.challenge && S.turn > S.challenge.until) {
    logIt(`Nobody reached the ${CHALLENGES[S.challenge.kind].name.toLowerCase()} in time`);
    S.challenge = null; S.nextChallenge = S.turn + 4 + rnd(3);
  }
  if (!S.challenge && S.turn >= S.nextChallenge) spawnChallenge();
  else if (S.turn >= S.nextEvent) { worldEvent(); S.nextEvent = S.turn + 5 + rnd(4); }
}
function startTurn(p) {
  const P = S.players[p];
  if (S.turn > 1) P.stars += income(p);          // nobody earns on the first turn
  const spring = hasWonder(p, 'spring');
  for (const u of S.units) if (u.owner === p) {
    u.moved = false; u.attacked = false;
    if (spring && u.hp < maxHp(u)) u.hp = Math.min(maxHp(u), u.hp + 2);
  }
}
function checkElims() {
  for (const P of S.players) {
    if (!P.alive) continue;
    if (!S.cities.some(c => c.owner === P.id)) {
      P.alive = false;
      S.units = S.units.filter(u => u.owner !== P.id);
      FX.say(`The ${TRIBES[P.tribe].name} tribe has been voted off the islands.`, P.id, null, true);
      logIt(`The ${TRIBES[P.tribe].name} tribe is out`);
    }
  }
  if (!S.players[0].alive) S.over = 'lose';
  else if (S.players.every(P => P.human || !P.alive)) S.over = 'win';
}

// ---------- the computer tribes ----------
function aiReward(c) {
  const lv = c.level;
  const key = lv === 2 ? 'workshop' : lv === 3 ? (enemyNear(c.x, c.y, c.owner, 4) ? 'walls' : 'resources')
    : lv === 4 ? 'popgrowth' : 'giant';
  applyReward(c, key);
}
function goalField(p, goals, fly) {
  const N = S.n * S.n, dist = new Array(N).fill(1e9), src = new Array(N).fill(-1), q = [];
  const wade = tribeIs(p, 1);
  for (const g of goals) if (dist[g] > 0) { dist[g] = 0; src[g] = g; q.push(g); }
  for (let h = 0; h < q.length; h++) {
    const i = q[h], [x, y] = XY(i);
    for (const [nx, ny] of nbrs(x, y)) {
      const j = I(nx, ny);
      if (dist[j] <= dist[i] + 1) continue;
      const t = S.tiles[j];
      if (!fly) {
        if (t.t === OCEAN || (t.t === SHALLOW && !wade)) continue;
        if (t.t === MOUNTAIN && !has(p, 'climbing')) continue;
      }
      dist[j] = dist[i] + 1; src[j] = src[i]; q.push(j);
    }
  }
  return { dist, src };
}
function techUseful(p, t) {
  const inLand = f => S.tiles.some((tt, i) => ownerOfI(i) === p && f(tt));
  switch (t) {
    case 'forage': return inLand(tt => tt.res === 'coconut' || tt.res === 'taro');
    case 'gardening': return inLand(tt => tt.res === 'taro');
    case 'tracking': return inLand(tt => tt.res === 'boar' || tt.t === FOREST);
    case 'weaving': return inLand(tt => tt.t === FOREST && !tt.res);
    case 'fishing': return inLand(tt => tt.res === 'fish');
    case 'climbing': case 'fire': return inLand(tt => tt.t === MOUNTAIN);
    case 'quarrying': return inLand(tt => tt.res === 'obsidian');
    case 'trading': return inLand(tt => POST_FEEDERS.includes(tt.imp));

}
function aiResearch(p, reserve) {
  const P = S.players[p];
  const order = ['forage', 'tracking', 'gardening', 'sprinting', 'climbing', 'quarrying', 'slings', 'fishing', 'shells',
    'weaving', 'obsidian', 'fire', 'alliances', 'trails', 'boars', 'gliding', 'medicine', 'catapult', 'rafting', 'trading'];
  const useful = t => techUseful(p, t) || Object.keys(TECHS).some(k => TECHS[k].needs.includes(t) && !has(p, k) && techUseful(p, k));
  for (const t of order) {
    if (has(p, t) || !techReady(p, t) || !useful(t)) continue;

    return false;
  }

}
function aiEconomy(p, reserve) {
  const P = S.players[p];
  for (let guard = 0; guard < 40; guard++) {
    let best = null, bv = -1;
    for (let i = 0; i < S.tiles.length; i++) {
      if (ownerOfI(i) !== p) continue;
      for (const key of ['coconut', 'boar', 'fish', 'garden', 'quarry', 'hut', 'post', 'signal']) {
        if (!canWork(p, i, key)) continue;
        const W = WORKS[key], cost = workCost(p, key);
        if (P.stars - cost < reserve) continue;
        let v;
        if (key === 'post') { const m = postValue(i); if (m < 2) continue; v = m / 5; }
        else if (key === 'signal') v = .22;
        else {
          const c = S.cities[S.tiles[i].city];
          v = W.pop / cost + (c.pop + W.pop >= c.level + 1 ? .6 : 0);
        }
        v += Math.random() * .05;
        if (v > bv) { bv = v; best = [i, key]; }

    }

}
function aiWonder(p) {
  const P = S.players[p];
  if (S.turn < 8 || Math.random() < .5) return;
  for (const key of shuffle(Object.keys(WONDERS))) {
    for (const c of citiesOf(p)) {
      if (wonderBlock(p, c, key) || P.stars < WONDERS[key].cost + 3) continue;
      doWonder(p, c, key);
      return;
    }
  }
}
function aiPickUnit(p, threat) {
  const P = S.players[p];
  const w = { scrapper: 3, runner: 4, slinger: 3, shieldbearer: threat ? 5 : 1, healer: threat ? 1 : 0, schemer: threat ? 2 : .5,
    blade: 6, glider: 4, catapult: threat ? 3 : 1, boarrider: 6 };
  const avail = TRAINABLE.filter(k => (!UNITS[k].tech || has(p, UNITS[k].tech)) && UNITS[k].cost <= P.stars && w[k] > 0);
  if (!avail.length) return null;
  let tot = 0; for (const k of avail) tot += w[k];
  let r = Math.random() * tot;
  for (const k of avail) { r -= w[k]; if (r <= 0) return k; }

}
function aiTrain(p, want) {
  let made = 0;

    if (made >= want) break;
    if (unitAt(c.x, c.y) || homeCount(c) >= capacity(c)) continue;
    const k = aiPickUnit(p, enemyNear(c.x, c.y, p, 4));
    if (!k || !canTrain(p, c, k)) continue;
    doTrain(p, c, k); made++;

}
async function aiAttack(u) {
  for (let guard = 0; guard < 4; guard++) {
    if (!S.units.includes(u)) return;
    let best = null, bs = 0;
    const conv = !u.boat && UNITS[u.type].convert;
    for (const e of targets(u)) {
      let s;
      if (conv) s = UNITS[e.type].cost + e.hp / 3;
      else {
        const r = combat(u, e);
        s = r.dmg + (r.killed ? 5 + UNITS[e.type].cost : 0) - r.ret * 1.1 - (r.ret >= u.hp ? 40 : 0);
        const c = cityAtI(I(e.x, e.y));
        if (c && c.owner === u.owner) s += 4;
        else if (c && r.ret < u.hp) {
          // a garrison never falls to one attacker: gang up, as a player would
          const friends = S.units.filter(v => v.owner === u.owner && v !== u && cheb(v.x, v.y, e.x, e.y) <= 1).length;
          s += S.diff === 'easy' ? 1 + friends * 1.5 : 2 + friends * 2.5;
        }
      }
      if (s > bs) { bs = s; best = e; }
    }
    if (!best) return;
    if (S.diff === 'easy' && Math.random() < .35) return;
    await doAttack(u, best);

  }
}
async function aiUnit(u, claimed) {
  if (!S.units.includes(u) || S.over) return;
  const p = u.owner;
  if (canCapture(u)) { doCapture(u); await FX.pause(u); return; }
  if (canRuin(u)) { doRuin(u); return; }
  if (exhausted(u)) return;
  if (canHeal(u)) { doHeal(u); return; }
  if (u.hp < maxHp(u) * .45 && canRecover(u) && !enemyNear(u.x, u.y, p)) { doRecover(u); return; }
  await aiAttack(u);
  if (!S.units.includes(u) || u.moved || u.boat) return;
  const here = I(u.x, u.y), hc = cityAtI(here);
  if (hc && hc.owner !== p && !atPeace(p, hc.owner)) return;       // hold it and capture next turn
  if (hc && hc.owner === p && enemyNear(u.x, u.y, p, 2)) return;   // garrison
  const goals = [];
  if (UNITS[u.type].heal) {
    for (const v of S.units) if (v.owner === p && v !== u && v.hp < maxHp(v)) goals.push(I(v.x, v.y));
  } else {
    for (const c of S.cities) {
      const gi = I(c.x, c.y);
      if (claimed.has(gi) || atPeace(p, c.owner)) continue;
      if (c.owner !== p) goals.push(gi);
      else if (!unitAt(c.x, c.y) && enemyNear(c.x, c.y, p, 3)) goals.push(gi);
    }
    for (let i = 0; i < S.tiles.length; i++) if (S.tiles[i].ruin && !claimed.has(i) && !isWater(S.tiles[i].t)) goals.push(i);
    if (S.challenge && !claimed.has(S.challenge.i)) goals.push(S.challenge.i);
    for (const e of S.units) if (hostile(p, e.owner)) goals.push(I(e.x, e.y));
  }
  const { dist, src } = goalField(p, goals, flies(u));
  const { dests, prev } = moveInfo(u);
  let best = here, bd = dist[here];
  for (const d of dests) {
    const t = S.tiles[d];
    if (!canStand(u, d)) continue;
    let v = dist[d];
    if (S.challenge && d === S.challenge.i) v -= 3;
    if ((t.t === FOREST && (has(p, 'slings') || tribeIs(p, 3))) || (t.t === MOUNTAIN && has(p, 'climbing'))) v -= .2;
    if (S.diff === 'easy') v += Math.random() * 1.5;
    if (v < bd) { bd = v; best = d; }
  }
  if (best !== here) {
    if (src[best] >= 0 && dist[best] <= 4) claimed.add(src[best]);
    await doMove(u, best, prev);
    await FX.pause(u);
    const bc = cityAtI(best);
    if (bc && bc.owner !== p) claimed.add(best);

    await aiAttack(u);

}
function aiDiplomacy(p) {
  if (S.offer || !S.players[0].alive || atPeace(p, 0) || S.turn < 6) return;
  const theirs = citiesOf(p), near = theirs.some(c => S.units.some(e => e.owner === 0 && cheb(c.x, c.y, e.x, e.y) <= 3));
  if (near && strength(p) < strength(0) * .6 && Math.random() < .25) {
    const gift = Math.min(S.players[p].stars, 2 + theirs.length * 2);

  }
}
async function aiTurn(p) {
  const P = S.players[p];
  const mine = citiesOf(p);
  const threat = mine.some(c => enemyNear(c.x, c.y, p, 3));
  const units = unitsOf(p).length;
  const desired = mine.reduce((s, c) => s + c.level, 0) + (threat ? 2 : 0) + (S.diff === 'hard' ? 1 : 0);
  if (units < Math.max(2, desired * (S.diff === 'easy' ? .6 : 1))) aiTrain(p, threat ? 3 : 1);
  aiResearch(p, S.diff === 'easy' ? 2 : 0);
  aiEconomy(p, threat ? 3 : 0);
  aiWonder(p);
  const claimed = new Set();
  const list = unitsOf(p).sort((a, b) => (canCapture(b) ? 1 : 0) - (canCapture(a) ? 1 : 0));
  for (const u of list) {
    await aiUnit(u, claimed);
    if (S.over) return;
  }

// ---------- saving ----------

}

/* Tribelands — drawing the islands, touch input and the screens around the map. */

const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const TW = 64, TH = 32, LH = 6, WD = 4;          // tile size, land edge depth, water drop
const ZMIN = .5, ZMAX = 3;
let W = 0, H = 0, DPR = 1;
const cam = { x: 0, y: 0, z: 1 };
let mode = 'title';                               // 'title' | 'game'
let busy = false;
let sel = null, selMoves = { dests: new Set(), prev: new Map() }, selTargets = [];
let undoStack = [];

try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch (e) { }
if (prefs.last && prefs.last.tribe > 3) prefs.last.tribe = 0;
const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) { } };
// A small buzz under the thumb, on phones that have one.
function buzz(p) { try { if (prefs.haptics && navigator.vibrate) navigator.vibrate(p); } catch (e) { } }

// ---------- colour ----------
const _shade = new Map();
function shade(hex, amt) {
  const key = hex + amt;

  if (v) return v;
  let r, g, b;
  if (hex[0] === '#') { const n = parseInt(hex.slice(1), 16); r = n >> 16; g = (n >> 8) & 255; b = n & 255; }
  else [r, g, b] = hex.match(/\d+/g).map(Number);         // an rgb() this function made earlier
  const f = c => amt < 0 ? c * (1 + amt) : c + (255 - c) * amt;
  v = `rgb(${f(r) | 0},${f(g) | 0},${f(b) | 0})`;
  _shade.set(key, v);
  return v;
}
const colOf = p => TRIBES[S.players[p].tribe].color;

// ---------- geometry ----------
const iso = (x, y) => [(x - y) * TW / 2, (x + y) * TH / 2];
function screenToTile(sx, sy) {
  const wx = (sx - W / 2) / cam.z + cam.x, wy = (sy - H / 2) / cam.z + cam.y;
  const a = wx / (TW / 2), b = wy / (TH / 2);
  return [Math.round((a + b) / 2), Math.round((b - a) / 2)];
}
const toScreen = (wx, wy) => [(wx - cam.x) * cam.z + W / 2, (wy - cam.y) * cam.z + H / 2];
function clampCam() {
  if (!S) return;
  const n = S.n;
  cam.z = clamp(cam.z, ZMIN, ZMAX);
  cam.x = clamp(cam.x, -n * TW / 2, n * TW / 2);
  cam.y = clamp(cam.y, -TH, n * TH);
}
const panelH = () => mode === 'game' && !$('#panel').hidden ? $('#panel').offsetHeight + 80 : 0;
// Where on screen a focused tile should sit: in the clear space between the HUD and the panel.
function focusY() { return (70 + (H - panelH())) / 2; }
function centerOn(x, y) { const [wx, wy] = iso(x, y); cam.x = wx; cam.y = wy - (focusY() - H / 2) / cam.z; clampCam(); }
// Glide the camera so a tile is not hidden under the HUD or the panel.
function ensureVisible(x, y) {
  const [wx, wy] = iso(x, y), [sx, sy] = toScreen(wx, wy);
  if (sy > 90 && sy < H - panelH() - 20 && sx > 30 && sx < W - 30) return;
  const fx = cam.x, fy = cam.y;
  const tx = wx, ty = wy - (focusY() - H / 2) / cam.z;
  tween(260, t => { const e = 1 - (1 - t) ** 3; cam.x = fx + (tx - fx) * e; cam.y = fy + (ty - fy) * e; clampCam(); });
}

// ---------- drawing primitives ----------
function poly(pts, fill) {

}
function dot(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function line(x1, y1, x2, y2, col, w) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function dpath(cx, cy, w = TW / 2, h = TH / 2) {

}
// A triangle split down its apex into a lit and a shaded facet — the low-poly look.

const anims = [];

// ---------- animation hooks for the rules ----------
const SPEEDS = { normal: { step: 120, pause: 140 }, fast: { step: 55, pause: 50 }, instant: { step: 0, pause: 0 } };

const onScreen = (x, y) => S && !S.demo && seen(I(x, y));
FX.move = async (u, path) => {
  const human = isHuman(u.owner);

  if (!ms || (!human && !onScreen(u.x, u.y) && !path.some(i => seen(i)))) return;

};

  } else {

FX.float = (x, y, text, color) => { if (onScreen(x, y)) { floats.push({ x, y, text, color, t0: performance.now(), ms: 1200 }); kick(); } };
FX.say = (msg, p, c, always) => { if (!S.demo && (always || isHuman(p) || !c || onScreen(c.x, c.y))) toast(msg); };

// ---------- input ----------
const ptrs = new Map();
let drag = null, pinch = null;
cv.addEventListener('pointerdown', e => {
  try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false };
  else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: cam.z, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, cx: cam.x, cy: cam.y };
    if (drag) drag.moved = true;
  }
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId) || mode !== 'game') return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const z = clamp(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, ZMIN, ZMAX);
    const wx = (pinch.mx - W / 2) / pinch.z + pinch.cx, wy = (pinch.my - H / 2) / pinch.z + pinch.cy;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    cam.z = z; cam.x = wx - (mx - W / 2) / z; cam.y = wy - (my - H / 2) / z;
    clampCam(); kick();
  } else if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 10) drag.moved = true;
    if (drag.moved) { cam.x = drag.cx - dx / cam.z; cam.y = drag.cy - dy / cam.z; clampCam(); kick(); }
  }
});
function endPointer(e) {
  const tap = e.type === 'pointerup' && drag && !drag.moved && ptrs.size === 1;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 1) { const [r] = [...ptrs.values()]; drag = { x: r.x, y: r.y, cx: cam.x, cy: cam.y, moved: true }; }
  else if (!ptrs.size) drag = null;
  if (tap) onTap(e.clientX, e.clientY);
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('wheel', e => {
  if (mode !== 'game') return;
  e.preventDefault();
  const wx = (e.clientX - W / 2) / cam.z + cam.x, wy = (e.clientY - H / 2) / cam.z + cam.y;
  cam.z = clamp(cam.z * Math.exp(-e.deltaY * .0015), ZMIN, ZMAX);
  cam.x = wx - (e.clientX - W / 2) / cam.z; cam.y = wy - (e.clientY - H / 2) / cam.z;
  clampCam(); kick();
}, { passive: false });
addEventListener('keydown', e => {
  if (mode !== 'game' || !$('#modal').hidden) return;
  if (e.key === 'Escape') select(null);
  else if (e.key === 'n' || e.key === 'Tab') { e.preventDefault(); nextUnit(); }
  else if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
  else if (e.key.startsWith('Arrow')) {
    const d = 40 / cam.z;
    cam.x += e.key === 'ArrowLeft' ? -d : e.key === 'ArrowRight' ? d : 0;
    cam.y += e.key === 'ArrowUp' ? -d : e.key === 'ArrowDown' ? d : 0;
    clampCam(); kick();
  }
});

function onTap(sx, sy) {
  if (mode !== 'game' || busy || !$('#modal').hidden) return;
  ripples.push({ x: sx, y: sy, t0: performance.now() }); kick();
  const [x, y] = screenToTile(sx, sy);
  if (!inb(x, y)) { select(null); return; }
  tapTile(x, y);
}
function tapTile(x, y) {
  const i = I(x, y);
  if (sel && sel.kind === 'unit' && !S.over) {
    const u = unitById(sel.id);
    if (u && u.owner === 0) {
      if (selMoves.dests.has(i)) { buzz(15); const prev = selMoves.prev; return act(() => doMove(u, i, prev), { undo: 'move' }); }
      const tg = selTargets.find(e => e.x === x && e.y === y);
      if (tg) return act(() => doAttack(u, tg));
    }
  }
  const u = seen(i) ? unitAt(x, y) : null;
  if (u && !(sel && sel.kind === 'unit' && sel.id === u.id)) select({ kind: 'unit', id: u.id });
  else if (sel && sel.kind === 'tile' && sel.i === i) select(null);
  else select({ kind: 'tile', i });
}
function select(s, pan = true) {
  sel = s;
  refreshSel();
  renderPanel();
  if (sel) { buzz(8); if (pan) { const t = selectedTile(); if (t) ensureVisible(...t); } }
  kick();
}
function refreshSel() {
  selMoves = { dests: new Set(), prev: new Map() }; selTargets = [];
  if (!sel || !S) return;
  if (sel.kind === 'unit') {
    const u = unitById(sel.id);

}
const readyUnits = () => S ? unitsOf(0).filter(u => !exhausted(u)) : [];
// Hop to the next unit that still has something to do.
function nextUnit() {
  if (busy || !S || S.over) return;
  const list = readyUnits();
  if (!list.length) {
    toast('Everyone has acted. Tap End turn when you are ready.');
    $('#btnEnd').classList.add('nudge'); buzz(20);
    return;
  }
  const cur = sel && sel.kind === 'unit' ? list.findIndex(u => u.id === sel.id) : -1;
  const u = list[(cur + 1) % list.length];

  const [wx, wy] = iso(u.x, u.y), fx = cam.x, fy = cam.y, ty = wy - (focusY() - H / 2) / cam.z;

/* Tribelands — the HUD, the bottom panel, the floating buttons and every sheet. */

// ---------- doing things ----------
// `o.undo` names the action ("move", "hunt"…) and makes it undoable.
async function act(fn, o = {}) {
  if (busy || !S || S.over) return;
  busy = true;
  const snap = JSON.stringify(S);
  revealed = 0;
  const hadRewards = S.pendingRewards.length;
  let msg;
  try { msg = await fn(); }
  catch (err) { console.error(err); }
  busy = false;
  disbandArm = null;
  if (o.undo && revealed === 0 && S.pendingRewards.length === hadRewards) {
    undoStack.push({ snap, label: o.undo });
    if (undoStack.length > 40) undoStack.shift();
  } else undoStack = [];
  if (typeof msg === 'string' && msg !== 'idol') toast(msg);
  afterAction();
}
function afterAction() {
  checkElims();
  saveGame();
  refreshSel();
  renderHud();
  renderPanel();
  kick();
  if (!$('#modal').hidden && $('#modal').dataset.closable === '') return;   // a choice is already open
  if (S.pendingRewards.length) showReward();
  else if (S.offer && S.offer.from != null && !S.over) showOffer();
  else if (S.challenge && !S.challenge.seen && !S.over) showChallenge();
  else if (S.event && S.event.turn === S.turn && !S.event.seen && !S.over) showEvent();
  else if (S.over && !S.overShown) showGameOver();
}
function undo() {
  if (busy || !undoStack.length) return;
  S = JSON.parse(undoStack.pop().snap);
  disbandArm = null; buzz(10);
  refreshSel(); renderHud(); renderPanel(); saveGame(); kick();
}
async function endTurn() {
  if (busy || !S || S.over) return;
  buzz(20);
  busy = true;
  sel = null; undoStack = []; disbandArm = null;
  $('#btnEnd').classList.remove('nudge');
  refreshSel();
  for (let p = 1; p < S.players.length; p++) {
    if (!S.players[p].alive) continue;
    S.cur = p;
    renderHud(); renderPanel();
    startTurn(p);
    try { await aiTurn(p); } catch (err) { console.error(err); }
    checkElims();
    kick();
    if (S.over) break;
  }
  if (!S.over) {
    S.turn++;
    S.cur = 0;
    revealed = 0;
    beginRound();
    startTurn(0);
    vision();
    toast(`Day ${S.turn} · +${income(0)} ${SH}`);
  }
  busy = false;
  afterAction();
}

function unitPanel(u, info, acts) {

    : homeCount(c) >= capacity(c) ? `🏕️ ${c.name} can support ${capacity(c)} units and has ${homeCount(c)}. Grow the camp (or send a unit home) to train more.` : '';
  if (common) add(`<div class="banner">${common}</div>`);
  for (const k of TRAINABLE) {
    const U = UNITS[k];
    if (U.tech && !has(0, U.tech)) continue;
    const sk = Object.keys(SKILLS).filter(x => U[x]).map(x => SKILLS[x][0]).join(', ');
    add(actBtn({ a: 'train:' + k, icon: U.icon, title: U.name, effect: `⚔️${U.atk} 🛡️${U.def} 👣${U.mv}${U.rng > 1 ? ' 🎯' + U.rng : ''} · ${U.hp} HP${sk ? ' · ' + sk : ''}`,
      cost: U.cost, block: trainBlock(0, c, k), quiet: !!common }));
  }
  const locked = TRAINABLE.filter(k => UNITS[k].tech && !has(0, UNITS[k].tech)).length;
  if (locked) add(hint(`🧠 ${locked} more unit types unlock through Skills.`));
  const wk = Object.keys(WONDERS).filter(k => has(0, WONDERS[k].tech) || S.wonders[k] != null);
  if (wk.length) {
    add(sec('Landmarks — one of each in all the islands'));
    const holds = Object.keys(S.wonders).find(k => S.wonders[k] === c.id);
    if (holds) add(`<div class="banner">${WONDERS[holds].icon} <b>${WONDERS[holds].name}</b> stands here: ${WONDERS[holds].desc} A camp holds one landmark, so raise the others elsewhere.</div>`);
    for (const k of wk) {
      if (k === holds) continue;
      const Wd = WONDERS[k], elsewhere = S.wonders[k] != null;
      const who = elsewhere ? `The ${TRIBES[S.players[wonderOwner(k)].tribe].name} hold it in ${S.cities[S.wonders[k]].name}` : '';
      add(actBtn({ a: 'wonder:' + k, icon: Wd.icon, title: Wd.name, effect: Wd.desc + (elsewhere ? ` <b>${who}.</b>` : ''), cost: elsewhere ? null : Wd.cost,
        block: elsewhere ? 'Taken' : wonderBlock(0, c, k), quiet: elsewhere || !!holds, go: true, wide: true }));
    }
  }
}
function defNote(t) {

  if (t.t === SHALLOW) return tribeIs(0, 1) ? ' · Your units can wade here' : ' · Build a raft dock to take to the water';

$('#pacts').addEventListener('click', e => {
  const b = e.target.closest('button[data-a]');
  if (!b || b.disabled || busy) return;
  const [a, k] = b.dataset.a.split(':');
  const u = sel && sel.kind === 'unit' ? unitById(sel.id) : null;
  const i = sel && sel.kind === 'tile' ? sel.i : u ? I(u.x, u.y) : -1;
  if (a !== 'disband') disbandArm = null;
  buzz(12);
  if (a === 'capture') act(() => doCapture(u));
  else if (a === 'ruin') act(() => doRuin(u));
  else if (a === 'heal') act(() => { const n = doHeal(u); return `The Healer tended ${n} ${n === 1 ? 'unit' : 'units'}.`; }, { undo: 'heal' });
  else if (a === 'recover') act(() => doRecover(u), { undo: 'rest' });
  else if (a === 'disband') {
    if (disbandArm !== u.id) { disbandArm = u.id; renderPanel(); return; }
    act(() => { killUnit(u); S.players[0].lost--; }, { undo: 'send home' });
  }
  else if (a === 'city') select({ kind: 'tile', i });
  else if (a === 'unit') { const v = unitAt(...XY(i)); if (v) select({ kind: 'unit', id: v.id }); }
  else if (a === 'train') act(() => { doTrain(0, cityAtI(i), k); }, { undo: 'train' });
  else if (a === 'work') act(() => doWork(0, i, k), { undo: WORKS[k].name.toLowerCase() });
  else if (a === 'wonder') act(() => { doWonder(0, cityAtI(i), k); return WONDERS[k].name + ' raised!'; });
});

  };

function techDetail() {
  const el = $('#tdetail');

    <h4>Difficulty</h4>${seg('diff', [['easy', 'Easy'], ['normal', 'Normal'], ['hard', 'Hard']])}
    <p class="muted" style="font-size:14px">${{ easy: 'Rivals are hesitant and slow to attack.', normal: 'Rivals expand, gang up on camps and play to win.', hard: `Rivals start richer and earn +2 ${SH} every day.` }[newOpts.diff]}</p>
    <div class="row" style="margin-top:18px"><button class="big primary" id="startGame">Wash ashore</button></div>`);
  $('#sheet').querySelectorAll('[data-tribe]').forEach(b => b.addEventListener('click', () => { newOpts.tribe = +b.dataset.tribe; buzz(8); const top = $('#sheet').scrollTop; openNewGame(); $('#sheet').scrollTop = top; }));
  $('#sheet').querySelectorAll('[data-seg] button').forEach(b => b.addEventListener('click', () => {
    const k = b.parentNode.dataset.seg;
    newOpts[k] = k === 'opponents' ? +b.dataset.v : b.dataset.v;
    buzz(8); const top = $('#sheet').scrollTop; openNewGame(); $('#sheet').scrollTop = top;
  }));
  $('#startGame').addEventListener('click', () => {
    if (S && !S.demo && !S.over && mode === 'game' && !confirm('Start a new game? The current one will be replaced.')) return;
    prefs.last = Object.assign({}, newOpts); savePrefs();
    closeSheet();
    startGame(newGame(newOpts));
  });
}

function startGame(state) {
  S = state;
  mode = 'game';
  busy = false; sel = null; undoStack = [];
  $('#title').hidden = true;
  renderHud(); renderPanel();
  const cap = S.cities.find(c => c.owner === 0 && c.capital) || S.cities.find(c => c.owner === 0);
  cam.z = clamp(Math.min(W, H) / (TW * 4.3), 1, 2.2);
  if (cap) centerOn(cap.x, cap.y);
  refreshSel(); saveGame(); kick();
  if (S.turn === 1 && S.cur === 0 && !S.pendingRewards.length && !S.over) {
    const T = TRIBES[S.players[0].tribe];
    openSheet(`<div class="bigicon">🏝️</div><h2>The ${T.name} wash ashore</h2>
      <p>A storm wrecked the ships. Four tribes are stranded on the Ember Isles, and only one will be left standing.</p>
      <p class="muted">${T.trait.icon} <b>${T.trait.name}</b>: ${T.trait.desc}</p>
      <ul class="help"><li>Tap your unit (the green ring), then a white marker to move.</li><li>Tap resources in your land to grow your camp.</li><li>Tap 🧠 Skills to learn new ways to survive.</li></ul>
      <div class="row"><button class="big primary" data-x>Let’s survive</button></div>`);
  } else afterAction();
}
const demoCam = { x: 0, y: 0 };
function toTitle() {
  mode = 'title';
  closeSheet();
  S = newGame({ tribe: rnd(4), opponents: 3, size: 'medium', diff: 'normal' });
  S.demo = true;
  S.explored.fill(1);
  for (const c of S.cities) if (c.owner < 0 && Math.random() < .5) { c.owner = rnd(4); c.level = 1 + rnd(3); claim(c); }
  for (const c of S.cities) if (c.owner >= 0) c.level = Math.max(c.level, 1 + rnd(4));
  cam.z = clamp(Math.min(W, H) / (TW * 5.2), .8, 1.6);
  const [wx, wy] = iso(S.n / 2, S.n / 2);
  demoCam.x = wx; demoCam.y = wy + H * .18 / cam.z;     // sit the islands above the menu
  $('#title').hidden = false;
  renderHud(); renderPanel();
  const saved = loadSave();
  const m = $('#tmenu');
  m.innerHTML = (saved && !saved.over ? `<button class="big primary" id="tContinue">Continue · ${TRIBES[saved.players[0].tribe].name}, day ${saved.turn}</button>` : '') +
    `<button class="big ${saved && !saved.over ? '' : 'primary'}" id="tNew">New game</button><button class="big" id="tHelp">How to play</button>`;
  $('#tver').textContent = 'Tribelands ' + VERSION;
  if ($('#tContinue')) $('#tContinue').addEventListener('click', () => startGame(saved));
  $('#tNew').addEventListener('click', openNewGame);
  $('#tHelp').addEventListener('click', openHelp);
  kick();
}

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  clampCam(); kick();
}
addEventListener('resize', resize);
resize();
toTitle();

// test hook: lets the browser tests drive the game without pixel-hunting
window.Tribelands = {
  get S() { return S; }, set S(v) { S = v; }, VERSION, tapTile, endTurn, act, select, undo, startGame, newGame, nextUnit,
  get busy() { return busy; }, get undoDepth() { return undoStack.length; }, moveInfo, targets, aiTurn,
};

</script>
<script>
  if (navigator.serviceWorker && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
</body>
